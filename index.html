                        <div>
                          <span style={{ color: "#D1D5DB", fontSize: 13 }}>{o.title || "Bez názvu"}</span>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          {o.price && <span style={{ color: "#9CA3AF", fontSize: 12 }}>{fmt(o.price)}</span>}
                          <span style={{ fontSize: 11, color: st.color, fontWeight: 600 }}>{st.label}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (subPage === "archive") {
    const archived = data.archive || [];
    const totalArch = archived.reduce((s, o) => s + (parseFloat(o.price) || 0), 0);
    return (
      <div style={css.app}>
        <style>{globalCss}</style>
        <div style={css.topBar}>
          <button style={css.backBtn} onClick={() => setSubPage(null)}>← Späť</button>
          <span style={css.topTitle}>📦 Archív</span>
          <span style={{ color: "#4B5563", fontSize: 13 }}>{fmt(totalArch)}</span>
        </div>
        <div style={{ padding: "8px 16px" }}>
          {archived.length === 0 && (
            <div style={{ textAlign: "center", color: "#374151", padding: 60 }}>
              <div style={{ fontSize: 40, marginBottom: 12 }}>📦</div>
              <div>Archív je prázdny</div>
              <div style={{ fontSize: 12, marginTop: 8, color: "#374151" }}>Hotové a vyplatené zákazky tu presunúť tlačidlom v detaile</div>
            </div>
          )}
          {archived.map(o => {
            const price = parseFloat(o.price) || 0;
            const deposit = parseFloat(o.depositPaid) || 0;
            const mat = (o.materials || []).reduce((s, m) => s + (m.cost || 0), 0);
            const profit = price - mat;
            return (
              <div key={o.id} style={{ background: "#0D1117", borderRadius: 12, padding: "14px 16px", marginBottom: 10, border: "1px solid #1F2937" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                  <div>
                    <div style={{ color: "#F9FAFB", fontWeight: 700, fontSize: 15 }}>{o.customerName || "—"}</div>
                    <div style={{ color: "#6B7280", fontSize: 13 }}>{o.title || "—"}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ color: "#10B981", fontWeight: 700 }}>{fmt(price)}</div>
                    {mat > 0 && <div style={{ color: profit >= 0 ? "#10B981" : "#EF4444", fontSize: 12 }}>zisk {fmt(profit)}</div>}
                  </div>
                </div>
                <div style={{ color: "#374151", fontSize: 12 }}>Archivované {fmtDate(o.archivedAt)}</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  if (subPage === "backup") {
    function exportData() {
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `lupana-zaloha-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed.orders) { alert("Neplatný súbor zálohy."); return; }
          if (!window.confirm("Toto prepíše všetky aktuálne dáta. Pokračovať?")) return;
          setData(parsed);
          alert("Dáta úspešne obnovené!");
          setSubPage(null);
        } catch {
          alert("Chyba pri čítaní súboru.");
        }
      };
      reader.readAsText(file);
    }

    const orderCount = (data.orders || []).length;
    const archiveCount = (data.archive || []).length;
    const lastBackup = data.lastBackup ? fmtDate(data.lastBackup) : null;

    return (
      <div style={css.app}>
        <style>{globalCss}</style>
        <div style={css.topBar}>
          <button style={css.backBtn} onClick={() => setSubPage(null)}>← Späť</button>
          <span style={css.topTitle}>💾 Zálohovanie dát</span>
        </div>
        <div style={{ padding: "20px 16px" }}>

          {/* Warning */}
          <div style={{ background: "#1C1400", border: "1px solid #78350F", borderRadius: 12, padding: "14px 16px", marginBottom: 20 }}>
            <div style={{ color: "#F59E0B", fontWeight: 700, fontSize: 14, marginBottom: 4 }}>⚠️ Dôležité upozornenie</div>
            <div style={{ color: "#92400E", fontSize: 13, lineHeight: 1.6 }}>Dáta sú uložené len v tomto prehliadači. Ak vymažeš cache alebo použiješ iné zariadenie, dáta sa stratia. Pravidelne si robí zálohu!</div>
          </div>

          {/* Stats */}
          <div style={{ background: "#111827", borderRadius: 12, border: "1px solid #1F2937", marginBottom: 20, overflow: "hidden" }}>
            <div style={{ padding: "12px 16px", borderBottom: "1px solid #1F2937", display: "flex", justifyContent: "space-between" }}>
              <span style={{ color: "#6B7280", fontSize: 14 }}>Aktívne zákazky</span>
              <span style={{ color: "#F9FAFB", fontWeight: 700 }}>{orderCount}</span>
            </div>
            <div style={{ padding: "12px 16px", borderBottom: "1px solid #1F2937", display: "flex", justifyContent: "space-between" }}>
              <span style={{ color: "#6B7280", fontSize: 14 }}>V archíve</span>
              <span style={{ color: "#F9FAFB", fontWeight: 700 }}>{archiveCount}</span>
            </div>
            <div style={{ padding: "12px 16px", display: "flex", justifyContent: "space-between" }}>
              <span style={{ color: "#6B7280", fontSize: 14 }}>Posledná záloha</span>
              <span style={{ color: lastBackup ? "#10B981" : "#EF4444", fontWeight: 600 }}>{lastBackup || "Nikdy"}</span>
            </div>
          </div>

          {/* Export */}
          <button
            style={{ width: "100%", background: "#1E3A5F", border: "1px solid #2563EB", borderRadius: 12, color: "#60A5FA", fontWeight: 700, fontSize: 16, padding: "16px 0", cursor: "pointer", fontFamily: "inherit", marginBottom: 12 }}
            onClick={() => { exportData(); setData(d => ({ ...d, lastBackup: Date.now() })); }}
          >
            ⬇️ Stiahnuť zálohu (.json)
          </button>

          {/* Import */}
          <label style={{ display: "block", width: "100%", background: "#111827", border: "1px solid #374151", borderRadius: 12, color: "#9CA3AF", fontWeight: 700, fontSize: 16, padding: "16px 0", cursor: "pointer", fontFamily: "inherit", textAlign: "center", boxSizing: "border-box" }}>
            ⬆️ Obnoviť zo zálohy
            <input type="file" accept=".json" style={{ display: "none" }} onChange={importData} />
          </label>

          <div style={{ color: "#374151", fontSize: 12, textAlign: "center", marginTop: 16, lineHeight: 1.6 }}>
            Záloha obsahuje všetky zákazky, archív, poznámky, materiál a časy.
          </div>
        </div>
      </div>
    );
  }

  /* ──────────────────────────────────────────────
     PAGE: LIST (DASHBOARD)
  ────────────────────────────────────────────── */
  return (
    <div style={css.app}>
      <style>{globalCss}</style>

      {/* TOP */}
      <div style={css.dashTop}>
        <div style={{ position: "relative" }}>
          <div style={{ ...css.appName, cursor: "pointer", userSelect: "none" }} onClick={() => setShowMenu(m => !m)}>
            LUPANA <span style={{ color: "#374151", fontSize: 14, fontWeight: 400 }}>{showMenu ? "▲" : "▼"}</span>
          </div>
          <div style={{ color: "#4B5563", fontSize: 12 }}>{orders.length} zákaziek celkovo</div>

          {/* Dropdown menu */}
          {showMenu && (
            <div style={{ position: "absolute", top: "100%", left: 0, marginTop: 8, background: "#111827", border: "1px solid #1F2937", borderRadius: 12, overflow: "hidden", zIndex: 50, minWidth: 200, boxShadow: "0 8px 24px rgba(0,0,0,0.5)" }}>
              {[
                { icon: "👥", label: "Zákazníci", key: "customers" },
                { icon: "📊", label: "Ročný prehľad", key: "yearly" },
                { icon: "📅", label: "Kalendár", key: "calendar" },
                { icon: "📦", label: "Archív", key: "archive" },
                { icon: "💾", label: "Zálohovanie dát", key: "backup" },
              ].map(item => (
                <button key={item.key}
                  style={{ width: "100%", background: "none", border: "none", borderBottom: "1px solid #1F2937", color: "#D1D5DB", fontSize: 15, padding: "14px 18px", textAlign: "left", cursor: "pointer", display: "flex", alignItems: "center", gap: 12, fontFamily: "inherit" }}
                  onClick={() => { setSubPage(item.key); setShowMenu(false); }}
                >
                  <span style={{ fontSize: 18 }}>{item.icon}</span> {item.label}
                </button>
              ))}
            </div>
          )}
        </div>
        <button style={css.newBtn} onClick={() => { setForm(emptyForm()); setPage("new"); }}>+ Nová</button>
      </div>

      {/* BACKUP REMINDER */}
      {(() => {
        const lastBackup = data.lastBackup;
        const oneWeek = 7 * 24 * 60 * 60 * 1000;
        const needsBackup = !lastBackup || (Date.now() - lastBackup > oneWeek);
        if (!needsBackup) return null;
        const daysAgo = lastBackup ? Math.floor((Date.now() - lastBackup) / (24*60*60*1000)) : null;
        return (
          <div style={{ margin: "0 16px 12px", background: "#1C1400", border: "1px solid #78350F", borderRadius: 12, padding: "12px 14px", display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 20 }}>💾</span>
            <div style={{ flex: 1 }}>
              <div style={{ color: "#F59E0B", fontWeight: 700, fontSize: 13 }}>
                {lastBackup ? `Záloha pred ${daysAgo} dňami` : "Zatiaľ bez zálohy"}
              </div>
              <div style={{ color: "#92400E", fontSize: 12 }}>Odporúčame zálohovať raz týždenne</div>
            </div>
            <button
              style={{ background: "#F59E0B", border: "none", borderRadius: 8, color: "#000", fontWeight: 700, fontSize: 12, padding: "8px 12px", cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}
              onClick={() => { quickExport(data); setData(d => ({ ...d, lastBackup: Date.now() })); }}
            >⬇️ Záloha</button>
          </div>
        );
      })()}

      {/* SUMMARY CARDS */}
      <div style={css.summaryGrid}>
        <SummaryCard label="Celkový objem" val={fmt(totalPrice)} color="#3B82F6" />
        <SummaryCard label="Prijaté zálohy" val={fmt(totalDeposit)} color="#F59E0B" />
        <SummaryCard label="Doplatok celkový" val={fmt(totalDue > 0 ? totalDue : 0)} color={totalDue > 0 ? "#EF4444" : "#10B981"} />
        <SummaryCard label="Počet zákaziek" val={orders.length} color="#8B5CF6" suffix="ks" />
      </div>

      {/* STATUS FILTER PILLS */}
      <div style={css.pillRow}>
        {[
          { key: "all",           label: "Všetky",       count: orders.length,                                                              color: "#3B82F6", bg: "#1E3A5F", dot: "#60A5FA" },
          { key: "rozpracovane",  label: "Rozpracované", count: orders.filter(o => ["nacenena","vo_vyrobe","sklada_sa","pripravena"].includes(o.status)).length, color: "#F59E0B", bg: "#292300", dot: "#F59E0B" },
          { key: "hotova",        label: "Hotové",       count: orders.filter(o => o.status === "hotova").length,                           color: "#10B981", bg: "#052E1C", dot: "#10B981" },
        ].map(f => (
          <button key={f.key}
            style={{ ...css.pill, ...(filterStatus === f.key ? { background: f.bg, color: f.color, borderColor: f.color } : {}) }}
            onClick={() => setFilterStatus(f.key)}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: filterStatus === f.key ? f.dot : "#4B5563", display: "inline-block", marginRight: 4 }} />
            {f.label} ({f.count})
          </button>
        ))}
      </div>

      {/* SEARCH */}
      <div style={{ padding: "0 16px 8px" }}>
        <input style={{ ...css.inp, width: "100%", boxSizing: "border-box" }}
          value={search} onChange={e => setSearch(e.target.value)}
          placeholder="🔍  Hľadať podľa zákazníka alebo názvu..." />
      </div>

      {/* LIST */}
      <div style={css.orderList}>
        {filtered.length === 0 && (
          <div style={{ textAlign: "center", color: "#374151", padding: "60px 20px" }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>📂</div>
            <div style={{ fontSize: 16, color: "#4B5563" }}>Žiadne zákazky</div>
            <button style={{ ...css.newBtn, marginTop: 16 }} onClick={() => { setForm(emptyForm()); setPage("new"); }}>
              + Pridať prvú zákazku
            </button>
          </div>
        )}
        {filtered.map(o => {
          const st = statusOf(o.status);
          const price = parseFloat(o.price) || 0;
          const deposit = parseFloat(o.depositPaid) || 0;
          const due = price - deposit;
          const mins = totalMins(o);
          // deadline: manuálny alebo auto (+2 mesiace od zálohy)
          const deadlineDate = o.deadlineDate
            ? new Date(o.deadlineDate)
            : o.depositDate ? new Date(new Date(o.depositDate).setMonth(new Date(o.depositDate).getMonth() + 2)) : null;
          const isAutoDeadline = !o.deadlineDate && !!o.depositDate;
          const isOverdue = deadlineDate && deadlineDate < new Date() && o.status !== "storno";

          return (
            <div key={o.id}
              style={{
                ...css.orderCard,
                borderLeft: selectedCard === o.id ? `3px solid ${st.color}` : "3px solid #1F2937",
                background: selectedCard === o.id ? "#131920" : "#0D1117",
                boxShadow: selectedCard === o.id ? `0 0 0 1px ${st.color}44` : "none",
              }}
              onClick={() => setSelectedCard(selectedCard === o.id ? null : o.id)}
            >
              {/* Row 1: name + status */}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    <span style={{ color: "#F9FAFB", fontWeight: 700, fontSize: 16 }}>{o.customerName || "Bez mena"}</span>
                    {isOverdue && <span style={{ fontSize: 10, background: "#3D0A0A", color: "#EF4444", borderRadius: 4, padding: "1px 6px" }}>PO TERMÍNE</span>}
                  </div>
                  <div style={{ color: "#6B7280", fontSize: 13, marginTop: 2 }}>{o.title || "—"}</div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 3, marginLeft: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ width: 7, height: 7, borderRadius: "50%", background: selectedCard === o.id ? st.dot : "#374151", flexShrink: 0 }} />
                    <span style={{ color: selectedCard === o.id ? st.color : "#6B7280", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap" }}>{st.label}</span>
                  </div>
                  {o.status === "hotova" && (
                    <span style={{ fontSize: 10, fontWeight: 700, padding: "1px 7px", borderRadius: 10,
                      background: o.vyplatena ? "#052E1C" : "#1F0505",
                      color: o.vyplatena ? "#6EE7B7" : "#EF4444",
                      border: `1px solid ${o.vyplatena ? "#065F46" : "#3D0A0A"}`
                    }}>
                      {o.vyplatena ? "✓ Vyplatené" : "Nevyplatené"}
                    </span>
                  )}
                </div>
              </div>

              {/* Row 2: financie + čas */}
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                {price > 0 && (
                  <div style={{ display: "flex", flexDirection: "column" }}>
                    <span style={{ color: "#9CA3AF", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>cena</span>
                    <span style={{ color: selectedCard === o.id ? "#10B981" : "#9CA3AF", fontWeight: 700, fontSize: 16 }}>{fmt(price)}</span>
                  </div>
                )}
                {deposit > 0 && (
                  <div style={{ display: "flex", flexDirection: "column" }}>
                    <span style={{ color: "#9CA3AF", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>záloha</span>
                    <span style={{ color: selectedCard === o.id ? "#F59E0B" : "#6B7280", fontWeight: 700, fontSize: 16 }}>{fmt(deposit)}</span>
                  </div>
                )}
                {price > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", background: selectedCard === o.id ? (due > 0 ? "#1F0505" : "#052E1C") : "#161B22", borderRadius: 8, padding: "4px 10px", border: `1px solid ${selectedCard === o.id ? (due > 0 ? "#3D0A0A" : "#065F46") : "#1F2937"}` }}>
                    <span style={{ color: "#4B5563", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>doplatok</span>
                    <span style={{ color: selectedCard === o.id ? (due > 0 ? "#EF4444" : "#10B981") : "#6B7280", fontSize: 16, fontWeight: 700 }}>{fmt(due >= 0 ? due : 0)}</span>
                  </div>
                )}
                {price === 0 && (
                  <div style={{ display: "flex", flexDirection: "column", background: "#161B22", borderRadius: 8, padding: "4px 10px", border: "1px solid #1F2937" }}>
                    <span style={{ color: "#4B5563", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.5 }}>doplatok</span>
                    <span style={{ color: "#374151", fontSize: 14, fontWeight: 600 }}>—</span>
                  </div>
                )}
                {mins > 0 && (
                  <div style={{ marginLeft: "auto", color: "#4B5563", fontSize: 12 }}>⏱ {fmtMins(mins)}</div>
                )}
                {deadlineDate && (
                  <div style={{ color: isOverdue ? "#EF4444" : "#4B5563", fontSize: 12 }}>
                    📅 {deadlineDate.toLocaleDateString("sk-SK", { day: "2-digit", month: "2-digit", year: "numeric" })}
                    {isAutoDeadline && <span style={{ color: "#1D4ED8", marginLeft: 4 }}>(auto)</span>}
                  </div>
                )}
              </div>

              {/* Bottom action bar */}
              <div style={{ marginTop: 10, borderTop: "1px solid #1F2937", paddingTop: 8, display: "flex", alignItems: "center", gap: 6 }}>
                {/* Quick advance */}
                {STATUS_FLOW.indexOf(o.status) >= 0 && STATUS_FLOW.indexOf(o.status) < STATUS_FLOW.length - 1 && (
                  <button style={{ ...css.quickAdvance, flex: 1 }} onClick={e => { e.stopPropagation(); nextStatus(o); }}>
                    → {statusOf(STATUS_FLOW[STATUS_FLOW.indexOf(o.status) + 1]).label}
                  </button>
                )}
                <div style={{ flex: 1 }} />
                {/* Note — quick add poznámka */}
                {(() => {
                  const unresolved = (o.notes || []).filter(n => !n.resolved).length;
                  return (
                    <button
                      style={{ background: unresolved > 0 ? "#2D0A0A" : "#1a2234", border: `1px solid ${unresolved > 0 ? "#7F1D1D" : "#1F2937"}`, borderRadius: 8, color: unresolved > 0 ? "#EF4444" : "#6B7280", fontSize: 16, width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", position: "relative" }}
                      onClick={e => { e.stopPropagation(); setSelId(o.id); setTab("notes"); setPage("detail"); }}
                      title="Poznámka"
                    >
                      📝
                      {unresolved > 0 && (
                        <span style={{ position: "absolute", top: -5, right: -5, background: "#EF4444", color: "#fff", fontSize: 10, fontWeight: 700, borderRadius: "50%", width: 16, height: 16, display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1 }}>{unresolved}</span>
                      )}
                    </button>
                  );
                })()}
                {/* Material */}
                <button
                  style={{ background: "#1a2234", border: "1px solid #1F2937", borderRadius: 8, color: "#6B7280", fontSize: 16, width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
                  onClick={e => { e.stopPropagation(); setSelId(o.id); setTab("materials"); setShowMatForm(true); setPage("detail"); }}
                  title="Materiál"
                >🧱</button>
                {/* Clock — quick time log */}
                <button
                  style={{ background: "#1a2234", border: "1px solid #1F2937", borderRadius: 8, color: "#6B7280", fontSize: 16, width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
                  onClick={e => { e.stopPropagation(); setSelId(o.id); setTab("time"); setShowTimeLog(true); setPage("detail"); }}
                  title="Pridať čas"
                >⏱</button>
                {/* Pencil — open detail */}
                <button
                  style={{ background: "#1a2234", border: "1px solid #1F2937", borderRadius: 8, color: "#6B7280", fontSize: 16, width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
                  onClick={e => { e.stopPropagation(); openDetail(o.id); }}
                  title="Otvoriť zákazku"
                >✏️</button>
              </div>
            </div>
          );
        })}
      </div>
      <SmsModal modal={smsModal} onWhatsApp={openWhatsApp} onSms={openSms} onClose={() => setSmsModal(null)} />
      <ConfirmModal open={!!confirmDelete} onConfirm={confirmDeleteOrder} onCancel={() => setConfirmDelete(null)} />
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   CONFIRM MODAL
═══════════════════════════════════════════════════ */
function ConfirmModal({ open, onConfirm, onCancel }) {
  if (!open) return null;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: "#111827", borderRadius: "16px 16px 0 0", padding: 24, width: "100%", maxWidth: 560, border: "1px solid #1F2937", borderBottom: "none" }}>
        <div style={{ color: "#F9FAFB", fontWeight: 700, fontSize: 17, marginBottom: 8 }}>Vymazať zákazku?</div>
        <div style={{ color: "#6B7280", fontSize: 14, marginBottom: 24 }}>Táto akcia sa nedá vrátiť späť.</div>
        <div style={{ display: "flex", gap: 10 }}>
          <button
            style={{ flex: 1, background: "#7F1D1D", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, fontSize: 15, padding: "14px 0", cursor: "pointer", fontFamily: "inherit" }}
            onClick={onConfirm}
          >🗑 Vymazať</button>
          <button
            style={{ flex: 1, background: "#1F2937", border: "1px solid #374151", borderRadius: 10, color: "#9CA3AF", fontWeight: 600, fontSize: 15, padding: "14px 0", cursor: "pointer", fontFamily: "inherit" }}
            onClick={onCancel}
          >Zrušiť</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   SMS MODAL
═══════════════════════════════════════════════════ */
function SmsModal({ modal, onWhatsApp, onSms, onClose }) {
  if (!modal) return null;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 100, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: "#111827", borderRadius: "16px 16px 0 0", padding: 24, width: "100%", maxWidth: 560, border: "1px solid #1F2937", borderBottom: "none" }}>
        <div style={{ color: "#9CA3AF", fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Notifikácia zákazníkovi</div>
        <div style={{ color: "#F9FAFB", fontSize: 14, lineHeight: 1.6, background: "#0D1117", borderRadius: 10, padding: "12px 14px", marginBottom: 16, border: "1px solid #1F2937" }}>
          {modal.text}
        </div>
        <div style={{ color: "#6B7280", fontSize: 12, marginBottom: 16 }}>📱 {modal.phone}</div>
        <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
          <button
            style={{ flex: 1, background: "#075E54", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, fontSize: 15, padding: "14px 0", cursor: "pointer", fontFamily: "inherit" }}
            onClick={() => onWhatsApp(modal.cleanPhone, modal.text)}
          >
            💬 WhatsApp
          </button>
          <button
            style={{ flex: 1, background: "#1D4ED8", border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, fontSize: 15, padding: "14px 0", cursor: "pointer", fontFamily: "inherit" }}
            onClick={() => onSms(modal.cleanPhone, modal.text)}
          >
            📨 SMS
          </button>
        </div>
        <button
          style={{ width: "100%", background: "none", border: "1px solid #1F2937", borderRadius: 10, color: "#6B7280", fontSize: 14, padding: "12px 0", cursor: "pointer", fontFamily: "inherit" }}
          onClick={onClose}
        >
          Preskočiť
        </button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   SMALL COMPONENTS
═══════════════════════════════════════════════════ */
function Section({ icon, title, children }) {
  return (
    <div style={{ margin: "0 16px 16px" }}>
      <div style={{ color: "#6B7280", fontSize: 11, textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
        {icon} {title}
      </div>
      <div style={{ background: "#111827", borderRadius: 12, padding: "4px 16px", border: "1px solid #1F2937" }}>
        {children}
      </div>
    </div>
  );
}

function Row2({ children }) {
  return <div style={{ display: "flex", gap: 12 }}>{children}</div>;
}

function Field({ label, children }) {
  return (
    <div style={{ flex: 1, padding: "10px 0" }}>
      <div style={{ color: "#6B7280", fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>{label}</div>
      {children}
    </div>
  );
}

function InfoCard({ title, children }) {
  return (
    <div style={{ margin: "12px 16px" }}>
      <div style={{ color: "#4B5563", fontSize: 11, textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 8 }}>{title}</div>
      <div style={{ background: "#111827", borderRadius: 12, border: "1px solid #1F2937", overflow: "hidden" }}>
        {children}
      </div>
    </div>
  );
}

function InfoRow({ label, val, big }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 16px", borderBottom: "1px solid #1a2234" }}>
      <span style={{ color: "#4B5563", fontSize: 13 }}>{label}</span>
      <span style={{ color: big ? "#F9FAFB" : "#9CA3AF", fontSize: big ? 16 : 14, fontWeight: big ? 700 : 400 }}>{val}</span>
    </div>
  );
}

function DateInput({ val, onChange, onClear }) {
  return (
    <div style={{ position: "relative", display: "flex", alignItems: "center" }}>
      <input style={{ background: "#030712", border: "1px solid #1F2937", borderRadius: 8, color: val ? "#F9FAFB" : "#374151", padding: "10px 36px 10px 12px", fontSize: 14, fontFamily: "'IBM Plex Sans', sans-serif", width: "100%" }}
        type="date" value={val} onChange={onChange} />
      {val && (
        <button
          onClick={onClear}
          style={{ position: "absolute", right: 8, background: "none", border: "none", color: "#6B7280", fontSize: 16, cursor: "pointer", padding: "2px 4px", lineHeight: 1 }}
        >✕</button>
      )}
    </div>
  );
}

function SummaryCard({ label, val, color, suffix }) {
  return (
    <div style={{ background: "#111827", borderRadius: 10, padding: "10px 10px", border: "1px solid #1F2937", flex: 1, minWidth: 0, overflow: "hidden" }}>
      <div style={{ color: "#4B5563", fontSize: 9, textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 4, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{label}</div>
      <div style={{ color, fontWeight: 700, fontSize: 13, letterSpacing: "-0.3px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{val}{suffix ? " " + suffix : ""}</div>
    </div>
  );
}
