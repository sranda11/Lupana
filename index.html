<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LUPANA" />
  <title>LUPANA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #030712; font-family: sans-serif; }
    #root { max-width: 560px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="root"><div style="color:#fff;text-align:center;padding:40px;font-family:sans-serif">Načítavam...</div></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBa7GKMgliNEcEVYVIOy3_kpFV3y8HiExA",
      authDomain: "zakazky-bf19b.firebaseapp.com",
      projectId: "zakazky-bf19b",
      storageBucket: "zakazky-bf19b.firebasestorage.app",
      messagingSenderId: "649607449738",
      appId: "1:649607449738:web:bb9dcf92448c3078afb173"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Make available globally BEFORE React renders
    window._db = db;
    window._doc = doc;
    window._onSnapshot = onSnapshot;
    window._setDoc = setDoc;
    window._firebaseReady = true;

    // Now trigger React render
    const script = document.getElementById("app-script");
    script.type = "text/babel";
    Babel.transformScriptTags();
  </script>

  <script id="app-script" type="text/plain" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // Firebase via globals set by module
    const db = window._db;
    const _doc = window._doc;
    const _onSnapshot = window._onSnapshot;
    const _setDoc = window._setDoc;


/* ═══════════════════════════════════════════════════
   FIREBASE CONFIG
═══════════════════════════════════════════════════ */


/* ═══════════════════════════════════════════════════
   PERSISTENCE (localStorage fallback)
═══════════════════════════════════════════════════ */
const KEY = "zakazky-pro-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { orders: [] }; } catch { return { orders: [] }; } };
const persist = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ═══════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════ */
const STATUSES = [
  { key: "nacenena",       label: "Naceněná",            color: "#F59E0B", bg: "#292300", dot: "#F59E0B" },
  { key: "vo_vyrobe",      label: "Vo výrobe",           color: "#3B82F6", bg: "#0D1F3C", dot: "#3B82F6" },
  { key: "sklada_sa",      label: "Skladá sa",           color: "#8B5CF6", bg: "#1E0A3C", dot: "#8B5CF6" },
  { key: "pripravena",     label: "Pripravená na montáž", color: "#F97316", bg: "#2C1000", dot: "#F97316" },
  { key: "hotova",         label: "Hotovo",              color: "#10B981", bg: "#052E1C", dot: "#10B981" },
  { key: "storno",         label: "Storno",              color: "#EF4444", bg: "#2D0A0A", dot: "#EF4444" },
];

const STATUS_FLOW = ["nacenena","vo_vyrobe","sklada_sa","pripravena","hotova"];

const fmt = (n) => {
  if (!n && n !== 0) return "—";
  return new Intl.NumberFormat("sk-SK", { style: "currency", currency: "EUR", minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(Math.round(n));
};

const fmtDate = (ts) => {
  if (!ts) return "—";
  return new Date(ts).toLocaleDateString("sk-SK", { day: "2-digit", month: "2-digit", year: "numeric" });
};

/* ═══════════════════════════════════════════════════
   EMPTY FORM
═══════════════════════════════════════════════════ */
const emptyForm = () => ({
  // zákazník
  customerName: "",
  customerPhone: "",
  customerEmail: "",
  customerNote: "",
  // zákazka
  title: "",
  description: "",
  status: "nacenena",
  // financie
  price: "",
  depositPaid: "",
  // míľniky
  contactDate: new Date().toISOString().slice(0, 10),
  approvedDate: "",      // schválená ponuka
  depositDate: "",       // prijatá záloha
  vyplatena: false,      // zákazka vyplatená
  deadlineDate: "",      // odovzdanie — ak prázdne, auto = depositDate + 2 mesiace
  // čas strávený
  timeLog: [],
  // poznámky
  notes: [],
  // materiál
  materials: [],
});

/* ═══════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════ */
function quickExport(data) {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `lupana-zaloha-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function App() {
  const [data, setData] = useState(load);
  const [syncing, setSyncing] = useState(false);
  const [syncStatus, setSyncStatus] = useState("ok"); // ok | saving | error
  const saveTimeout = useRef(null);
  const [page, setPage] = useState("list"); // list | new | detail | edit | history
  const [selId, setSelId] = useState(null);
  const [filterStatus, setFilterStatus] = useState("all");
  const [search, setSearch] = useState("");
  const [form, setForm] = useState(emptyForm());
  const [timeH, setTimeH] = useState("");
  const [timeM, setTimeM] = useState("");
  const [timeNote, setTimeNote] = useState("");
  const [timeDate, setTimeDate] = useState(new Date().toISOString().slice(0, 10));
  const [timeCategory, setTimeCategory] = useState("nakres");
  const [timeWorker, setTimeWorker] = useState("ja");
  const [showTimeLog, setShowTimeLog] = useState(false);
  const [smsModal, setSmsModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [selectedCard, setSelectedCard] = useState(null);
  const [showMenu, setShowMenu] = useState(false);
  const [tab, setTab] = useState("info");
  const [noteText, setNoteText] = useState("");
  const [matName, setMatName] = useState("");
  const [matCost, setMatCost] = useState("");
  const [matNote, setMatNote] = useState("");
  const [showMatForm, setShowMatForm] = useState(false);
  const [calYear, setCalYear] = useState(new Date().getFullYear());
  const [calMonth, setCalMonth] = useState(new Date().getMonth()); // 0-11
  const [subPage, setSubPage] = useState(null); // null | "calendar" | "yearly" | "customers" // info | finance | time | history

  // Realtime listener from Firebase
  useEffect(() => {
    const ref = _doc(db, "lupana", "data");
    const unsub = _onSnapshot(ref, (snap) => {
      if (snap.exists()) {
        const remote = snap.data().payload;
        if (remote) {
          const parsed = JSON.parse(remote);
          setData(parsed);
          persist(parsed);
        }
      }
    }, (err) => {
      console.error("Firebase sync error:", err);
      setSyncStatus("error");
    });
    return () => unsub();
  }, []);

  // Save to Firebase on data change (debounced)
  useEffect(() => {
    persist(data);
    if (saveTimeout.current) clearTimeout(saveTimeout.current);
    setSyncStatus("saving");
    saveTimeout.current = setTimeout(async () => {
      try {
        await _setDoc(_doc(db, "lupana", "data"), { payload: JSON.stringify(data) });
        setSyncStatus("ok");
      } catch (e) {
        console.error("Save error:", e);
        setSyncStatus("error");
      }
    }, 1500);
  }, [data]);

  const orders = data.orders || [];
  const sel = orders.find(o => o.id === selId);

  const ROZPRACOVANE = ["nacenena","vo_vyrobe","sklada_sa","pripravena"];
  const filtered = orders.filter(o => {
    const matchStatus =
      filterStatus === "all" ? true :
      filterStatus === "rozpracovane" ? ROZPRACOVANE.includes(o.status) :
      filterStatus === "hotova" ? o.status === "hotova" : true;
    const q = search.toLowerCase();
    const matchSearch = !q ||
      o.customerName?.toLowerCase().includes(q) ||
      o.title?.toLowerCase().includes(q) ||
      o.customerPhone?.includes(q);
    return matchStatus && matchSearch;
  }).sort((a, b) => b.createdAt - a.createdAt);

  // Stats
  const totalPrice = orders.reduce((s, o) => s + (parseFloat(o.price) || 0), 0);
  const totalDeposit = orders.reduce((s, o) => s + (parseFloat(o.depositPaid) || 0), 0);
  const totalDue = totalPrice - totalDeposit;
  const countByStatus = (k) => orders.filter(o => o.status === k).length;

  function saveOrder() {
    if (!form.title.trim() && !form.customerName.trim()) return;
    const order = {
      ...form,
      id: uid(),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      timeLog: [],
    };
    setData(d => ({ ...d, orders: [order, ...d.orders] }));
    setForm(emptyForm());
    setPage("list");
  }

  function updateOrder(id, patch) {
    setData(d => ({
      ...d,
      orders: d.orders.map(o => o.id === id ? { ...o, ...patch, updatedAt: Date.now() } : o)
    }));
  }

  function saveEdit() {
    updateOrder(selId, { ...form });
    setPage("detail");
  }

  function deleteOrder(id) {
    setConfirmDelete(id);
  }

  function confirmDeleteOrder() {
    setData(d => ({ ...d, orders: d.orders.filter(o => o.id !== confirmDelete) }));
    setConfirmDelete(null);
    setPage("list");
  }

  function archiveOrder(id) {
    const o = (data.orders || []).find(o => o.id === id);
    if (!o) return;
    setData(d => ({
      ...d,
      orders: d.orders.filter(x => x.id !== id),
      archive: [{ ...o, archivedAt: Date.now() }, ...(d.archive || [])],
    }));
    setPage("list");
  }

  function setStatus(id, status) {
    updateOrder(id, { status, [`statusHistory_${status}`]: Date.now() });
  }

  function logTime() {
    const h = parseInt(timeH) || 0;
    const m = parseInt(timeM) || 0;
    const mins = h * 60 + m;
    if (mins <= 0) return;
    const entryDate = timeDate ? new Date(timeDate).getTime() : Date.now();
    const entry = { id: uid(), mins, note: timeNote.trim(), category: timeCategory, worker: timeWorker, at: entryDate };
    updateOrder(selId, { timeLog: [entry, ...(sel.timeLog || [])] });
    setTimeH(""); setTimeM(""); setTimeNote(""); setTimeDate(new Date().toISOString().slice(0, 10)); setTimeCategory("nakres"); setTimeWorker("ja");
  }

  function deleteTimeEntry(eid) {
    updateOrder(selId, { timeLog: sel.timeLog.filter(e => e.id !== eid) });
  }

  function openDetail(id) {
    setSelId(id);
    setTab("info");
    setPage("detail");
  }

  function openEdit(o) {
    setForm({ ...emptyForm(), ...o });
    setPage("edit");
  }

  function nextStatus(o) {
    const idx = STATUS_FLOW.indexOf(o.status);
    if (idx < 0 || idx >= STATUS_FLOW.length - 1) return;
    const newStatus = STATUS_FLOW[idx + 1];
    setStatus(o.id, newStatus);
    sendSmsNotification(o, newStatus);
  }

  function addNote() {
    if (!noteText.trim()) return;
    const note = { id: uid(), text: noteText.trim(), at: Date.now(), resolved: false };
    updateOrder(selId, { notes: [note, ...(sel.notes || [])] });
    setNoteText("");
  }

  function deleteNote(nid) {
    updateOrder(selId, { notes: (sel.notes || []).filter(n => n.id !== nid) });
  }

  function toggleNote(nid) {
    updateOrder(selId, { notes: (sel.notes || []).map(n => n.id === nid ? { ...n, resolved: !n.resolved } : n) });
  }

  function addMaterial() {
    if (!matName.trim()) return;
    const mat = { id: uid(), name: matName.trim(), cost: parseFloat(matCost) || 0, note: matNote.trim(), at: Date.now() };
    updateOrder(selId, { materials: [mat, ...(sel.materials || [])] });
    setMatName(""); setMatCost(""); setMatNote(""); setShowMatForm(false);
  }

  function deleteMaterial(mid) {
    updateOrder(selId, { materials: (sel.materials || []).filter(m => m.id !== mid) });
  }

  function sendSmsNotification(o, newStatus) {
    const phone = o.customerPhone;
    if (!phone) return;
    const meno = o.customerName ? o.customerName.split(" ")[0] : "vážený zákazník";
    const nazov = o.title || "zákazka";
    const messages = {
      vo_vyrobe:  `Dobrý deň ${meno}, vaša zákazka "${nazov}" bola zaradená do výroby. V prípade otázok nás kontaktujte.`,
      sklada_sa:  `Dobrý deň ${meno}, vaša zákazka "${nazov}" sa práve skladá. Postupujeme podľa plánu.`,
      pripravena: `Dobrý deň ${meno}, vaša zákazka "${nazov}" je pripravená na montáž. Čoskoro Vás kontaktujeme ohľadom termínu.`,
      hotova:     `Dobrý deň ${meno}, vaša zákazka "${nazov}" je hotová a pripravená na odovzdanie. Tešíme sa na Vás!`,
    };
    const text = messages[newStatus];
    if (!text) return;
    const cleanPhone = phone.replace(/ /g, "");
    setSmsModal({ phone, cleanPhone, text, newStatus });
  }

  function openWhatsApp(cleanPhone, text) {
    const waPhone = cleanPhone.startsWith("+") ? cleanPhone.slice(1) : cleanPhone.startsWith("0") ? "421" + cleanPhone.slice(1) : cleanPhone;
    window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(text)}`, "_blank");
    setSmsModal(null);
  }

  function openSms(cleanPhone, text) {
    window.location.href = `sms:${cleanPhone}?body=${encodeURIComponent(text)}`;
    setSmsModal(null);
  }

  const statusOf = (k) => STATUSES.find(s => s.key === k) || STATUSES[0];
  const totalMins = (o) => (o.timeLog || []).reduce((a, e) => a + e.mins, 0);
  const fmtMins = (mins) => { const h = Math.floor(mins / 60); const m = mins % 60; return h > 0 ? `${h}h ${m > 0 ? m + "m" : ""}`.trim() : `${m}m`; };

  /* ──────────────────────────────────────────────
     PAGE: NEW / EDIT FORM
  ────────────────────────────────────────────── */
  if (page === "new" || page === "edit") {
    const isEdit = page === "edit";
    const F = (k) => form[k];
    const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

    return (
      <div style={css.app}>
        <style>{globalCss}</style>
        <div style={css.topBar}>
          <button style={css.backBtn} onClick={() => { setForm(emptyForm()); setPage(isEdit ? "detail" : "list"); }}>
            ← Späť
          </button>
          <span style={css.topTitle}>{isEdit ? "Upraviť zákazku" : "Nová zákazka"}</span>
          <button style={css.saveBtn} onClick={isEdit ? saveEdit : saveOrder}>
            {isEdit ? "Uložiť" : "Vytvoriť"}
          </button>
        </div>

        <div style={css.formScroll}>
          {/* ZÁKAZNÍK */}
          <Section icon="👤" title="Zákazník">
            <Row2>
              <Field label="Meno zákazníka *">
                <input style={css.inp} value={F("customerName")} onChange={set("customerName")} placeholder="Ján Novák" />
              </Field>
              <Field label="Telefón">
                <input style={css.inp} value={F("customerPhone")} onChange={set("customerPhone")} placeholder="+421 900 000 000" />
              </Field>
            </Row2>
            <Field label="Email">
              <input style={css.inp} value={F("customerEmail")} onChange={set("customerEmail")} placeholder="jan@email.sk" type="email" />
            </Field>
            <Field label="Poznámka o zákazníkovi">
              <textarea style={css.ta} value={F("customerNote")} onChange={set("customerNote")} placeholder="Odkiaľ prišiel, ako komunikovať..." rows={2} />
            </Field>
          </Section>

          {/* ZÁKAZKA */}
          <Section icon="📋" title="Zákazka">
            <Field label="Názov zákazky *">
              <input style={css.inp} value={F("title")} onChange={set("title")} placeholder="napr. Kuchyňa na mieru — Novákovia" />
            </Field>
            <Field label="Popis / čo sa vyrába">
              <textarea style={css.ta} value={F("description")} onChange={set("description")} placeholder="Detailný popis zákazky, rozmery, materiál, špeciálne požiadavky..." rows={4} />
            </Field>
            <Field label="Stav zákazky">
              <select style={css.inp} value={F("status")} onChange={set("status")}>
                {STATUSES.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
              </select>
            </Field>
            <Row2>
              <Field label="Prvý kontakt">
                <DateInput val={F("contactDate")} onChange={set("contactDate")} onClear={() => setForm(f => ({ ...f, contactDate: "" }))} />
              </Field>
              <Field label="Schválená ponuka">
                <DateInput val={F("approvedDate")} onChange={set("approvedDate")} onClear={() => setForm(f => ({ ...f, approvedDate: "" }))} />
              </Field>
            </Row2>
            <Row2>
              <Field label="Prijatá záloha (dátum)">
                <DateInput val={F("depositDate")} onChange={set("depositDate")} onClear={() => setForm(f => ({ ...f, depositDate: "" }))} />
              </Field>
              <Field label="Odovzdanie diela">
                <DateInput val={F("deadlineDate")} onChange={set("deadlineDate")} onClear={() => setForm(f => ({ ...f, deadlineDate: "" }))} />
                {F("depositDate") && !F("deadlineDate") && (() => {
                  const d = new Date(F("depositDate"));
                  d.setMonth(d.getMonth() + 2);
                  return <div style={{ color: "#4B5563", fontSize: 11, marginTop: 4 }}>Auto: {d.toLocaleDateString("sk-SK")}</div>;
                })()}
              </Field>
            </Row2>
          </Section>

          {/* FINANCIE */}
          <Section icon="💶" title="Financie">
            <Row2>
              <Field label="Cena zákazky (€)">
                <input style={css.inp} type="number" value={F("price")} onChange={set("price")} placeholder="0.00" />
              </Field>
              <Field label="Prijatá záloha (€)">
                <input style={css.inp} type="number" value={F("depositPaid")} onChange={set("depositPaid")} placeholder="0.00" />
              </Field>
            </Row2>
          </Section>
        </div>
      </div>
    );
  }

  /* ──────────────────────────────────────────────
     PAGE: DETAIL
  ────────────────────────────────────────────── */
  if (page === "detail" && sel) {
    const st = statusOf(sel.status);
    const price = parseFloat(sel.price) || 0;
    const deposit = parseFloat(sel.depositPaid) || 0;
    const due = price - deposit;
    const mins = totalMins(sel);
    const totalMat = (sel.materials || []).reduce((a, m) => a + (m.cost || 0), 0);
    const profit = price > 0 ? price - totalMat : null;
    const nextIdx = STATUS_FLOW.indexOf(sel.status);
    const canAdvance = nextIdx >= 0 && nextIdx < STATUS_FLOW.length - 1;
    const nextSt = canAdvance ? statusOf(STATUS_FLOW[nextIdx + 1]) : null;

    return (
      <div style={css.app}>
        <style>{globalCss}</style>
        <div style={css.topBar}>
          <button style={css.backBtn} onClick={() => setPage("list")}>← Späť</button>
          <span style={css.topTitle} title={sel.title}>{sel.title || sel.customerName}</span>
          <button style={css.editBtnTop} onClick={() => openEdit(sel)}>✎ Upraviť</button>
        </div>

        {/* STATUS BANNER */}
        <div style={{ background: st.bg, borderBottom: `2px solid ${st.color}`, padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ width: 10, height: 10, borderRadius: "50%", background: st.dot, display: "inline-block", boxShadow: `0 0 6px ${st.dot}` }} />
            <span style={{ color: st.color, fontWeight: 700, fontSize: 14, letterSpacing: 1, textTransform: "uppercase" }}>{st.label}</span>
          </div>
          {canAdvance && (
            <button
              style={{ ...css.advanceBtn, borderColor: nextSt.color, color: nextSt.color }}
              onClick={() => nextStatus(sel)}
            >
              → {nextSt.label}
            </button>
          )}
        </div>

        {/* TABS */}
        <div style={css.tabs}>
          {[["info","Info"],["finance","Financie"],["notes","Pozn."],["materials","Materiál"],["time","Čas"],["history","Log"]].map(([k,l]) => (
            <button key={k} style={{ ...css.tab, ...(tab === k ? css.tabActive : {}) }} onClick={() => setTab(k)}>{l}</button>
          ))}
        </div>

        <div style={css.detailScroll}>

          {/* TAB: INFO */}
          {tab === "info" && (
            <>
              <InfoCard title="👤 Zákazník">
                <InfoRow label="Meno" val={sel.customerName || "—"} big />
                <InfoRow label="Telefón" val={sel.customerPhone ?
                  <a href={`tel:${sel.customerPhone}`} style={{ color: "#3B82F6" }}>{sel.customerPhone}</a> : "—"} />
                <InfoRow label="Email" val={sel.customerEmail ?
                  <a href={`mailto:${sel.customerEmail}`} style={{ color: "#3B82F6" }}>{sel.customerEmail}</a> : "—"} />
                {sel.customerNote && <InfoRow label="Poznámka" val={sel.customerNote} />}
              </InfoCard>

              <InfoCard title="📋 Zákazka">
                <InfoRow label="Názov" val={sel.title || "—"} big />
                {sel.description && (
                  <div style={{ padding: "10px 16px", borderBottom: "1px solid #1a2234" }}>
                    <div style={css.infoLabel}>Popis</div>
                    <div style={{ color: "#D1D5DB", fontSize: 14, lineHeight: 1.6, marginTop: 4 }}>{sel.description}</div>
                  </div>
                )}
              </InfoCard>

              {/* MÍĽNIKY — InfoCard štýl */}
              {(() => {
                const depositDate = sel.depositDate ? new Date(sel.depositDate) : null;
                const autoDeadline = depositDate ? new Date(new Date(depositDate).setMonth(depositDate.getMonth() + 2)) : null;
                const deadlineDate = sel.deadlineDate ? new Date(sel.deadlineDate) : autoDeadline;
                const isAuto = !sel.deadlineDate && !!autoDeadline;
                const isOverdue = deadlineDate && deadlineDate < new Date() && sel.status !== "hotova";
                const fmtD = (d) => d ? d.toLocaleDateString("sk-SK", { day: "2-digit", month: "2-digit", year: "numeric" }) : null;
                return (
                  <InfoCard title="📅 Priebeh zákazky">
                    <InfoRow
                      label="Prvý kontakt"
                      val={sel.contactDate ? <span style={{ color: "#9CA3AF" }}>{fmtD(new Date(sel.contactDate))}</span> : <span style={{ color: "#374151" }}>—</span>}
                    />
                    <InfoRow
                      label="Schválená ponuka"
                      val={sel.approvedDate ? <span style={{ color: "#F59E0B", fontWeight: 600 }}>{fmtD(new Date(sel.approvedDate))}</span> : <span style={{ color: "#374151" }}>—</span>}
                    />
                    <InfoRow
                      label={<span>Prijatá záloha {sel.depositPaid ? <span style={{ color: "#3B82F6", fontWeight: 700, marginLeft: 6 }}>{fmt(sel.depositPaid)}</span> : null}</span>}
                      val={depositDate ? <span style={{ color: "#3B82F6", fontWeight: 600 }}>{fmtD(depositDate)}</span> : <span style={{ color: "#374151" }}>—</span>}
                    />
                    <InfoRow
                      label={<span>Odovzdanie diela {isAuto ? <span style={{ fontSize: 10, background: "#1E3A5F", color: "#60A5FA", borderRadius: 4, padding: "1px 5px", marginLeft: 4 }}>auto</span> : null}</span>}
                      val={deadlineDate
                        ? <span style={{ color: isOverdue ? "#EF4444" : "#10B981", fontWeight: 600 }}>
                            {fmtD(deadlineDate)}
                            {isOverdue && <span style={{ fontSize: 10, background: "#3D0A0A", color: "#EF4444", borderRadius: 4, padding: "1px 5px", marginLeft: 6 }}>PO TERMÍNE</span>}
                          </span>
                        : <span style={{ color: "#374151" }}>—</span>}
                    />
                  </InfoCard>
                );
              })()}

              {sel.status === "hotova" && (
                <div style={{ margin: "0 16px 12px" }}>
                  <button
                    style={{
                      width: "100%", borderRadius: 12, border: "none", padding: "14px 0",
                      fontFamily: "inherit", fontWeight: 700, fontSize: 16, cursor: "pointer",
                      background: sel.vyplatena ? "#052E1C" : "#065F46",
                      color: sel.vyplatena ? "#6EE7B7" : "#fff",
                      border: sel.vyplatena ? "1px solid #065F46" : "none",
                    }}
                    onClick={() => updateOrder(sel.id, { vyplatena: !sel.vyplatena })}
                  >
                    {sel.vyplatena ? "✓ Vyplatené" : "💰 Označiť ako vyplatené"}
                  </button>
                </div>
              )}

              {sel.status === "hotova" && sel.vyplatena && (
                <div style={{ margin: "0 16px 12px" }}>
                  <button
                    style={{ width: "100%", borderRadius: 12, border: "1px solid #374151", padding: "12px 0", fontFamily: "inherit", fontWeight: 700, fontSize: 15, cursor: "pointer", background: "#111827", color: "#9CA3AF" }}
                    onClick={() => archiveOrder(sel.id)}
                  >📦 Presunúť do archívu</button>
                </div>
              )}
              <div style={{ padding: "0 16px 16px", display: "flex", gap: 8 }}>
                <button style={css.dangerBtn} onClick={() => deleteOrder(sel.id)}>🗑 Vymazať zákazku</button>
                {sel.status !== "storno" && (
                  <button style={{ ...css.dangerBtn, background: "#1F0505", color: "#EF4444", borderColor: "#3D0A0A" }}
                    onClick={() => setStatus(sel.id, "storno")}>
                    ✕ Storno
                  </button>
                )}
              </div>
            </>
          )}

          {/* TAB: FINANCIE */}
          {tab === "finance" && (
            <>
              <InfoCard title="💶 Financie">
                <InfoRow label="Cena zákazky" val={
                  <span style={{ color: "#10B981", fontWeight: 700, fontSize: 18 }}>
                    {price > 0 ? fmt(price) : "—"}
                  </span>
                } big />
                <InfoRow label="Prijatá záloha" val={
                  <span style={{ color: "#F59E0B", fontWeight: 700 }}>{deposit > 0 ? fmt(deposit) : "—"}</span>
                } />
                <InfoRow label="Zostatok na doplatenie" val={
                  <span style={{ color: due > 0 ? "#EF4444" : "#10B981", fontWeight: 700, fontSize: 18 }}>
                    {price > 0 ? fmt(due) : "—"}
                  </span>
                } big />
              </InfoCard>

              {price > 0 && deposit > 0 && (
                <div style={{ margin: "0 16px 16px" }}>
                  <div style={{ fontSize: 12, color: "#6B7280", marginBottom: 6 }}>Uhradené</div>
                  <div style={{ background: "#111827", borderRadius: 8, height: 20, overflow: "hidden", border: "1px solid #1F2937" }}>
                    <div style={{
                      height: "100%", borderRadius: 8,
                      width: `${Math.min(100, (deposit / price) * 100)}%`,
                      background: deposit >= price ? "#10B981" : "#F59E0B",
                      transition: "width 0.5s ease"
                    }} />
                  </div>
                  <div style={{ fontSize: 12, color: "#6B7280", marginTop: 4, textAlign: "right" }}>
                    {Math.round((deposit / price) * 100)}% uhradené
                  </div>
                </div>
              )}
            </>
          )}

          {/* TAB: ČAS */}
          {tab === "time" && (
            <>
              <div style={{ padding: "16px 16px 8px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ color: "#9CA3AF", fontSize: 12, textTransform: "uppercase", letterSpacing: 1 }}>Celkový čas</div>
                  <div style={{ color: "#F9FAFB", fontWeight: 700, fontSize: 28, fontVariantNumeric: "tabular-nums" }}>
                    {mins > 0 ? fmtMins(mins) : "0m"}
                  </div>
                </div>
                <button style={css.addTimeBtn} onClick={() => setShowTimeLog(!showTimeLog)}>
                  {showTimeLog ? "✕ Zavrieť" : "+ Pridať čas"}
                </button>
              </div>

              {/* Category breakdown */}
              {mins > 0 && (() => {
                const CAT_META = [
                  { key: "nakres",    label: "📐 Nákres",   color: "#8B5CF6" },
                  { key: "skladanie", label: "🔧 Skladanie", color: "#F59E0B" },
                  { key: "montaz",    label: "🏗 Montáž",   color: "#10B981" },
                  { key: "ine",       label: "📌 Iné",      color: "#6B7280" },
                ];
                const byCat = CAT_META.map(c => ({
                  ...c,
                  mins: (sel.timeLog || []).filter(e => (e.category || "ine") === c.key).reduce((a, e) => a + e.mins, 0)
                })).filter(c => c.mins > 0);
                if (byCat.length === 0) return null;
                return (
                  <div style={{ margin: "0 16px 12px", display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {byCat.map(c => (
                      <div key={c.key} style={{
                        flex: 1, minWidth: 80,
                        background: c.color + "15", border: `1px solid ${c.color}33`,
                        borderRadius: 8, padding: "8px 10px", textAlign: "center"
                      }}>
                        <div style={{ color: c.color, fontWeight: 700, fontSize: 15 }}>{fmtMins(c.mins)}</div>
                        <div style={{ color: c.color + "aa", fontSize: 11, marginTop: 2 }}>{c.label}</div>
                      </div>
                    ))}
                  </div>
                );
              })()}

              {showTimeLog && (
                <div style={css.logBox}>
                  {/* Kategória — scroll picker */}
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ color: "#6B7280", fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Typ práce</div>
                    <div style={{ display: "flex", gap: 6 }}>
                      {[
                        { key: "nakres", label: "📐 Nákres", color: "#8B5CF6" },
                        { key: "skladanie", label: "🔧 Skladanie", color: "#F59E0B" },
                        { key: "montaz", label: "🏗 Montáž", color: "#10B981" },
                        { key: "ine", label: "📌 Iné", color: "#6B7280" },
                      ].map(cat => (
                        <button
                          key={cat.key}
                          onClick={() => setTimeCategory(cat.key)}
                          style={{
                            flex: 1,
                            padding: "8px 4px",
                            borderRadius: 8,
                            border: `1px solid ${timeCategory === cat.key ? cat.color : "#1F2937"}`,
                            background: timeCategory === cat.key ? cat.color + "22" : "#030712",
                            color: timeCategory === cat.key ? cat.color : "#4B5563",
                            fontSize: 11,
                            fontWeight: 700,
                            cursor: "pointer",
                            whiteSpace: "nowrap",
                            transition: "all 0.15s",
                          }}
                        >
                          {cat.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Čas */}
                  <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ color: "#6B7280", fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Hodiny / Minúty</div>
                      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                        <input style={{ ...css.inp, width: 64, textAlign: "center" }} type="number" min="0" value={timeH}
                          onChange={e => setTimeH(e.target.value)} placeholder="0" />
                        <span style={{ color: "#4B5563", fontWeight: 700 }}>h</span>
                        <input style={{ ...css.inp, width: 64, textAlign: "center" }} type="number" min="0" max="59" value={timeM}
                          onChange={e => setTimeM(e.target.value)} placeholder="0" />
                        <span style={{ color: "#4B5563", fontWeight: 700 }}>m</span>
                      </div>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ color: "#6B7280", fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Dátum práce</div>
                      <input style={css.inp} type="date" value={timeDate}
                        onChange={e => setTimeDate(e.target.value)} />
                    </div>
                  </div>

                  {/* Poznámka */}
                  <input style={{ ...css.inp, marginBottom: 8 }} value={timeNote}
                    onChange={e => setTimeNote(e.target.value)} placeholder="Poznámka (nepovinné)" />

                  {/* Kto pracoval */}
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ color: "#6B7280", fontSize: 11, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Kto pracoval</div>
                    <div style={{ display: "flex", gap: 6 }}>
                      {["ja", "pomocník", "externý"].map(w => (
                        <button key={w} onClick={() => setTimeWorker(w)} style={{
                          flex: 1, padding: "7px 4px", borderRadius: 8, fontSize: 11, fontWeight: 700, cursor: "pointer",
                          border: `1px solid ${timeWorker === w ? "#3B82F6" : "#1F2937"}`,
                          background: timeWorker === w ? "#1E3A5F" : "#030712",
                          color: timeWorker === w ? "#60A5FA" : "#4B5563",
                        }}>{w}</button>
                      ))}
                    </div>
                  </div>

                  <div style={{ display: "flex", gap: 8 }}>
                    <button style={{ ...css.saveBtn, flex: 1 }} onClick={logTime}>✓ Pridať záznam</button>
                    <button style={{ ...css.backBtn, marginLeft: 0, border: "1px solid #1F2937", borderRadius: 8, padding: "8px 14px" }} onClick={() => setShowTimeLog(false)}>Zrušiť</button>
                  </div>
                </div>
              )}

              {(sel.timeLog || []).length === 0 ? (
                <div style={{ textAlign: "center", color: "#374151", padding: 40 }}>Zatiaľ žiadne záznamy</div>
              ) : (
                <div style={{ padding: "0 16px" }}>
                  {(sel.timeLog || []).map(e => {
                    const CAT = {
                      nakres:    { label: "Nákres",   color: "#8B5CF6" },
                      skladanie: { label: "Skladanie", color: "#F59E0B" },
                      montaz:    { label: "Montáž",   color: "#10B981" },
                      ine:       { label: "Iné",      color: "#6B7280" },
                    };
                    const cat = CAT[e.category] || CAT["ine"];
                    return (
                      <div key={e.id} style={css.timeEntry}>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                            <span style={{
                              fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 20,
                              background: cat.color + "22", color: cat.color, border: `1px solid ${cat.color}44`
                            }}>{cat.label}</span>
                            <span style={{ color: "#F9FAFB", fontWeight: 700 }}>{fmtMins(e.mins)}</span>
                            {e.worker && e.worker !== "ja" && <span style={{ fontSize: 11, background: "#1E3A5F", color: "#60A5FA", borderRadius: 10, padding: "1px 7px" }}>{e.worker}</span>}
                          </div>
                          {e.note && <div style={{ color: "#6B7280", fontSize: 13 }}>{e.note}</div>}
                          <div style={{ color: "#374151", fontSize: 12, marginTop: 2 }}>{fmtDate(e.at)}</div>
                        </div>
                        <button style={css.delBtn} onClick={() => deleteTimeEntry(e.id)}>✕</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {/* TAB: POZNÁMKY */}
          {tab === "notes" && (
            <>
              <div style={{ padding: "12px 16px 8px", display: "flex", gap: 8 }}>
                <input
                  style={{ ...css.inp, flex: 1 }}
                  value={noteText}
                  onChange={e => setNoteText(e.target.value)}
                  placeholder="Napíš poznámku alebo zmenu..."
                  onKeyDown={e => e.key === "Enter" && addNote()}
                />
                <button style={{ ...css.saveBtn, padding: "10px 16px" }} onClick={addNote}>+</button>
              </div>
              <div style={{ padding: "0 16px" }}>
                {(sel.notes || []).length === 0 && (
                  <div style={{ textAlign: "center", color: "#374151", padding: 40 }}>Zatiaľ žiadne poznámky</div>
                )}
                {(sel.notes || []).map(n => (
                  <div key={n.id} style={{ background: n.resolved ? "#0a0f0a" : "#0D1117", borderRadius: 10, padding: "12px 14px", marginBottom: 8, border: `1px solid ${n.resolved ? "#1a2e1a" : "#1F2937"}`, display: "flex", gap: 10, alignItems: "flex-start" }}>
                    {/* Checkbox */}
                    <button
                      onClick={() => toggleNote(n.id)}
                      style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${n.resolved ? "#10B981" : "#374151"}`, background: n.resolved ? "#10B981" : "transparent", flexShrink: 0, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", marginTop: 1 }}
                    >
                      {n.resolved && <span style={{ color: "#fff", fontSize: 12, fontWeight: 700 }}>✓</span>}
                    </button>
                    <div style={{ flex: 1 }}>
                      <div style={{ color: n.resolved ? "#4B5563" : "#F9FAFB", fontSize: 14, lineHeight: 1.6, textDecoration: n.resolved ? "line-through" : "none" }}>{n.text}</div>
                      <div style={{ color: "#374151", fontSize: 11, marginTop: 4 }}>{fmtDate(n.at)}{n.resolved ? " · vyriešené" : ""}</div>
                    </div>
                    <button style={css.delBtn} onClick={() => deleteNote(n.id)}>✕</button>
                  </div>
                ))}
              </div>
            </>
          )}

          {/* TAB: MATERIÁL */}
          {tab === "materials" && (
            <>
              <div style={{ padding: "12px 16px 8px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ color: "#9CA3AF", fontSize: 11, textTransform: "uppercase", letterSpacing: 1 }}>Náklady na materiál</div>
                  <div style={{ color: "#EF4444", fontWeight: 700, fontSize: 26 }}>{totalMat > 0 ? fmt(totalMat) : "0 €"}</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ color: "#9CA3AF", fontSize: 11, textTransform: "uppercase", letterSpacing: 1 }}>Zisk</div>
                  <div style={{ color: profit > 0 ? "#10B981" : profit < 0 ? "#EF4444" : "#4B5563", fontWeight: 700, fontSize: 26 }}>
                    {profit !== null ? fmt(profit) : "—"}
                  </div>
                </div>
              </div>

              {price > 0 && totalMat > 0 && (
                <div style={{ margin: "0 16px 12px" }}>
                  <div style={{ background: "#111827", borderRadius: 8, height: 16, overflow: "hidden", border: "1px solid #1F2937", display: "flex" }}>
                    <div style={{ width: `${Math.min(100, (totalMat / price) * 100)}%`, background: "#EF4444", borderRadius: "8px 0 0 8px", transition: "width 0.4s" }} />
                    <div style={{ flex: 1, background: "#10B981", borderRadius: "0 8px 8px 0" }} />
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4, fontSize: 11, color: "#6B7280" }}>
                    <span style={{ color: "#EF4444" }}>Materiál {Math.round((totalMat / price) * 100)}%</span>
                    <span style={{ color: "#10B981" }}>Zisk {Math.round(((price - totalMat) / price) * 100)}%</span>
                  </div>
                </div>
              )}

              <div style={{ padding: "0 16px 8px" }}>
                {!showMatForm ? (
                  <button style={{ ...css.addTimeBtn, width: "100%", marginBottom: 8 }} onClick={() => setShowMatForm(true)}>+ Pridať položku</button>
                ) : (
                  <div style={css.logBox}>
                    <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                      <input style={{ ...css.inp, flex: 2 }} value={matName} onChange={e => setMatName(e.target.value)} placeholder="Názov materiálu" />
                      <input style={{ ...css.inp, flex: 1, minWidth: 0 }} type="number" value={matCost} onChange={e => setMatCost(e.target.value)} placeholder="€" />
                    </div>
                    <textarea style={{ ...css.ta, marginBottom: 8 }} rows={2} value={matNote} onChange={e => setMatNote(e.target.value)} placeholder="Poznámka k materiálu (nepovinné)" />
                    <div style={{ display: "flex", gap: 8 }}>
                      <button style={{ ...css.saveBtn, flex: 1 }} onClick={addMaterial}>✓ Pridať</button>
                      <button style={{ ...css.backBtn, border: "1px solid #1F2937", borderRadius: 8, padding: "8px 14px" }} onClick={() => { setShowMatForm(false); setMatNote(""); }}>Zrušiť</button>
                    </div>
                  </div>
                )}
                {(sel.materials || []).length === 0 && !showMatForm && (
                  <div style={{ textAlign: "center", color: "#374151", padding: 30 }}>Zatiaľ žiadny materiál</div>
                )}
                {(sel.materials || []).map(m => (
                  <div key={m.id} style={{ padding: "10px 0", borderBottom: "1px solid #111827" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ color: "#D1D5DB", fontSize: 14, fontWeight: 600 }}>{m.name}</span>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <span style={{ color: "#EF4444", fontWeight: 700 }}>{fmt(m.cost)}</span>
                        <button style={css.delBtn} onClick={() => deleteMaterial(m.id)}>✕</button>
                      </div>
                    </div>
                    {m.note && <div style={{ color: "#6B7280", fontSize: 12, marginTop: 3 }}>{m.note}</div>}
                  </div>
                ))}
              </div>
            </>
          )}

          {/* TAB: HISTÓRIA / LOG */}
          {tab === "history" && (
            <InfoCard title="📜 História zmien">
              {STATUSES.filter(s => sel[`statusHistory_${s.key}`]).map(s => (
                <InfoRow key={s.key}
                  label={<span style={{ color: s.color }}>● {s.label}</span>}
                  val={fmtDate(sel[`statusHistory_${s.key}`])} />
              ))}
              <InfoRow label="Vytvorená" val={fmtDate(sel.createdAt)} />
              <InfoRow label="Posledná zmena" val={fmtDate(sel.updatedAt)} />
            </InfoCard>
          )}
        </div>
      <SmsModal modal={smsModal} onWhatsApp={openWhatsApp} onSms={openSms} onClose={() => setSmsModal(null)} />
      <ConfirmModal open={!!confirmDelete} onConfirm={confirmDeleteOrder} onCancel={() => setConfirmDelete(null)} />
      </div>
    );
  }

  /* ──────────────────────────────────────────────
     SUB PAGES: CALENDAR / YEARLY / CUSTOMERS
  ────────────────────────────────────────────── */
  if (subPage === "calendar") {
    const year = calYear; const month = calMonth;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const adjustedFirst = (firstDay + 6) % 7; // Mon=0
    const monthNames = ["Január","Február","Marec","Apríl","Máj","Jún","Júl","August","September","Október","November","December"];
    const dayNames = ["Po","Ut","St","Št","Pi","So","Ne"];
    const deadlinesByDay = {};
    orders.forEach(o => {
      const dl = o.deadlineDate ? new Date(o.deadlineDate) : (o.depositDate ? new Date(new Date(o.depositDate).setMonth(new Date(o.depositDate).getMonth()+2)) : null);
      if (dl && dl.getFullYear() === year && dl.getMonth() === month) {
        const d = dl.getDate();
        if (!deadlinesByDay[d]) deadlinesByDay[d] = [];
        deadlinesByDay[d].push(o);
      }
    });
    const today = new Date();
    return (
      <div style={css.app}>
        <style>{globalCss}</style>
        <div style={css.topBar}>
          <button style={css.backBtn} onClick={() => setSubPage(null)}>← Späť</button>
          <span style={css.topTitle}>📅 Kalendár</span>
        </div>
        <div style={{ padding: "12px 16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <button style={{ background: "#1F2937", border: "none", borderRadius: 8, color: "#fff", fontSize: 18, width: 36, height: 36, cursor: "pointer" }}
              onClick={() => { if (month === 0) { setCalMonth(11); setCalYear(y => y-1); } else setCalMonth(m => m-1); }}>‹</button>
            <span style={{ color: "#F9FAFB", fontWeight: 700, fontSize: 17 }}>{monthNames[month]} {year}</span>
            <button style={{ background: "#1F2937", border: "none", borderRadius: 8, color: "#fff", fontSize: 18, width: 36, height: 36, cursor: "pointer" }}
              onClick={() => { if (month === 11) { setCalMonth(0); setCalYear(y => y+1); } else setCalMonth(m => m+1); }}>›</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2, marginBottom: 4 }}>
            {dayNames.map(d => <div key={d} style={{ textAlign: "center", color: "#4B5563", fontSize: 11, padding: "4px 0", fontWeight: 700 }}>{d}</div>)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 3 }}>
            {Array(adjustedFirst).fill(null).map((_, i) => <div key={"e"+i} />)}
            {Array(daysInMonth).fill(null).map((_, i) => {
              const day = i + 1;
              const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
              const events = deadlinesByDay[day] || [];
              return (
                <div key={day} style={{ background: isToday ? "#1E3A5F" : events.length ? "#0D1117" : "#0a0a0a", borderRadius: 8, padding: "6px 4px", minHeight: 52, border: isToday ? "1px solid #3B82F6" : events.length ? "1px solid #1F2937" : "1px solid transparent", textAlign: "center" }}>
                  <div style={{ color: isToday ? "#60A5FA" : "#9CA3AF", fontSize: 13, fontWeight: isToday ? 700 : 400, marginBottom: 2 }}>{day}</div>
                  {events.map(o => {
                    const st = statusOf(o.status);
                    return <div key={o.id} style={{ fontSize: 9, background: st.color+"22", color: st.color, borderRadius: 3, padding: "1px 3px", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", cursor: "pointer" }}
                      onClick={() => { setSubPage(null); openDetail(o.id); }}>{o.customerName || o.title}</div>;
                  })}
                </div>
              );
            })}
          </div>
          {Object.keys(deadlinesByDay).length === 0 && (

          )}
        </div>
      </div>
    );
  }

  if (subPage === "yearly") {
    const year = calYear;
    const months = ["Jan","Feb","Mar","Apr","Máj","Jún","Júl","Aug","Sep","Okt","Nov","Dec"];
    const byMonth = Array(12).fill(null).map((_, m) => {
      const mo = orders.filter(o => {
        const d = new Date(o.createdAt);
        return d.getFullYear() === year && d.getMonth() === m;
      });
      const paid = mo.reduce((s, o) => {
        const deposit = parseFloat(o.depositPaid) || 0;
        const price = parseFloat(o.price) || 0;
        const doplatok = o.vyplatena && price > deposit ? price - deposit : 0;
        return s + deposit + doplatok;
      }, 0);
      const mat  = mo.reduce((s, o) => s + (o.materials || []).reduce((a, m) => a + (m.cost || 0), 0), 0);
      return {
        label: months[m],
        count: mo.length,
        paid,
        mat,
        profit: paid - mat,
      };
    });
    const maxProfit = Math.max(...byMonth.map(m => Math.abs(m.profit)), 1);
    const totalPaid   = byMonth.reduce((s, m) => s + m.paid, 0);
    const totalMat    = byMonth.reduce((s, m) => s + m.mat, 0);
    const totalProfit = totalPaid - totalMat;
    return (
      <div style={css.app}>
        <style>{globalCss}</style>
        <div style={css.topBar}>
          <button style={css.backBtn} onClick={() => setSubPage(null)}>← Späť</button>

            <span style={{ color: "#F9FAFB", fontWeight: 700, fontSize: 15 }}>{year}</span>
            <button style={{ background: "#1F2937", border: "none", borderRadius: 6, color: "#9CA3AF", padding: "4px 10px", cursor: "pointer", fontSize: 16 }} onClick={() => setCalYear(y => y+1)}>›</button>
          </div>
        </div>
        <div style={{ padding: "12px 16px" }}>
          {/* 3 summary cards */}
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            <div style={{ flex: 1, background: "#111827", borderRadius: 10, padding: "10px 12px", border: "1px solid #1F2937" }}>
              <div style={{ color: "#4B5563", fontSize: 9, textTransform: "uppercase", letterSpacing: 1 }}>Prijaté</div>
              <div style={{ color: "#F59E0B", fontWeight: 700, fontSize: 17, marginTop: 3 }}>{fmt(totalPaid)}</div>
            </div>
            <div style={{ flex: 1, background: "#111827", borderRadius: 10, padding: "10px 12px", border: "1px solid #1F2937" }}>
              <div style={{ color: "#4B5563", fontSize: 9, textTransform: "uppercase", letterSpacing: 1 }}>Materiál</div>
              <div style={{ color: "#EF4444", fontWeight: 700, fontSize: 17, marginTop: 3 }}>{fmt(totalMat)}</div>
            </div>
            <div style={{ flex: 1, background: totalProfit >= 0 ? "#052E1C" : "#2D0A0A", borderRadius: 10, padding: "10px 12px", border: `1px solid ${totalProfit >= 0 ? "#065F46" : "#3D0A0A"}` }}>
              <div style={{ color: "#4B5563", fontSize: 9, textTransform: "uppercase", letterSpacing: 1 }}>Reálny zisk</div>
              <div style={{ color: totalProfit >= 0 ? "#10B981" : "#EF4444", fontWeight: 700, fontSize: 17, marginTop: 3 }}>{fmt(totalProfit)}</div>
            </div>
          </div>

          {/* Bar chart — profit per month */}
          <div style={{ background: "#111827", borderRadius: 12, padding: "16px 12px 8px", border: "1px solid #1F2937", marginBottom: 12 }}>
            <div style={{ color: "#4B5563", fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 }}>Reálny zisk po mesiacoch</div>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 3, height: 100 }}>
              {byMonth.map((m, i) => (
                <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                  <div style={{
                    width: "100%",
                    borderRadius: "4px 4px 0 0",
                    background: m.profit > 0 ? "#10B981" : m.profit < 0 ? "#EF4444" : "#1F2937",
                    height: `${Math.max(3, (Math.abs(m.profit) / maxProfit) * 90)}px`,
                    transition: "height 0.3s",
                  }} />
                  <div style={{ color: "#4B5563", fontSize: 8, textAlign: "center" }}>{m.label}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Monthly breakdown table */}
          <div style={{ background: "#111827", borderRadius: 12, border: "1px solid #1F2937", overflow: "hidden" }}>
            {byMonth.filter(m => m.count > 0).map((m, i) => (
              <div key={i} style={{ padding: "10px 16px", borderBottom: "1px solid #0D1117", display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ color: "#9CA3AF", fontWeight: 700, width: 30, fontSize: 13 }}>{m.label}</span>
                <span style={{ color: "#4B5563", fontSize: 12, width: 28 }}>{m.count}ks</span>
                <span style={{ color: "#F59E0B", fontSize: 13, flex: 1 }}>{fmt(m.paid)}</span>
                {m.mat > 0 && <span style={{ color: "#EF4444", fontSize: 12 }}>−{fmt(m.mat)}</span>}
                <span style={{ color: m.profit >= 0 ? "#10B981" : "#EF4444", fontWeight: 700, fontSize: 14 }}>{fmt(m.profit)}</span>
              </div>
            ))}
            {byMonth.every(m => m.count === 0) && (
              <div style={{ textAlign: "center", color: "#374151", padding: 40 }}>Žiadne zákazky v roku {year}</div>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (subPage === "customers") {
    const customerMap = {};
    orders.forEach(o => {
      const key = (o.customerName || "").trim().toLowerCase() || o.customerPhone || "neznamy";
      if (!customerMap[key]) customerMap[key] = { name: o.customerName || "Neznámy", phone: o.customerPhone, orders: [] };
      customerMap[key].orders.push(o);

    const customers = Object.values(customerMap).sort((a, b) => b.orders.length - a.orders.length);
    return (
      <div style={css.app}>
        <style>{globalCss}</style>
        <div style={css.topBar}>
          <button style={css.backBtn} onClick={() => setSubPage(null)}>← Späť</button>

        <div style={{ padding: "8px 16px" }}>
          {customers.length === 0 && <div style={{ textAlign: "center", color: "#374151", padding: 60 }}>Žiadni zákazníci</div>}
          {customers.map((c, i) => {
            const total = c.orders.reduce((s, o) => s + (parseFloat(o.price) || 0), 0);

                    <div style={{ color: "#10B981", fontWeight: 700 }}>{fmt(total)}</div>
                    <div style={{ color: "#4B5563", fontSize: 12 }}>{c.orders.length} zákaziek</div>
                  </div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {c.orders.map(o => {
                    const st = statusOf(o.status);
                    return (
                      <div key={o.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#111827", borderRadius: 8, padding: "8px 12px", cursor: "pointer" }}
