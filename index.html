function renderNakup(){
  const {data,nakupSelected,nakupChecked} = appState;
  const activeOrders=(data.orders||[]).filter(o=>o.status!=='storno'&&o.status!=='hotova');
  const merged=[];
  nakupSelected.forEach(id=>{
    const o=(data.orders||[]).find(x=>x.id===id);
    if(!o) return;
    (o.materials||[]).forEach(m=>{
      merged.push({...m,orderName:o.customerName||o.title||'—',orderId:id,shopKey:id+'_'+m.id});
    });
  });
  const unchecked=merged.filter(m=>!nakupChecked[m.shopKey]);
  const checked=merged.filter(m=>nakupChecked[m.shopKey]);
  const totalUnc=unchecked.reduce((s,m)=>s+(m.cost||0),0);

  const frag=document.createDocumentFragment();
  frag.appendChild(renderTopBar('🛒 Nákupný zoznam',()=>setState({subPage:null})));
  const wrap=el('div',{style:{padding:'12px 16px 4px'}});

  // Order selection
  wrap.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px'}},'Vyber zákazky na nákup'));
  if(!activeOrders.length) wrap.appendChild(el('div',{style:{color:'#374151',fontSize:'14px',padding:'20px 0'}},'Žiadne aktívne zákazky'));
  activeOrders.forEach(o=>{
    const sel2=nakupSelected.includes(o.id);
    const oc=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 14px',marginBottom:'6px',borderRadius:'10px',border:`1px solid ${sel2?'#2563EB':'#1F2937'}`,background:sel2?'#0D1F3C':'#0D1117',cursor:'pointer'}});
    oc.onclick=()=>{ const ns=sel2?nakupSelected.filter(x=>x!==o.id):[...nakupSelected,o.id]; setState({nakupSelected:ns}); };
    const cb2=el('div',{style:{width:'22px',height:'22px',borderRadius:'6px',border:`2px solid ${sel2?'#2563EB':'#374151'}`,background:sel2?'#2563EB':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:'0'}});
    if(sel2) cb2.appendChild(el('span',{style:{color:'#fff',fontSize:'13px',fontWeight:'700'}},'✓'));
    const od=el('div',{style:{flex:'1'}});
    od.append(el('div',{style:{color:'#F9FAFB',fontWeight:'600',fontSize:'14px'}},o.customerName||'—'),el('div',{style:{color:'#4B5563',fontSize:'12px'}},`${o.title||'—'} · ${(o.materials||[]).length} položiek`));
    oc.append(cb2,od);
    wrap.appendChild(oc);
  });
  frag.appendChild(wrap);

  if(nakupSelected.length){
    const lw=el('div',{style:{padding:'8px 16px'}});
    const lh=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}});
    lh.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px'}},'Zoznam nákupu'));
    if(totalUnc>0) lh.appendChild(el('div',{style:{color:'#EF4444',fontWeight:'700',fontSize:'14px'}},fmt(totalUnc)));
    lw.appendChild(lh);
    if(!merged.length) lw.appendChild(el('div',{style:{color:'#374151',fontSize:'14px',padding:'20px 0',textAlign:'center'}},'Vybrané zákazky nemajú žiadny materiál'));
    unchecked.forEach(m=>{
      const mi=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'12px 14px',marginBottom:'6px',borderRadius:'10px',border:'1px solid #1F2937',background:'#0D1117',cursor:'pointer'}});
      mi.onclick=()=>setState({nakupChecked:{...nakupChecked,[m.shopKey]:true}});
      mi.append(el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #374151',flexShrink:'0'}}));
      const md=el('div',{style:{flex:'1'}});
      md.append(el('div',{style:{color:'#F9FAFB',fontWeight:'600',fontSize:'14px'}},m.name),el('div',{style:{color:'#4B5563',fontSize:'12px'}},m.orderName+(m.note?` · ${m.note}`:'')));
      mi.appendChild(md);
      if(m.cost>0) mi.appendChild(el('span',{style:{color:'#9CA3AF',fontSize:'13px',fontWeight:'600'}},fmt(m.cost)));
      lw.appendChild(mi);
    });
    if(checked.length){
      lw.appendChild(el('div',{style:{color:'#374151',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',margin:'12px 0 6px'}},'Nakúpené'));
      checked.forEach(m=>{
        const mi2=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 14px',marginBottom:'4px',borderRadius:'10px',border:'1px solid #1a2e1a',background:'#0a0f0a',cursor:'pointer',opacity:'0.6'}});
        mi2.onclick=()=>{ const nc={...nakupChecked}; delete nc[m.shopKey]; setState({nakupChecked:nc}); };
        const cb3=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #10B981',background:'#10B981',flexShrink:'0',display:'flex',alignItems:'center',justifyContent:'center'}});
        cb3.appendChild(el('span',{style:{color:'#fff',fontSize:'13px',fontWeight:'700'}},'✓'));
        const md2=el('div',{style:{flex:'1'}});
        md2.append(el('div',{style:{color:'#4B5563',fontWeight:'600',fontSize:'14px',textDecoration:'line-through'}},m.name),el('div',{style:{color:'#374151',fontSize:'12px'}},m.orderName));
        mi2.append(cb3,md2);
        if(m.cost>0) mi2.appendChild(el('span',{style:{color:'#374151',fontSize:'13px'}},fmt(m.cost)));
        lw.appendChild(mi2);
      });
    }
    frag.appendChild(lw);
  }
  return frag;
}

function renderBackup(){
  const {data} = appState;
  const lastBackup=data.lastBackup;
  const frag=document.createDocumentFragment();
  frag.appendChild(renderTopBar('💾 Zálohovanie dát',()=>setState({subPage:null})));
  const wrap=el('div',{style:{padding:'20px 16px'}});
  const warn=el('div',{style:{background:'#1C1400',border:'1px solid #78350F',borderRadius:'12px',padding:'14px 16px',marginBottom:'20px'}});
  warn.append(el('div',{style:{color:'#F59E0B',fontWeight:'700',fontSize:'14px',marginBottom:'4px'}},'⚠️ Dôležité upozornenie'),el('div',{style:{color:'#92400E',fontSize:'13px',lineHeight:'1.6'}},'Dáta sú uložené v prehliadači a Firebase. Pravidelne si rob zálohu!'));
  wrap.appendChild(warn);
  const stats=el('div',{style:{background:'#111827',borderRadius:'12px',border:'1px solid #1F2937',marginBottom:'20px',overflow:'hidden'}});
  function srow(lbl,val,color){ const r=el('div',{style:{padding:'12px 16px',borderBottom:'1px solid #1F2937',display:'flex',justifyContent:'space-between'}}); r.append(el('span',{style:{color:'#6B7280',fontSize:'14px'}},lbl),el('span',{style:{color:color||'#F9FAFB',fontWeight:'700'}},val)); return r; }
  stats.append(srow('Aktívne zákazky',String((data.orders||[]).length)),srow('V archíve',String((data.archive||[]).length)),srow('Posledná záloha',lastBackup?fmtDate(lastBackup):'Nikdy',lastBackup?'#10B981':'#EF4444'));
  wrap.appendChild(stats);
  const expBtn=el('button',{style:{width:'100%',background:'#1E3A5F',border:'1px solid #2563EB',borderRadius:'12px',color:'#60A5FA',fontWeight:'700',fontSize:'16px',padding:'16px 0',cursor:'pointer',marginBottom:'12px'}},'⬇️ Stiahnuť zálohu (.json)');
  expBtn.onclick=quickExport;
  wrap.appendChild(expBtn);
  const impLbl=el('label',{style:{display:'block',width:'100%',background:'#111827',border:'1px solid #374151',borderRadius:'12px',color:'#9CA3AF',fontWeight:'700',fontSize:'16px',padding:'16px 0',cursor:'pointer',textAlign:'center',boxSizing:'border-box'}},'⬆️ Obnoviť zo zálohy');
  const impInp=el('input',{type:'file',accept:'.json',style:{display:'none'}});
  impInp.onchange=e=>{ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=ev=>{ try{ const parsed=JSON.parse(ev.target.result); if(!parsed.orders){ alert('Neplatný súbor.'); return; } if(!confirm('Toto prepíše všetky dáta. Pokračovať?')) return; setData(()=>parsed); alert('Dáta obnovené!'); setState({subPage:null}); }catch{ alert('Chyba pri čítaní súboru.'); } }; reader.readAsText(file); };
  impLbl.appendChild(impInp);
  wrap.appendChild(impLbl);
  frag.appendChild(wrap);
  return frag;
}

// ═══════════════════════════════════
// MODALS
// ═══════════════════════════════════
function renderModals(){
  const frag=document.createDocumentFragment();

  // Confirm delete modal
  if(appState.confirmDelete){
    const ov=el('div',{className:'modal-overlay'});
    ov.onclick=e=>{ if(e.target===ov) setState({confirmDelete:null}); };
    const box=el('div',{className:'modal-box'});
    box.appendChild(el('div',{style:{color:'#F9FAFB',fontWeight:'700',fontSize:'17px',marginBottom:'8px'}},'Vymazať zákazku?'));
    box.appendChild(el('div',{style:{color:'#6B7280',fontSize:'14px',marginBottom:'24px'}},'Táto akcia sa nedá vrátiť späť.'));
    const btns=el('div',{style:{display:'flex',gap:'10px'}});
    const delB=el('button',{style:{flex:'1',background:'#7F1D1D',border:'none',borderRadius:'10px',color:'#fff',fontWeight:'700',fontSize:'15px',padding:'14px 0',cursor:'pointer'}},'🗑 Vymazať');
    delB.onclick=deleteOrderConfirmed;
    const canB=el('button',{style:{flex:'1',background:'#1F2937',border:'1px solid #374151',borderRadius:'10px',color:'#9CA3AF',fontWeight:'600',fontSize:'15px',padding:'14px 0',cursor:'pointer'}},'Zrušiť');
    canB.onclick=()=>setState({confirmDelete:null});
    btns.append(delB,canB);
    box.appendChild(btns);
    ov.appendChild(box);
    frag.appendChild(ov);
  }

  // SMS modal
  if(appState.smsModal){
    const m=appState.smsModal;
    const ov=el('div',{className:'modal-overlay'});
    const box=el('div',{className:'modal-box'});
    box.appendChild(el('div',{style:{color:'#9CA3AF',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'6px'}},'Notifikácia zákazníkovi'));
    box.appendChild(el('div',{style:{color:'#F9FAFB',fontSize:'14px',lineHeight:'1.6',background:'#0D1117',borderRadius:'10px',padding:'12px 14px',marginBottom:'16px',border:'1px solid #1F2937'}},m.text));
    box.appendChild(el('div',{style:{color:'#6B7280',fontSize:'12px',marginBottom:'16px'}},`📱 ${m.phone}`));
    const btns=el('div',{style:{display:'flex',gap:'10px',marginBottom:'12px'}});
    const waBtn=el('button',{style:{flex:'1',background:'#075E54',border:'none',borderRadius:'10px',color:'#fff',fontWeight:'700',fontSize:'15px',padding:'14px 0',cursor:'pointer'}},'💬 WhatsApp');
    waBtn.onclick=()=>{ const p=m.cleanPhone.startsWith('+')?m.cleanPhone.slice(1):m.cleanPhone.startsWith('0')?'421'+m.cleanPhone.slice(1):m.cleanPhone; window.open(`https://wa.me/${p}?text=${encodeURIComponent(m.text)}`,'_blank'); setState({smsModal:null}); };
    const smsBtn=el('button',{style:{flex:'1',background:'#1D4ED8',border:'none',borderRadius:'10px',color:'#fff',fontWeight:'700',fontSize:'15px',padding:'14px 0',cursor:'pointer'}},'📨 SMS');
    smsBtn.onclick=()=>{ window.location.href=`sms:${m.cleanPhone}?body=${encodeURIComponent(m.text)}`; setState({smsModal:null}); };
    btns.append(waBtn,smsBtn);
    const skipBtn=el('button',{style:{width:'100%',background:'none',border:'1px solid #1F2937',borderRadius:'10px',color:'#6B7280',fontSize:'14px',padding:'12px 0',cursor:'pointer'}},'Preskočiť');
    skipBtn.onclick=()=>setState({smsModal:null});
    box.append(btns,skipBtn);
    ov.appendChild(box);
    frag.appendChild(ov);
  }

  return frag;
}

// ═══════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════
function renderApp(){
  const app=document.getElementById('app');
  app.innerHTML='';

  if(!appState.authed){ app.appendChild(renderPassword()); return; }

  const {page,subPage} = appState;

  let content;
  if(subPage==='calendar') content=renderCalendar();
  else if(subPage==='yearly') content=renderYearly();
  else if(subPage==='customers') content=renderCustomers();
  else if(subPage==='archive') content=renderArchive();
  else if(subPage==='nakup') content=renderNakup();
  else if(subPage==='backup') content=renderBackup();
  else if(page==='new'||page==='edit') content=renderForm(page==='edit');
  else if(page==='detail') content=renderDetail();
  else content=renderList();

  app.appendChild(content);
  app.appendChild(renderModals());
}

// Start
renderApp();
</script>
