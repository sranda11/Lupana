function findKovanieCena(text){
  if(!text) return null;
  const t=text.toLowerCase().replace(/[°]/g,'');
  for(const k of KOVANIE){
    // Full name match
    if(t.includes(k.nazov.toLowerCase().replace(/[°()/]/g,''))) return k;
    // ID match (strip digits from id for generic match e.g. 'zaves' matches 'zaves110')
    const idBase=k.id.replace(/\d+$/,'').toLowerCase();
    if(idBase.length>=4 && t.includes(idBase)) return k;
    if(t.includes(k.id.toLowerCase())) return k;
  }
  // First meaningful word of name (>=5 chars)
  for(const k of KOVANIE){
    const tokens=k.nazov.toLowerCase().replace(/[°()/]/g,'').split(/\s+/).filter(w=>w.length>=5);
    if(tokens.length>0 && t.includes(tokens[0])) return k;
  }
  return null;
}

function parseNakupLine(raw){
  // Try to extract trailing qty: "Záves 110° 5 ks" or "Záves — 5" or tab-separated "Záves\t5"
  let name=raw.trim(), qty=1;
  // Tab-separated: name \t qty
  const tabParts=raw.split(/\t+/);
  if(tabParts.length>=2){
    const last=tabParts[tabParts.length-1].trim().replace(/\s*ks\s*$/i,'');
    if(!isNaN(last)&&last!==''){
      qty=Math.max(1,parseFloat(last));
      name=tabParts[0].trim();
    } else {
      name=tabParts[0].trim();
    }
  } else {
    // Trailing number (optionally followed by "ks"): "Záves 110° — 5 ks" or "Záves 5"
    const m=name.match(/^(.*?)\s*[-–—]+\s*(\d+(?:[.,]\d+)?)\s*(?:ks)?\s*$/i)
           || name.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(?:ks)\s*$/i);
    if(m){
      qty=Math.max(1,parseFloat(m[2].replace(',','.')));
      name=m[1].trim();
    }
  }
  return {name, qty};
}

function resolveRailQty(name, piecesQty){
  // Detects "tyč / vesanie / tyc" items with embedded mm length
  // e.g. "vesanie tyc 391mm" with 4 ks → total 1564mm → ceil(1564/3000) = 1 tyč
  const isRail=/tyc|tyč|vesanie|vešanie/i.test(name);
  if(!isRail) return null;
  const mmMatch=name.match(/(\d+)\s*mm/i);
  if(!mmMatch) return null;
  const mmEach=parseInt(mmMatch[1]);
  const totalMm=mmEach*piecesQty;
  const rails=Math.ceil(totalMm/3000);
  return {qty:rails, note:`${piecesQty}× ${mmEach}mm = ${totalMm}mm → ${rails} ks tyče (3m)`};
}

function makeNakupItem(rawText, forcedQty){
  const {name, qty: parsedQty} = parseNakupLine(rawText);
  const qty = forcedQty!=null ? forcedQty : parsedQty;
  const match=findKovanieCena(name||rawText);
  const rail=resolveRailQty(name||rawText, qty);
  return {id:uid(), text: name||rawText.trim(), checked:false,
    qty: rail ? rail.qty : qty,
    cena: match ? match.cena : 0,
    ...(rail ? {railNote: rail.note} : {})
  };
}

  if(!o){ setState({subPage:null}); return document.createDocumentFragment(); }
  // Migrate items: extract qty from text, auto-assign price from KOVANIE
  const rawStored = o.nakupList||[];
  const hasEmbedded = t => /[-–—]\s*\d+\s*(?:ks)?\s*$/i.test(t||'');
  const list = rawStored.map(i=>{
    const needsParse = !('qty' in i) || (i.qty<=1 && hasEmbedded(i.text));
    let item;
    if(needsParse){
      const {name,qty}=parseNakupLine(i.text||'');
      const match=findKovanieCena(name||i.text||'');
      item={cena:0,...i, text:name||i.text, qty, cena: match ? match.cena : (i.cena||0)};
    } else if(!(i.cena>0)){
      const match=findKovanieCena(i.text||'');
      item={qty:1,...i, cena: match ? match.cena : 0};
    } else {
      item={qty:1,cena:0,...i};
    }
    // Rail resolution: if tyč item and no railNote yet, calculate number of 3m rails
    if(!item.railNote){
      const rail=resolveRailQty(item.text, needsParse ? item.qty : (i.qty||1));

      const cb=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #374151',flexShrink:'0',cursor:'pointer'}});
      cb.onclick=()=>saveList(list.map(i=>i.id===item.id?{...i,checked:true}:i));
      // Name (+ rail hint if applicable)
      const txt=el('span',{style:{color:'#F9FAFB',fontSize:'14px',flex:'1',minWidth:'80px'}},item.text);
      if(item.railNote) txt.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'10px',marginTop:'2px'}},item.railNote));
      // Qty input
      const qtyInp=el('input',{type:'number',min:'1',step:'1',style:{width:'52px',background:'#0B0F1A',border:'1px solid #1E2B3C',borderRadius:'6px',color:'#E8EDF5',padding:'5px 6px',fontSize:'13px',textAlign:'center',flexShrink:'0'}});
      qtyInp.value=item.qty||1;
      qtyInp.onchange=e=>{
        const q=Math.max(1,parseFloat(e.target.value)||1);
        saveList(list.map(i=>i.id===item.id?{...i,qty:q}:i));
      };
      // Unit price input
      const priceInp=el('input',{type:'number',min:'0',step:'0.5',style:{width:'62px',background:'#0B0F1A',border:'1px solid #1E2B3C',borderRadius:'6px',color:'#60A5FA',padding:'5px 6px',fontSize:'13px',textAlign:'right',flexShrink:'0'}});
      priceInp.value=item.cena||0;
      priceInp.onchange=e=>{
        const c=parseFloat(e.target.value)||0;
        saveList(list.map(i=>i.id===item.id?{...i,cena:c}:i));
      };
      // Line total
      const lineTotal=(item.qty||1)*(item.cena||0);
      const totalSpan=el('span',{style:{color: lineTotal>0?'#34D399':'#374151',fontWeight:'700',fontSize:'13px',whiteSpace:'nowrap',flexShrink:'0',minWidth:'56px',textAlign:'right'}},lineTotal>0?`${lineTotal.toFixed(2)} €`:'–');
      // Delete
      const db=el('button',{style:{background:'none',border:'none',color:'#374151',fontSize:'14px',padding:'4px 6px',cursor:'pointer',flexShrink:'0'}},'✕');
      db.onclick=()=>saveList(list.filter(i=>i.id!==item.id));
      row.append(cb,txt,qtyInp,priceInp,totalSpan,db);
      wrap.appendChild(row);
    });

    // Grand total bar
    const grandTotal=unchecked.reduce((s,i)=>s+(i.qty||1)*(i.cena||0),0);
    if(grandTotal>0){
      const totalBar=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 14px',background:'#0A1628',border:'1px solid #2563EB',borderRadius:'10px',marginTop:'10px',marginBottom:'6px'}});
      totalBar.appendChild(el('span',{style:{color:'#7A9AB8',fontSize:'12px',textTransform:'uppercase',letterSpacing:'0.5px'}},'Spolu nákup'));
      totalBar.appendChild(el('span',{style:{color:'#60A5FA',fontWeight:'700',fontSize:'20px'}},`${grandTotal.toFixed(2)} €`));
      wrap.appendChild(totalBar);
      // Add to order button
      const addBtn=el('button',{style:{width:'100%',background:'#2563EB',border:'none',borderRadius:'10px',color:'#fff',fontSize:'14px',fontWeight:'700',padding:'12px',cursor:'pointer',marginBottom:'14px'}},'+ Pridať do zákazky');
      addBtn.onclick=()=>{
        const entry={id:Date.now().toString(36),name:'Kovanie',cost:grandTotal,note:'',at:Date.now()};
        updateOrder(o.id,{materials:[entry,...(o.materials||[])]});
        setState({subPage:null, selId:o.id, page:'detail', tab:'materials'});
      };
      wrap.appendChild(addBtn);
    }
  } else {
    const emp=el('div',{style:{textAlign:'center',padding:'40px',color:'#374151'}});
    emp.append(el('div',{style:{fontSize:'32px',marginBottom:'8px'}},'🛒'),el('div',{},'Zoznam je prázdny'));
    wrap.appendChild(emp);
  }

  // Checked
  if(checked.length){
    wrap.appendChild(el('div',{style:{color:'#374151',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',margin:'16px 0 8px'}},'Nakúpené'));
    checked.forEach(item=>{
      const row=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'10px 12px',marginBottom:'4px',borderRadius:'10px',border:'1px solid #1a2e1a',background:'#0a0f0a',opacity:'0.6'}});
      const cb=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #10B981',background:'#10B981',flexShrink:'0',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}});
      cb.onclick=()=>saveList(list.map(i=>i.id===item.id?{...i,checked:false}:i));
      cb.appendChild(el('span',{style:{color:'#fff',fontSize:'13px',fontWeight:'700'}},'✓'));
      const txt=el('span',{style:{color:'#4B5563',fontSize:'14px',flex:'1',textDecoration:'line-through'}},item.text);
      const lineTotal=(item.qty||1)*(item.cena||0);
      if(lineTotal>0) txt.appendChild(el('span',{style:{color:'#1F4A2A',fontSize:'12px',marginLeft:'6px'}},`${lineTotal.toFixed(2)} €`));
      const db=el('button',{style:{background:'none',border:'none',color:'#374151',fontSize:'14px',padding:'4px 6px',cursor:'pointer'}},'✕');
      db.onclick=()=>saveList(list.filter(i=>i.id!==item.id));
      row.append(cb,txt,db); wrap.appendChild(row);
    });
  }
  frag.appendChild(wrap);
  return frag;
}

function renderNakupMerge(){
  // Merged shopping view — select orders, see combined list
  const {nakupSelected, nakupMergeChecked, data} = appState;
  const activeOrders=(data.orders||[]).filter(o=>o.status!=='storno');

  // Build merged list from selected orders
  const merged=[];
  nakupSelected.forEach(id=>{
    const o=activeOrders.find(x=>x.id===id);
    if(!o) return;
    (o.nakupList||[]).filter(i=>!i.checked).forEach(item=>{
      merged.push({...item, shopKey:id+'_'+item.id, orderName:o.customerName||o.title||'—'});
    });
  });
  const unchecked=merged.filter(m=>!nakupMergeChecked[m.shopKey]);
  const checked=merged.filter(m=>nakupMergeChecked[m.shopKey]);

  // Sklad items needing restock
  const skladReorder=(data.sklad||[]).filter(i=>i.qty<=i.minQty);
  const skladChecked=skladReorder.filter(i=>nakupMergeChecked['sklad_'+i.id]);
  const skladUnchecked=skladReorder.filter(i=>!nakupMergeChecked['sklad_'+i.id]);

  const hasAnyChecked=checked.length||skladChecked.length;
  const frag=document.createDocumentFragment();
  const clearBtn=hasAnyChecked?el('button',{style:{background:'none',border:'none',color:'#374151',fontSize:'13px',cursor:'pointer',padding:'4px 8px'}},'Vymazať hotové'):null;
  if(clearBtn) clearBtn.onclick=()=>{
    const nc={...nakupMergeChecked};
    checked.forEach(m=>delete nc[m.shopKey]);
    skladChecked.forEach(i=>delete nc['sklad_'+i.id]);
    setState({nakupMergeChecked:nc});
  };
  frag.appendChild(renderTopBar('🛒 Zlúčený nákup',()=>setState({subPage:null}),clearBtn||undefined));

  const wrap=el('div',{style:{padding:'12px 16px',paddingBottom:'40px'}});

  // ── Sklad — na dokúpenie (always visible if any) ─────────────────
  if(skladReorder.length){
    const sh=el('div',{style:{color:'#F59E0B',fontSize:'11px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'6px'}});
    sh.append(el('span',{},'📦 Sklad — na dokúpenie'),el('span',{style:{background:'#F59E0B',color:'#000',borderRadius:'10px',padding:'1px 7px',fontSize:'11px'}},String(skladUnchecked.length)));
    wrap.appendChild(sh);

    skladUnchecked.forEach(item=>{
      const row=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'12px 14px',marginBottom:'6px',borderRadius:'10px',border:'1px solid #78350F',background:'#1C1400',cursor:'pointer'}});
      row.onclick=()=>setState({nakupMergeChecked:{...nakupMergeChecked,['sklad_'+item.id]:true}});
      const cb=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #F59E0B',flexShrink:'0'}});
      const td=el('div',{style:{flex:'1'}});
      td.append(el('div',{style:{color:'#F9FAFB',fontSize:'15px'}},item.name),el('div',{style:{color:'#92400E',fontSize:'11px',marginTop:'2px'}},`Zostatok: ${item.qty} ${item.unit||'ks'} · Min: ${item.minQty}`));
      row.append(cb,td);
      wrap.appendChild(row);
    });
    if(skladChecked.length){
      skladChecked.forEach(item=>{
        const row=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 14px',marginBottom:'4px',borderRadius:'10px',border:'1px solid #1a2e1a',background:'#0a0f0a',opacity:'0.6',cursor:'pointer'}});
        row.onclick=()=>{ const nc={...nakupMergeChecked}; delete nc['sklad_'+item.id]; setState({nakupMergeChecked:nc}); };
        const cb=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #10B981',background:'#10B981',flexShrink:'0',display:'flex',alignItems:'center',justifyContent:'center'}});
        cb.appendChild(el('span',{style:{color:'#fff',fontSize:'13px',fontWeight:'700'}},'✓'));
        const td=el('div',{style:{flex:'1'}});
        td.append(el('div',{style:{color:'#4B5563',fontSize:'15px',textDecoration:'line-through'}},item.name),el('div',{style:{color:'#374151',fontSize:'11px'}},'Nakúpené'));
        row.append(cb,td);
        wrap.appendChild(row);
      });
    }
    wrap.appendChild(el('div',{style:{borderTop:'1px solid #1F2937',margin:'14px 0 12px'}}));
  }

  // Order selection
  wrap.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'10px'}},'Vyber zákazky na nákup'));

  activeOrders.forEach(o=>{
    const cnt=(o.nakupList||[]).filter(i=>!i.checked).length;
    const sel2=nakupSelected.includes(o.id);
    const oc=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 14px',marginBottom:'6px',borderRadius:'10px',border:`1px solid ${sel2?'#2563EB':'#1F2937'}`,background:sel2?'#0D1F3C':'#0D1117',cursor:'pointer'}});
    oc.onclick=()=>{ const ns=sel2?nakupSelected.filter(x=>x!==o.id):[...nakupSelected,o.id]; setState({nakupSelected:ns}); };
    const cb2=el('div',{style:{width:'22px',height:'22px',borderRadius:'6px',border:`2px solid ${sel2?'#2563EB':'#374151'}`,background:sel2?'#2563EB':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:'0'}});
    if(sel2) cb2.appendChild(el('span',{style:{color:'#fff',fontSize:'13px',fontWeight:'700'}},'✓'));
    const od=el('div',{style:{flex:'1'}});
    od.append(el('div',{style:{color:'#F9FAFB',fontWeight:'600',fontSize:'14px'}},o.customerName||'—'),el('div',{style:{color:'#4B5563',fontSize:'12px'}},`${o.title||'—'} · ${cnt} položiek`));
    oc.append(cb2,od);
    wrap.appendChild(oc);
  });

  // Merged list
  if(nakupSelected.length){
    const divider=el('div',{style:{borderTop:'1px solid #1F2937',margin:'16px 0 12px'}});
    wrap.appendChild(divider);
    if(!merged.length){
      wrap.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'20px'}},'Vybrané zákazky nemajú žiadne položky v nákupnom zozname'));
    } else {
      wrap.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'10px'}},`Celkový zoznam (${unchecked.length} položiek)`));
      unchecked.forEach(m=>{
        const row=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'12px 14px',marginBottom:'6px',borderRadius:'10px',border:'1px solid #1F2937',background:'#141926',cursor:'pointer'}});
        row.onclick=()=>setState({nakupMergeChecked:{...nakupMergeChecked,[m.shopKey]:true}});
        const cb3=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #374151',flexShrink:'0'}});
        const td=el('div',{style:{flex:'1'}});
        td.append(el('div',{style:{color:'#F9FAFB',fontSize:'15px'}},m.text),el('div',{style:{color:'#4B5563',fontSize:'11px',marginTop:'2px'}},m.orderName));
        row.append(cb3,td);
        wrap.appendChild(row);
      });
      if(checked.length){
        wrap.appendChild(el('div',{style:{color:'#374151',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',margin:'14px 0 8px'}},'Nakúpené'));
        checked.forEach(m=>{
          const row=el('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 14px',marginBottom:'4px',borderRadius:'10px',border:'1px solid #1a2e1a',background:'#0a0f0a',opacity:'0.6',cursor:'pointer'}});
          row.onclick=()=>{ const nc={...nakupMergeChecked}; delete nc[m.shopKey]; setState({nakupMergeChecked:nc}); };
          const cb4=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #10B981',background:'#10B981',flexShrink:'0',display:'flex',alignItems:'center',justifyContent:'center'}});
          cb4.appendChild(el('span',{style:{color:'#fff',fontSize:'13px',fontWeight:'700'}},'✓'));
          const td=el('div',{style:{flex:'1'}});
          td.append(el('div',{style:{color:'#4B5563',fontSize:'15px',textDecoration:'line-through'}},m.text),el('div',{style:{color:'#374151',fontSize:'11px'}},m.orderName));
          row.append(cb4,td);
          wrap.appendChild(row);
        });
      }
    }
  }
  frag.appendChild(wrap);
  return frag;
}

const SKLAD_UNITS=['ks','m','bal','m²','kg','l'];
function makeSkladUnitSelect(currentUnit, onChange){
  const sel=el('select',{style:{background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#9CA3AF',fontSize:'13px',padding:'4px 8px',cursor:'pointer',appearance:'auto'}});
  SKLAD_UNITS.forEach(u=>{
    const opt=el('option',{value:u},u);
    if(u===(currentUnit||'ks')) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=()=>onChange(sel.value);
  return sel;
}

function renderSklad(){
  const data=appState.data;
  const sklad=data.sklad||[];
  const frag=document.createDocumentFragment();

  frag.appendChild(renderTopBar('📦 Sklad',()=>setState({subPage:null})));

  const wrap=el('div',{style:{padding:'12px 16px',paddingBottom:'60px'}});

  function saveSklad(newSklad){ setData(d=>({...d, sklad:newSklad})); }

  // ── Items below threshold ────────────────────────────────────────
  const reorder=sklad.filter(i=>i.qty<=i.minQty);
  if(reorder.length){
    const secHdr=el('div',{style:{color:'#EF4444',fontSize:'11px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'6px'}});
    secHdr.append(el('span',{},'⚠️ Na dokúpenie'),el('span',{style:{background:'#EF4444',color:'#fff',borderRadius:'10px',padding:'1px 7px',fontSize:'11px'}},String(reorder.length)));
    const cartHint=el('span',{style:{marginLeft:'auto',color:'#EF4444',fontSize:'11px',cursor:'pointer',textDecoration:'underline'}},'→ Otvoriť košík');
    cartHint.onclick=()=>setState({subPage:'nakupMerge',nakupSelected:[],nakupMergeChecked:{}});
    secHdr.appendChild(cartHint);
    wrap.appendChild(secHdr);
    reorder.forEach(item=>{
      const row=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'10px 14px',marginBottom:'6px',borderRadius:'10px',border:'1px solid #7F1D1D',background:'#1A0A0A'}});
      const nameEl=el('div',{style:{flex:'1'}});
      nameEl.append(el('div',{style:{color:'#F9FAFB',fontWeight:'600',fontSize:'14px'}},item.name),el('div',{style:{color:'#EF4444',fontSize:'12px',marginTop:'2px'}},`Zostatok: ${item.qty} ${item.unit||'ks'} · Min: ${item.minQty} ${item.unit||'ks'}`));
      row.appendChild(nameEl);
      wrap.appendChild(row);
    });
    wrap.appendChild(el('div',{style:{borderTop:'1px solid #1F2937',margin:'14px 0 12px'}}));
  }

  // ── Celý sklad ───────────────────────────────────────────────────
  wrap.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'10px'}},`Skladové položky (${sklad.length})`));

  if(!sklad.length){
    wrap.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'30px 0',fontSize:'14px'}},'Sklad je prázdny. Pridaj prvú položku nižšie.'));
  }

  sklad.forEach((item,idx)=>{
    const low=item.qty<=item.minQty;
    const card=el('div',{style:{background:'#0D1117',border:`1px solid ${low?'#7F1D1D':'#1F2937'}`,borderRadius:'12px',padding:'12px 14px',marginBottom:'8px'}});

    // Row 1: name + delete
    const r1=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}});
    r1.append(el('div',{style:{flex:'1',color:'#F9FAFB',fontWeight:'600',fontSize:'15px'}},item.name));
    const delBtn=el('button',{style:{background:'none',border:'none',color:'#374151',fontSize:'16px',cursor:'pointer',padding:'2px 6px',lineHeight:'1'}},'✕');
    delBtn.onclick=()=>{ if(confirm(`Odstrániť „${item.name}" zo skladu?`)){ saveSklad(sklad.filter((_,i)=>i!==idx)); } };
    r1.appendChild(delBtn);
    card.appendChild(r1);

    // Row 2: qty controls + unit select + min
    const r2=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}});
    const minusBtn=el('button',{style:{width:'34px',height:'34px',borderRadius:'8px',border:'1px solid #374151',background:'#1a1a2e',color:'#9CA3AF',fontSize:'20px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},'-');
    minusBtn.onclick=()=>saveSklad(sklad.map((it,i)=>i===idx?{...it,qty:Math.max(0,it.qty-1)}:it));
    const qtyDisp=el('div',{style:{minWidth:'44px',textAlign:'center',color:low?'#EF4444':'#F9FAFB',fontWeight:'700',fontSize:'20px'}},String(item.qty));
    const plusBtn=el('button',{style:{width:'34px',height:'34px',borderRadius:'8px',border:'1px solid #374151',background:'#1a1a2e',color:'#9CA3AF',fontSize:'20px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},'+');
    plusBtn.onclick=()=>saveSklad(sklad.map((it,i)=>i===idx?{...it,qty:it.qty+1}:it));
    // Unit select
    const unitSel=makeSkladUnitSelect(item.unit,(v)=>saveSklad(sklad.map((it,i)=>i===idx?{...it,unit:v}:it)));
    r2.append(minusBtn,qtyDisp,plusBtn,unitSel,el('div',{style:{flex:'1'}}));
    // Min qty
    r2.appendChild(el('div',{style:{color:'#6B7280',fontSize:'12px',whiteSpace:'nowrap'}},'Min:'));
    const minInp=el('input',{type:'number',min:'0',value:String(item.minQty),style:{width:'52px',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#9CA3AF',fontSize:'13px',padding:'4px 8px',textAlign:'center'}});
    minInp.onchange=()=>saveSklad(sklad.map((it,i)=>i===idx?{...it,minQty:parseInt(minInp.value)||0}:it));
    r2.appendChild(minInp);
    card.appendChild(r2);

    if(item.note) card.appendChild(el('div',{style:{color:'#4B5563',fontSize:'12px',marginTop:'4px'}},item.note));
    wrap.appendChild(card);
  });

  // ── Pridať novú položku ──────────────────────────────────────────
  wrap.appendChild(el('div',{style:{borderTop:'1px solid #1F2937',margin:'16px 0 12px'}}));
  wrap.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'10px'}},'Pridať položku'));

  const addForm=el('div',{style:{background:'#0D1117',border:'1px solid #1F2937',borderRadius:'12px',padding:'14px'}});
  const nameInp=el('input',{type:'text',placeholder:'Názov položky (napr. Skrutky 4×40)',style:{width:'100%',boxSizing:'border-box',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#F9FAFB',fontSize:'14px',padding:'9px 12px',marginBottom:'8px'}});

  const row2=el('div',{style:{display:'flex',gap:'8px',marginBottom:'8px',alignItems:'center'}});
  // Unit select in form
  const unitSelNew=makeSkladUnitSelect('ks',()=>{});
  const qtyInp=el('input',{type:'number',placeholder:'Množstvo',min:'0',style:{width:'110px',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#F9FAFB',fontSize:'14px',padding:'9px 12px',textAlign:'center'}});
  row2.append(el('div',{style:{color:'#6B7280',fontSize:'13px'}},'Jednotka:'),unitSelNew,el('div',{style:{color:'#6B7280',fontSize:'13px',marginLeft:'8px'}},'Množstvo:'),qtyInp);

  const row3=el('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px'}});
  row3.append(el('div',{style:{color:'#6B7280',fontSize:'13px',whiteSpace:'nowrap'}},'Upozorniť keď zostane menej ako:'));
  const minQtyInp=el('input',{type:'number',min:'0',value:'1',style:{width:'70px',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#F9FAFB',fontSize:'14px',padding:'9px 12px',textAlign:'center'}});
  row3.appendChild(minQtyInp);

  const noteInp=el('input',{type:'text',placeholder:'Poznámka (nepovinné)',style:{width:'100%',boxSizing:'border-box',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#6B7280',fontSize:'13px',padding:'9px 12px',marginBottom:'10px'}});

  const addBtn=el('button',{style:{width:'100%',background:'#2563EB',border:'none',borderRadius:'10px',color:'#fff',fontWeight:'700',fontSize:'14px',padding:'11px',cursor:'pointer'}},'+ Pridať do skladu');
  addBtn.onclick=()=>{
    const name=nameInp.value.trim();
    if(!name){ nameInp.focus(); return; }
    const qty=parseInt(qtyInp.value)||0;
    const minQty=parseInt(minQtyInp.value)||1;
    const unit=unitSelNew.value||'ks';
    const note=noteInp.value.trim();
    saveSklad([...sklad,{id:'sk'+Date.now(),name,qty,unit,minQty,note,addedAt:Date.now()}]);
    nameInp.value=''; qtyInp.value=''; minQtyInp.value='1'; noteInp.value='';
    unitSelNew.value='ks';
    nameInp.focus();
  };

  addForm.append(nameInp,row2,row3,noteInp,addBtn);
  wrap.appendChild(addForm);
  frag.appendChild(wrap);
  return frag;
}


// ═══════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════
function renderApp(){
  const app=document.getElementById('app');
  app.innerHTML='';

  // Password disabled

  const {page,subPage} = appState;

  let content;
  if(subPage==='stats') content=renderStats();
  else if(subPage==='calendar') content=renderCalendar();
  else if(subPage==='yearly') content=renderYearly();
  else if(subPage==='customers') content=renderCustomers();
  else if(subPage==='archive') content=renderArchive();
  else if(subPage==='nakup') content=renderNakup();
  else if(subPage==='nakupOrder') content=renderNakupOrder();
  else if(subPage==='nakupMerge') content=renderNakupMerge();
  else if(subPage==='sklad') content=renderSklad();
  else if(subPage==='backup') content=renderBackup();
  else if(page==='new'||page==='edit') content=renderForm(page==='edit');
  else if(page==='detail') content=renderDetail();
  else content=renderList();

  app.appendChild(content);
  app.appendChild(renderModals());

  // (scroll to selected card disabled — keeps position static)
}

// Start
renderApp();
</script>
