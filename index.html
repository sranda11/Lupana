    ab2.append(nb,matb,cartb,porezb,wsb,timeb,attb,editb);
    card.appendChild(ab2);

    // ── Drag & Drop (touch + mouse) ──────────────────────────
    let longPressTimer=null, touchDragging=false, ghost=null, dragId=o.id;

    function startDrag(clientX,clientY){
      touchDragging=true;
      card.classList.add('drag-active');
      if(navigator.vibrate) navigator.vibrate(40);
      // Create ghost clone
      const rect=card.getBoundingClientRect();
      ghost=card.cloneNode(true);
      ghost.className='card-ghost';
      ghost.style.width=rect.width+'px';
      ghost.style.left=(clientX-rect.width/2)+'px';
      ghost.style.top=(clientY-rect.height/2)+'px';
      document.body.appendChild(ghost);
    }

    function moveDrag(clientX,clientY){
      if(!touchDragging||!ghost) return;
      const rect=card.getBoundingClientRect();
      ghost.style.left=(clientX-rect.width/2)+'px';
      ghost.style.top=(clientY-50)+'px';
      // Find card under touch
      ghost.style.display='none';
      const el2=document.elementFromPoint(clientX,clientY);
      ghost.style.display='';
      ol.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over'));
      const target=el2&&el2.closest('[data-orderid]');
      if(target&&target!==card) target.classList.add('drag-over');
    }

    function endDrag(clientX,clientY){
      if(!touchDragging) return;
      touchDragging=false;
      card.classList.remove('drag-active');
      ol.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over'));
      // Hide ghost before elementFromPoint so we can detect what's underneath
      if(ghost) ghost.style.display='none';
      const elUnder=document.elementFromPoint(clientX,clientY);
      if(ghost){ghost.remove();ghost=null;}
      const target=elUnder&&elUnder.closest('[data-orderid]');
      const targetId=target&&target.getAttribute('data-orderid');
      if(targetId&&targetId!==dragId){
        // Reorder
        const ids=filtered.map(x=>x.id);
        const fromIdx=ids.indexOf(dragId);
        const toIdx=ids.indexOf(targetId);
        if(fromIdx!==-1&&toIdx!==-1){
          ids.splice(fromIdx,1);
          ids.splice(toIdx,0,dragId);
          setData(d=>{
            const allIds=(d.orders||[]).map(x=>x.id);
            // merge: ids first, then any not in filtered
            const rest=allIds.filter(id=>!ids.includes(id));
            return {...d, orderSequence:[...ids,...rest]};
          });
        }
      }
    }

    // Touch events
    card.addEventListener('touchstart',e=>{
      if(e.touches.length!==1) return;
      const t=e.touches[0];
      longPressTimer=setTimeout(()=>startDrag(t.clientX,t.clientY),450);
    },{passive:true});

    card.addEventListener('touchmove',e=>{
      if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
      if(!touchDragging) return;
      e.preventDefault();
      moveDrag(e.touches[0].clientX,e.touches[0].clientY);
    },{passive:false});

    card.addEventListener('touchend',e=>{
      if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
      if(!touchDragging) return;
      e.preventDefault();
      const t=e.changedTouches[0];
      endDrag(t.clientX,t.clientY);
    },{passive:false});

    card.addEventListener('touchcancel',()=>{
      if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
      touchDragging=false;
      card.classList.remove('drag-active');
      if(ghost){ghost.remove();ghost=null;}
    });

    // Mouse events (desktop)
    card.setAttribute('draggable','true');
    card.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain',o.id);
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>card.classList.add('drag-active'),0);
    });
    card.addEventListener('dragend',()=>card.classList.remove('drag-active'));
    card.addEventListener('dragover',e=>{
      e.preventDefault();
      ol.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over'));
      card.classList.add('drag-over');
    });
    card.addEventListener('drop',e=>{
      e.preventDefault();
      const fromId=e.dataTransfer.getData('text/plain');
      const toId=o.id;
      ol.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over'));
      if(fromId&&fromId!==toId){
        const ids=filtered.map(x=>x.id);
        const fromIdx=ids.indexOf(fromId);
        const toIdx=ids.indexOf(toId);
        if(fromIdx!==-1&&toIdx!==-1){
          ids.splice(fromIdx,1);
          ids.splice(toIdx,0,fromId);
          setData(d=>{
            const rest=(d.orders||[]).map(x=>x.id).filter(id=>!ids.includes(id));
            return {...d, orderSequence:[...ids,...rest]};
          });
        }
      }
    });
    // ── koniec Drag & Drop ───────────────────────────────────

    ol.appendChild(card);
  });
  frag.appendChild(ol);
  return frag;
}

function renderStats(){
  const {calYear, data} = appState;
  const orders = (data.orders||[]).filter(o=>!o.archived);
  const months = ['Jan','Feb','Mar','Apr','Máj','Jún','Júl','Aug','Sep','Okt','Nov','Dec'];

  const byMonth = Array(12).fill(null).map((_,m)=>{
    // Počítame podľa dátumu vyplatenia (vyplatenaAt), nie vytvorenia
    const mo = orders.filter(o=>{
      if(!o.vyplatena) return false;
      const ts = o.vyplatenaAt || o.createdAt;
      const d = new Date(ts);
      return d.getFullYear()===calYear && d.getMonth()===m;
    });
    const total = mo.reduce((s,o)=>s+(parseFloat(o.price)||0), 0);
    const avg = mo.length ? total/mo.length : 0;
    return {label:months[m], count:mo.length, total, avg};
  });

  const totalOrders = byMonth.reduce((s,m)=>s+m.count, 0);
  const totalValue  = byMonth.reduce((s,m)=>s+m.total, 0);
  const avgValue    = totalOrders ? totalValue/totalOrders : 0;
  const maxCount    = Math.max(...byMonth.map(m=>m.count), 1);
  const bestMonth   = byMonth.reduce((best,m)=>m.count>best.count?m:best, byMonth[0]);

  const frag = document.createDocumentFragment();
  const yearNav = el('div',{style:{display:'flex',gap:'6px',alignItems:'center'}});
  const yp = el('button',{style:{background:'#1F2937',border:'none',borderRadius:'6px',color:'#9CA3AF',padding:'4px 10px',cursor:'pointer',fontSize:'16px'}},'‹');
  yp.onclick = ()=>setState({calYear:calYear-1});
  const yn = el('button',{style:{background:'#1F2937',border:'none',borderRadius:'6px',color:'#9CA3AF',padding:'4px 10px',cursor:'pointer',fontSize:'16px'}},'›');
  yn.onclick = ()=>setState({calYear:calYear+1});
  yearNav.append(yp, el('span',{style:{color:'#F9FAFB',fontWeight:'700',fontSize:'15px'}},String(calYear)), yn);
  frag.appendChild(renderTopBar('📈 Štatistiky', ()=>setState({subPage:null}), yearNav));

  const wrap = el('div',{style:{padding:'12px 16px',paddingBottom:'40px'}});

  // Summary cards
  const cards = el('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}});
  function scard(lbl,val,color){
    const c=el('div',{style:{flex:'1',background:'#111827',borderRadius:'10px',padding:'10px 12px',border:'1px solid #1F2937'}});
    c.append(el('div',{style:{color:'#4B5563',fontSize:'9px',textTransform:'uppercase',letterSpacing:'1px'}},lbl), el('div',{style:{color,fontWeight:'700',fontSize:'20px',marginTop:'4px'}},val));
    return c;
  }
  cards.append(
    scard('Zákazky', String(totalOrders), '#60A5FA'),
    scard('Priemer', fmt(avgValue), '#34D399'),
    scard('Najlepší', bestMonth.count>0 ? bestMonth.label : '—', '#F59E0B')
  );
  wrap.appendChild(cards);

  // Bar chart — počet zákaziek po mesiacoch
  const chart = el('div',{style:{background:'#111827',borderRadius:'12px',padding:'16px 12px 10px',border:'1px solid #1F2937',marginBottom:'14px'}});
  chart.appendChild(el('div',{style:{color:'#4B5563',fontSize:'10px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'12px'}},'Počet zákaziek po mesiacoch'));
  const bars = el('div',{style:{display:'flex',alignItems:'flex-end',gap:'3px',height:'110px'}});
  byMonth.forEach(m=>{
    const col = el('div',{style:{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px'}});
    const barH = Math.max(m.count>0?6:0, Math.round((m.count/maxCount)*95));
    const bar = el('div',{style:{width:'100%',borderRadius:'4px 4px 0 0',background:m.count>0?'#3B82F6':'#1F2937',height:`${barH}px`,position:'relative',display:'flex',alignItems:'flex-start',justifyContent:'center'}});
    if(m.count>0) bar.appendChild(el('span',{style:{color:'#fff',fontSize:'9px',fontWeight:'700',marginTop:'2px'}},String(m.count)));
    col.append(bar, el('div',{style:{color:'#4B5563',fontSize:'8px',textAlign:'center'}},m.label));
    bars.appendChild(col);
  });
  chart.appendChild(bars);
  wrap.appendChild(chart);

  // Monthly detail table
  const tbl = el('div',{style:{background:'#111827',borderRadius:'12px',border:'1px solid #1F2937',overflow:'hidden'}});
  tbl.appendChild(el('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',padding:'8px 14px',borderBottom:'1px solid #1F2937'}},...['Mesiac','Zákaziek','Suma','Priemer'].map(h=>el('div',{style:{color:'#3A4D65',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.8px',fontWeight:'700'}},h))));
  byMonth.forEach((m,idx)=>{
    if(m.count===0) return;
    const row = el('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',padding:'10px 14px',borderBottom:'1px solid #0D1117',background:idx%2===0?'#111827':'#0D1117'}});
    row.append(
      el('span',{style:{color:'#E8EDF5',fontSize:'13px',fontWeight:'600'}},m.label),
      el('span',{style:{color:'#60A5FA',fontSize:'13px',fontWeight:'700'}},String(m.count)),
      el('span',{style:{color:'#F59E0B',fontSize:'13px'}},fmt(m.total)),
      el('span',{style:{color:'#34D399',fontSize:'13px'}},fmt(m.avg))

  });

  wrap.appendChild(tbl);

  frag.appendChild(wrap);
  return frag;
}

function renderCalendar(){
  const {calYear,calMonth,data} = appState;
  const orders=data.orders||[];
  const monthNames=['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
  const dayNames=['Po','Ut','St','Št','Pi','So','Ne'];
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const adjustedFirst=(firstDay+6)%7;
  const deadlinesByDay={};
  orders.forEach(o=>{
    const dl=o.deadlineDate?new Date(o.deadlineDate):o.depositDate?new Date(new Date(o.depositDate).setMonth(new Date(o.depositDate).getMonth()+2)):null;
    if(dl&&dl.getFullYear()===calYear&&dl.getMonth()===calMonth){
      const d=dl.getDate();
      if(!deadlinesByDay[d]) deadlinesByDay[d]=[];
      deadlinesByDay[d].push(o);
    }
  });
  const today2=new Date();
  const frag=document.createDocumentFragment();
  frag.appendChild(renderTopBar('📅 Kalendár',()=>setState({subPage:null})));
  const wrap=el('div',{style:{padding:'12px 16px'}});
  const nav=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}});
  const prevBtn=el('button',{style:{background:'#1F2937',border:'none',borderRadius:'8px',color:'#fff',fontSize:'18px',width:'36px',height:'36px',cursor:'pointer'}},'‹');
  prevBtn.onclick=()=>{ if(calMonth===0) setState({calMonth:11,calYear:calYear-1}); else setState({calMonth:calMonth-1}); };
  const nextBtn=el('button',{style:{background:'#1F2937',border:'none',borderRadius:'8px',color:'#fff',fontSize:'18px',width:'36px',height:'36px',cursor:'pointer'}},'›');
  nextBtn.onclick=()=>{ if(calMonth===11) setState({calMonth:0,calYear:calYear+1}); else setState({calMonth:calMonth+1}); };
  nav.append(prevBtn,el('span',{style:{color:'#F9FAFB',fontWeight:'700',fontSize:'17px'}},`${monthNames[calMonth]} ${calYear}`),nextBtn);
  wrap.appendChild(nav);
  const dayNamesRow=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px',marginBottom:'4px'}});
  dayNames.forEach(d=>dayNamesRow.appendChild(el('div',{style:{textAlign:'center',color:'#4B5563',fontSize:'11px',padding:'4px 0',fontWeight:'700'}},d)));
  wrap.appendChild(dayNamesRow);
  const grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'3px'}});
  for(let i=0;i<adjustedFirst;i++) grid.appendChild(el('div'));
  for(let day=1;day<=daysInMonth;day++){
    const isToday=today2.getDate()===day&&today2.getMonth()===calMonth&&today2.getFullYear()===calYear;
    const events=deadlinesByDay[day]||[];
    const cell=el('div',{style:{background:isToday?'#1E3A5F':events.length?'#0D1117':'#0a0a0a',borderRadius:'8px',padding:'6px 4px',minHeight:'52px',border:isToday?'1px solid #3B82F6':events.length?'1px solid #1F2937':'1px solid transparent',textAlign:'center'}});
    cell.appendChild(el('div',{style:{color:isToday?'#60A5FA':'#9CA3AF',fontSize:'13px',fontWeight:isToday?'700':'400',marginBottom:'2px'}},String(day)));
    events.forEach(o=>{
      const st=statusOf(o.status);
      const ev=el('div',{style:{fontSize:'9px',background:st.color+'22',color:st.color,borderRadius:'3px',padding:'1px 3px',marginTop:'2px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',cursor:'pointer'}},o.customerName||o.title);
      ev.onclick=()=>setState({subPage:null,selId:o.id,tab:'info',page:'detail'});
      cell.appendChild(ev);
    });
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  frag.appendChild(wrap);
  return frag;
}

    // ── picker helper ──────────────────────────────────────────────
    function makeScrollPicker(items, initIdx, onSelect){
      const IH=48;
      const wrap=document.createElement('div');
      wrap.style.cssText='position:relative;flex:1;min-width:0;';
      const sc=document.createElement('div');
      sc.style.cssText=`height:${IH*3}px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;`;
      // Padding spacers
      [1,1].forEach(()=>{
        const sp=document.createElement('div');
        sp.style.cssText=`height:${IH}px;flex-shrink:0;scroll-snap-align:none;`;
        sc.appendChild(sp);
      });
      // Rewrite: add top spacer, items, bottom spacer
      sc.innerHTML='';
      const top=document.createElement('div'); top.style.height=IH+'px'; sc.appendChild(top);
      items.forEach((label,i)=>{
        const d=document.createElement('div');
        d.style.cssText=`height:${IH}px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:16px;color:#E8EDF5;user-select:none;`;
        d.textContent=label;
        sc.appendChild(d);

      const bot=document.createElement('div'); bot.style.height=IH+'px'; sc.appendChild(bot);
      // Highlight bar
      const bar=document.createElement('div');
      bar.style.cssText=`position:absolute;top:${IH}px;left:4px;right:4px;height:${IH}px;border-top:1px solid #3B82F6;border-bottom:1px solid #3B82F6;border-radius:4px;pointer-events:none;`;
      wrap.appendChild(sc);
      wrap.appendChild(bar);
      // Scroll to init
      requestAnimationFrame(()=>{ sc.scrollTop=initIdx*IH; });
      // On scroll end
      let t;
      const settle=()=>{
        clearTimeout(t);
        t=setTimeout(()=>{
          const idx=Math.max(0,Math.min(Math.round(sc.scrollTop/IH), items.length-1));
          sc.scrollTop=idx*IH;
          onSelect(idx);
        },120);
      };
      sc.addEventListener('scroll',settle,{passive:true});
      return wrap;
    }
    // ──────────────────────────────────────────────────────────────

    // Date labels
    const dates=montazPickerDates();
    const dayNames=['ned','pon','uto','str','štv','pia','sob'];
    const months=['jan','feb','mar','apr','máj','jún','júl','aug','sep','okt','nov','dec'];
    const dateLabels=dates.map(d=>{
      const isToday=d.toDateString()===new Date().toDateString();

    });

    // Hour labels 0-23
    const hours=Array.from({length:24},(_,i)=>i);
    const hourLabels=hours.map(h=>String(h).padStart(2,'0'));

    // Minute labels
    const minLabels=['00','15','30','45'];

    const initHourIdx=Math.max(0,Math.min(mp.selHour, 23));

    const row=el('div',{style:{display:'flex',gap:'8px',marginBottom:'20px',height:'144px'}});

    const hourPicker=makeScrollPicker(hourLabels, initHourIdx, idx=>{ appState.montazPicker={...appState.montazPicker, selHour:idx}; });
    const minPicker=makeScrollPicker(minLabels, initMinIdx, idx=>{ appState.montazPicker={...appState.montazPicker, selMinuteIdx:idx}; });

    const pickerWrap=el('div',{style:{display:'flex',gap:'8px',marginBottom:'4px'}});
    pickerWrap.appendChild(el('div',{style:{flex:'1',textAlign:'center',color:'#4B5563',fontSize:'11px'}},'Dátum'));
    pickerWrap.appendChild(el('div',{style:{flex:'1',textAlign:'center',color:'#4B5563',fontSize:'11px'}},'Hodina'));
    pickerWrap.appendChild(el('div',{style:{flex:'1',textAlign:'center',color:'#4B5563',fontSize:'11px'}},'Min'));
    box.appendChild(pickerWrap);

    row.appendChild(datePicker);
    row.appendChild(hourPicker);
    row.appendChild(minPicker);
    box.appendChild(row);

    const confirmBtn=el('button',{style:{width:'100%',background:'#1D4ED8',border:'none',borderRadius:'10px',color:'#fff',fontWeight:'700',fontSize:'16px',padding:'14px 0',cursor:'pointer',marginBottom:'10px'}},'✓ Potvrdiť termín');

    cancelBtn.onclick=()=>setState({montazPicker:null});
    box.append(confirmBtn,cancelBtn);
    ov.appendChild(box);
    frag.appendChild(ov);
  }

  // SMS modal
  if(appState.smsModal){
    const m=appState.smsModal;
    const ov=el('div',{className:'modal-overlay'});
    const box=el('div',{className:'modal-box'});
    box.appendChild(el('div',{style:{color:'#9CA3AF',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'6px'}},'Notifikácia zákazníkovi'));

function findKovanieCena(text){
  if(!text) return null;
  const t=text.toLowerCase().replace(/[°]/g,'');
  for(const k of KOVANIE){
    // Full name match
    if(t.includes(k.nazov.toLowerCase().replace(/[°()/]/g,''))) return k;
    // ID match (strip digits from id for generic match e.g. 'zaves' matches 'zaves110')
    const idBase=k.id.replace(/\d+$/,'').toLowerCase();
    if(idBase.length>=4 && t.includes(idBase)) return k;
    if(t.includes(k.id.toLowerCase())) return k;
  }
  // First meaningful word of name (>=5 chars)
  for(const k of KOVANIE){
    const tokens=k.nazov.toLowerCase().replace(/[°()/]/g,'').split(/\s+/).filter(w=>w.length>=5);
    if(tokens.length>0 && t.includes(tokens[0])) return k;
  }
  return null;
}

function parseNakupLine(raw){
  // Try to extract trailing qty: "Záves 110° 5 ks" or "Záves — 5" or tab-separated "Záves\t5"
  let name=raw.trim(), qty=1;
  // Tab-separated: name \t qty
  const tabParts=raw.split(/\t+/);
  if(tabParts.length>=2){
    const last=tabParts[tabParts.length-1].trim().replace(/\s*ks\s*$/i,'');
    if(!isNaN(last)&&last!==''){
      qty=Math.max(1,parseFloat(last));
      name=tabParts[0].trim();
    } else {
      name=tabParts[0].trim();
    }
  } else {
    // Trailing number (optionally followed by "ks"): "Záves 110° — 5 ks" or "Záves 5"
    const m=name.match(/^(.*?)\s*[-–—]+\s*(\d+(?:[.,]\d+)?)\s*(?:ks)?\s*$/i)
           || name.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(?:ks)\s*$/i);
    if(m){
      qty=Math.max(1,parseFloat(m[2].replace(',','.')));
      name=m[1].trim();
    }
  }
  return {name, qty};
}

function resolveRailQty(name, piecesQty){
  // Detects "tyč / vesanie / tyc" items with embedded mm length
  // e.g. "vesanie tyc 391mm" with 4 ks → total 1564mm → ceil(1564/3000) = 1 tyč
  const isRail=/tyc|tyč|vesanie|vešanie/i.test(name);
  if(!isRail) return null;
  const mmMatch=name.match(/(\d+)\s*mm/i);
  if(!mmMatch) return null;
  const mmEach=parseInt(mmMatch[1]);
  const totalMm=mmEach*piecesQty;
  const rails=Math.ceil(totalMm/3000);
  return {qty:rails, note:`${piecesQty}× ${mmEach}mm = ${totalMm}mm → ${rails} ks tyče (3m)`};
}

function makeNakupItem(rawText, forcedQty){
  const {name, qty: parsedQty} = parseNakupLine(rawText);
  const qty = forcedQty!=null ? forcedQty : parsedQty;
  const match=findKovanieCena(name||rawText);
  const rail=resolveRailQty(name||rawText, qty);
  return {id:uid(), text: name||rawText.trim(), checked:false,
    qty: rail ? rail.qty : qty,
    cena: match ? match.cena : 0,
    ...(rail ? {railNote: rail.note} : {})
  };
}

  const list = rawStored.map(i=>{
    const needsParse = !('qty' in i) || (i.qty<=1 && hasEmbedded(i.text));

    if(!item.railNote){

function renderNakupMerge(){

  const {nakupSelected, nakupMergeChecked, data} = appState;
  const activeOrders=(data.orders||[]).filter(o=>o.status!=='storno');

  // Build merged list from selected orders
  const merged=[];
  nakupSelected.forEach(id=>{
    const o=activeOrders.find(x=>x.id===id);
    if(!o) return;
    (o.nakupList||[]).filter(i=>!i.checked).forEach(item=>{
      merged.push({...item, shopKey:id+'_'+item.id, orderName:o.customerName||o.title||'—'});
    });
  });

  // Zoskup rovnaké položky (case-insensitive) a sčítaj qty
  const groupMap={};
  merged.forEach(m=>{
    const key=(m.text||'').trim().toLowerCase()||m.shopKey;
    if(!groupMap[key]){groupMap[key]={text:m.text||'—',shopKeys:[],orderNames:[],totalQty:0};}
    groupMap[key].shopKeys.push(m.shopKey);
    groupMap[key].totalQty+=Math.max(parseFloat(m.qty)||1,1);

    const nc={...nakupMergeChecked};
    checked.forEach(m=>delete nc[m.shopKey]);
    skladChecked.forEach(i=>delete nc['sklad_'+i.id]);

        row.onclick=()=>{ const nc={...nakupMergeChecked}; g.shopKeys.forEach(k=>nc[k]=true); setState({nakupMergeChecked:nc}); };
        const cb3=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #374151',flexShrink:'0'}});
        const td=el('div',{style:{flex:'1'}});

          row.onclick=()=>{ const nc={...nakupMergeChecked}; g.shopKeys.forEach(k=>delete nc[k]); setState({nakupMergeChecked:nc}); };
          const cb4=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid #10B981',background:'#10B981',flexShrink:'0',display:'flex',alignItems:'center',justifyContent:'center'}});
          cb4.appendChild(el('span',{style:{color:'#fff',fontSize:'13px',fontWeight:'700'}},'✓'));
          const td=el('div',{style:{flex:'1'}});
          const nameRow=el('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
          nameRow.appendChild(el('span',{style:{color:'#4B5563',fontSize:'15px',textDecoration:'line-through'}},g.text));
          if(g.totalQty>1){ const qd=Number.isInteger(g.totalQty)?`${g.totalQty}×`:`${g.totalQty.toFixed(1)}×`; nameRow.appendChild(el('span',{style:{color:'#374151',fontSize:'12px'}},qd)); }
          td.appendChild(nameRow);
          td.appendChild(el('div',{style:{color:'#374151',fontSize:'11px'}},g.orderNames.join(', ')));
          row.append(cb4,td);
          wrap.appendChild(row);
        });
      }
    }
  }
  frag.appendChild(wrap);
  return frag;
}

const SKLAD_UNITS=['ks','m','bal','m²','kg','l'];
function makeSkladUnitSelect(currentUnit, onChange){
  const sel=el('select',{style:{background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#9CA3AF',fontSize:'13px',padding:'4px 8px',cursor:'pointer',appearance:'auto'}});
  SKLAD_UNITS.forEach(u=>{
    const opt=el('option',{value:u},u);
    if(u===(currentUnit||'ks')) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=()=>onChange(sel.value);
  return sel;
}

function renderSklad(){
  const data=appState.data;
  const sklad=data.sklad||[];
  const frag=document.createDocumentFragment();

  frag.appendChild(renderTopBar('📦 Sklad',()=>setState({subPage:null})));

  function saveSklad(newSklad){ setData(d=>({...d, sklad:newSklad})); }

  // ── Items below threshold ────────────────────────────────────────

    const secHdr=el('div',{style:{color:'#EF4444',fontSize:'11px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'6px'}});

    const cartHint=el('span',{style:{marginLeft:'auto',color:'#EF4444',fontSize:'11px',cursor:'pointer',textDecoration:'underline'}},'→ Otvoriť košík');

    reorder.forEach(item=>{
      const row=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'10px 14px',marginBottom:'6px',borderRadius:'10px',border:'1px solid #7F1D1D',background:'#1A0A0A'}});
      const nameEl=el('div',{style:{flex:'1'}});
      nameEl.append(el('div',{style:{color:'#F9FAFB',fontWeight:'600',fontSize:'14px'}},item.name),el('div',{style:{color:'#EF4444',fontSize:'12px',marginTop:'2px'}},`Zostatok: ${item.qty} ${item.unit||'ks'} · Min: ${item.minQty} ${item.unit||'ks'}`));
      row.appendChild(nameEl);
      wrap.appendChild(row);
    });
    wrap.appendChild(el('div',{style:{borderTop:'1px solid #1F2937',margin:'14px 0 12px'}}));

  // ── Celý sklad ───────────────────────────────────────────────────
  wrap.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'10px'}},`Skladové položky (${sklad.length})`));

  if(!sklad.length){
    wrap.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'30px 0',fontSize:'14px'}},'Sklad je prázdny. Pridaj prvú položku nižšie.'));
  }

  sklad.forEach((item,idx)=>{
    const low=item.qty<=item.minQty;
    const card=el('div',{style:{background:'#0D1117',border:`1px solid ${low?'#7F1D1D':'#1F2937'}`,borderRadius:'12px',padding:'12px 14px',marginBottom:'8px'}});

    // Row 1: name + delete
    const r1=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}});
    r1.append(el('div',{style:{flex:'1',color:'#F9FAFB',fontWeight:'600',fontSize:'15px'}},item.name));
    const delBtn=el('button',{style:{background:'none',border:'none',color:'#374151',fontSize:'16px',cursor:'pointer',padding:'2px 6px',lineHeight:'1'}},'✕');
    delBtn.onclick=()=>{ if(confirm(`Odstrániť „${item.name}" zo skladu?`)){ saveSklad(sklad.filter((_,i)=>i!==idx)); } };
    r1.appendChild(delBtn);
    card.appendChild(r1);

    // Row 2: qty controls + unit select + min
    const r2=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}});
    const minusBtn=el('button',{style:{width:'34px',height:'34px',borderRadius:'8px',border:'1px solid #374151',background:'#1a1a2e',color:'#9CA3AF',fontSize:'20px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},'-');
    minusBtn.onclick=()=>saveSklad(sklad.map((it,i)=>i===idx?{...it,qty:Math.max(0,it.qty-1)}:it));
    const qtyDisp=el('div',{style:{minWidth:'44px',textAlign:'center',color:low?'#EF4444':'#F9FAFB',fontWeight:'700',fontSize:'20px'}},String(item.qty));
    const plusBtn=el('button',{style:{width:'34px',height:'34px',borderRadius:'8px',border:'1px solid #374151',background:'#1a1a2e',color:'#9CA3AF',fontSize:'20px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},'+');
    plusBtn.onclick=()=>saveSklad(sklad.map((it,i)=>i===idx?{...it,qty:it.qty+1}:it));
    // Unit select
    const unitSel=makeSkladUnitSelect(item.unit,(v)=>saveSklad(sklad.map((it,i)=>i===idx?{...it,unit:v}:it)));
    r2.append(minusBtn,qtyDisp,plusBtn,unitSel,el('div',{style:{flex:'1'}}));
    // Min qty
    r2.appendChild(el('div',{style:{color:'#6B7280',fontSize:'12px',whiteSpace:'nowrap'}},'Min:'));
    const minInp=el('input',{type:'number',min:'0',value:String(item.minQty),style:{width:'52px',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#9CA3AF',fontSize:'13px',padding:'4px 8px',textAlign:'center'}});
    minInp.onchange=()=>saveSklad(sklad.map((it,i)=>i===idx?{...it,minQty:parseInt(minInp.value)||0}:it));
    r2.appendChild(minInp);
    card.appendChild(r2);

    if(item.note) card.appendChild(el('div',{style:{color:'#4B5563',fontSize:'12px',marginTop:'4px'}},item.note));
    wrap.appendChild(card);
  });

  // ── Pridať novú položku ──────────────────────────────────────────
  wrap.appendChild(el('div',{style:{borderTop:'1px solid #1F2937',margin:'16px 0 12px'}}));
  wrap.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'10px'}},'Pridať položku'));

  const addForm=el('div',{style:{background:'#0D1117',border:'1px solid #1F2937',borderRadius:'12px',padding:'14px'}});
  const nameInp=el('input',{type:'text',placeholder:'Názov položky (napr. Skrutky 4×40)',style:{width:'100%',boxSizing:'border-box',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#F9FAFB',fontSize:'14px',padding:'9px 12px',marginBottom:'8px'}});

  const row2=el('div',{style:{display:'flex',gap:'8px',marginBottom:'8px',alignItems:'center'}});
  // Unit select in form
  const unitSelNew=makeSkladUnitSelect('ks',()=>{});
  const qtyInp=el('input',{type:'number',placeholder:'Množstvo',min:'0',style:{width:'110px',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#F9FAFB',fontSize:'14px',padding:'9px 12px',textAlign:'center'}});
  row2.append(el('div',{style:{color:'#6B7280',fontSize:'13px'}},'Jednotka:'),unitSelNew,el('div',{style:{color:'#6B7280',fontSize:'13px',marginLeft:'8px'}},'Množstvo:'),qtyInp);

  const row3=el('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px'}});
  row3.append(el('div',{style:{color:'#6B7280',fontSize:'13px',whiteSpace:'nowrap'}},'Upozorniť keď zostane menej ako:'));
  const minQtyInp=el('input',{type:'number',min:'0',value:'1',style:{width:'70px',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#F9FAFB',fontSize:'14px',padding:'9px 12px',textAlign:'center'}});
  row3.appendChild(minQtyInp);

  const noteInp=el('input',{type:'text',placeholder:'Poznámka (nepovinné)',style:{width:'100%',boxSizing:'border-box',background:'#111827',border:'1px solid #374151',borderRadius:'8px',color:'#6B7280',fontSize:'13px',padding:'9px 12px',marginBottom:'10px'}});

  const addBtn=el('button',{style:{width:'100%',background:'#2563EB',border:'none',borderRadius:'10px',color:'#fff',fontWeight:'700',fontSize:'14px',padding:'11px',cursor:'pointer'}},'+ Pridať do skladu');
  addBtn.onclick=()=>{
    const name=nameInp.value.trim();
    if(!name){ nameInp.focus(); return; }
    const qty=parseInt(qtyInp.value)||0;
    const minQty=parseInt(minQtyInp.value)||1;
    const unit=unitSelNew.value||'ks';
    const note=noteInp.value.trim();
    saveSklad([...sklad,{id:'sk'+Date.now(),name,qty,unit,minQty,note,addedAt:Date.now()}]);
    nameInp.value=''; qtyInp.value=''; minQtyInp.value='1'; noteInp.value='';
    unitSelNew.value='ks';
    nameInp.focus();
  };

  addForm.append(nameInp,row2,row3,noteInp,addBtn);
  wrap.appendChild(addForm);
  frag.appendChild(wrap);
  return frag;
}

function renderWorkspace(order){
  document.body.style.overflow='hidden';
  const BG='#f5f6f7';
  const D=()=>window.devicePixelRatio||1;
  const items=[...(order.workspace||[])];
  const imgCache=new Map();
  items.forEach(s=>{ if(s.tool==='image'&&s.data&&!imgCache.has(s.data)){ const i=new Image(); i.onload=()=>redraw(); i.src=s.data; imgCache.set(s.data,i); } });

  // State
  let dirty=false;
  let activeTool='pencil'; // pencil | finepen | marker | eraser | move
  let curColor='#1a1a1a';
  let drawing=false, curPts=[];
  let selIdx=-1, dragMode=null, dragOrig=null, dragStartPt=null;
  let pinch=null; // image-resize pinch
  let canvasPinch=null; // canvas zoom/pan two-finger gesture
  let rafId=null;
  let showSizePanel=false;
  let pointerScreen=null; // current pointer in screen CSS px (for cursor circle)
  let offC=null,offCtx=null; // offscreen canvas for stroke layer (eraser uses destination-out here)
  let holdTimer=null,holdSnapped=false,holdStart=0; // straight-line hold gesture
  let canvasSizeKnown=false; // for one-time migration of old items
  let vp={tx:0,ty:0,scale:1}; // viewport: screen_css = world*scale + tx/ty
  const MIN_SCALE=0.1,MAX_SCALE=12;

  // ── Auto-save (debounced, 1.5 s after last change) ──
  let autoSaveTimer=null;
  function schedAutoSave(){
    if(autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer=setTimeout(()=>{
      autoSaveTimer=null;
      if(!dirty) return;
      updateOrder(order.id,{workspace:[...items]});
      dirty=false;
      // Brief green flash on save button
      saveBtn.style.background='#1a7f37';
      setTimeout(()=>saveBtn.style.background='#0058bb',900);
    },1500);
  }

  const schedRedraw=()=>{
    if(dirty) schedAutoSave();
    if(!rafId) rafId=requestAnimationFrame(()=>{ rafId=null; redraw(); });
  };

  // Per-tool sizes (persist as user changes them)
  const toolSizes={finepen:1,pencil:2,marker:10,brush:16,eraser:24};
  // Tool → canvas params
  function toolParams(){ const ps=toolSizes[activeTool]; switch(activeTool){ case 'finepen': return {size:ps||1,color:curColor,eraser:false}; case 'pencil': return {size:ps||2,color:curColor,eraser:false}; case 'marker': return {size:ps||10,color:curColor+'bb',eraser:false}; case 'brush': return {size:ps||16,color:curColor+'99',eraser:false}; case 'eraser': return {size:ps||24,color:BG,eraser:true}; default: return {size:ps||2,color:curColor,eraser:false}; } }

  // ── WRAP ──
  const wrap=el('div',{style:{position:'fixed',top:'0',left:'0',width:'100%',zIndex:'999',background:BG,overflow:'hidden',fontFamily:"'Inter',system-ui,sans-serif"}});
  wrap.style.height=window.innerHeight+'px';
  window.addEventListener('resize',()=>{ wrap.style.height=window.innerHeight+'px'; resizeCanvas(); });

  function goBack(){ document.body.style.overflow=''; setState({subPage:null,page:'list',selectedCard:appState.selId}); }

  // ══════════ TOP NAVBAR (floating pill) ══════════
  const nav=el('div',{style:{position:'absolute',top:'16px',left:'16px',right:'16px',zIndex:'50',display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 8px 8px 16px',background:'rgba(255,255,255,0.92)',backdropFilter:'blur(16px)',WebkitBackdropFilter:'blur(16px)',borderRadius:'9999px',boxShadow:'0 1px 12px rgba(0,0,0,0.08)',border:'1px solid rgba(0,0,0,0.06)'}});
  // Left
  const navL=el('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
  const backBtn=el('button',{style:{width:'36px',height:'36px',borderRadius:'50%',border:'none',background:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#2c2f30',fontSize:'18px'}});
  backBtn.textContent='←';
  backBtn.onclick=()=>{ if(dirty&&items.length&&!confirm('Neuložené zmeny. Zatvoriť?')) return; goBack(); };
  const navTitle=el('span',{style:{fontFamily:"'Manrope',sans-serif",fontWeight:'700',fontSize:'15px',color:'#1a1a1a'}},order.customerName||'Workspace');
  navL.append(backBtn,navTitle);
  // Right
  const navR=el('div',{style:{display:'flex',alignItems:'center',gap:'2px'}});
  function navBtn(txt,onclick){ const b=el('button',{style:{width:'36px',height:'36px',borderRadius:'50%',border:'none',background:'none',cursor:'pointer',color:'#595c5d',fontSize:'15px',display:'flex',alignItems:'center',justifyContent:'center'}}); b.textContent=txt; b.onclick=onclick; return b; }
  const undoBtn=navBtn('↩',()=>{ if(items.length){ if(selIdx===items.length-1)selIdx=-1; items.pop(); dirty=true; redraw(); } });
  undoBtn.title='Späť';
  const clearBtn=navBtn('🗑',()=>{ if(!items.length)return; if(!confirm('Vymazať všetko?'))return; items.length=0; selIdx=-1; dirty=true; redraw(); });
  // Save = styled pill button
  const saveBtn=el('button',{style:{padding:'8px 20px',borderRadius:'9999px',border:'none',background:'#0058bb',color:'#fff',fontWeight:'600',fontSize:'13px',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px',marginLeft:'4px'}});
  saveBtn.innerHTML='<span style="font-size:15px">💾</span> Uložiť';
  saveBtn.onclick=()=>{ if(autoSaveTimer){clearTimeout(autoSaveTimer);autoSaveTimer=null;} updateOrder(order.id,{workspace:[...items]}); dirty=false; saveBtn.style.background='#1a7f37'; setTimeout(()=>saveBtn.style.background='#0058bb',1200); };
  navR.append(undoBtn,clearBtn,saveBtn);
  nav.append(navL,navR);
  wrap.appendChild(nav);

  // ── INSERT MEDIA bar (hidden by default, toggled) ──
  let mediaBarVisible=false;
  const mediaBar=el('div',{style:{position:'absolute',top:'80px',left:'50%',transform:'translateX(-50%)',zIndex:'49',display:'none',alignItems:'center',gap:'8px',padding:'6px 12px',background:'rgba(255,255,255,0.94)',backdropFilter:'blur(16px)',borderRadius:'9999px',boxShadow:'0 2px 16px rgba(0,0,0,0.1)',border:'1px solid rgba(0,0,0,0.06)',whiteSpace:'nowrap'}});

  const pdfLbl=mkML('📄','PDF','#f9731633');
  const pdfInp=el('input',{type:'file',accept:'application/pdf,.pdf',style:{display:'none'}});
  pdfInp.onchange=e=>{ if(e.target.files[0]) insertPdfFile(e.target.files[0]); e.target.value=''; mediaBarVisible=false; mediaBar.style.display='none'; }; pdfLbl.appendChild(pdfInp);
  mediaBar.append(el('span',{style:{fontSize:'11px',fontWeight:'600',color:'#757778'}},'Vložiť:'),camLbl,galLbl,pdfLbl);
  wrap.appendChild(mediaBar);

  // ══════════ CANVAS ══════════
  const canvasWrap=el('div',{style:{position:'absolute',top:'0',left:'0',width:'100%',height:'100%',touchAction:'none'}});
  const canvas=el('canvas',{style:{display:'block',touchAction:'none'}});
  const ctx=canvas.getContext('2d');
  canvasWrap.appendChild(canvas);
  wrap.appendChild(canvasWrap);

  // ── Image context menu (shown when image is selected) ──
  const imgMenu=el('div',{style:{position:'absolute',zIndex:'46',display:'none',alignItems:'center',gap:'2px',padding:'4px',background:'rgba(28,28,28,0.95)',backdropFilter:'blur(12px)',borderRadius:'14px',boxShadow:'0 4px 20px rgba(0,0,0,0.45)',border:'1px solid rgba(255,255,255,0.08)'}});

    const pop=el('div',{style:{position:'fixed',zIndex:'1100',background:'#2e2e2e',borderRadius:'22px',padding:'10px 6px',boxShadow:'0 8px 36px rgba(0,0,0,0.6)',display:'flex',flexDirection:'column',alignItems:'center',gap:'4px',minWidth:'56px',opacity:'0',transform:'translateX(10px)',transition:'opacity 0.16s ease,transform 0.16s ease'}});
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ pop.style.opacity='1'; pop.style.transform='translateX(0)'; }));

    sizes.forEach(({s,r})=>{
      const isActive=s===curS||(curS>=s&&s===sizes.reduce((p,c)=>Math.abs(c.s-curS)<Math.abs(p.s-curS)?c:p,sizes[0]).s);
      const btn=el('button',{style:{width:'46px',height:'46px',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'12px',background:isActive?'rgba(255,255,255,0.14)':'none',transition:'background 0.15s',flexShrink:'0'}});
      const dot=el('div',{style:{width:(r*2)+'px',height:(r*2)+'px',borderRadius:'50%',background:dotColor,pointerEvents:'none',flexShrink:'0'}});
      btn.appendChild(dot);
      btn.onclick=e=>{
        e.stopPropagation();
        toolSizes[toolKey]=s;
        activeTool=toolKey;
        closeSizePopover();
        refreshToolbar();
      };
      pop.appendChild(btn);
    });

    const rect=anchorEl.getBoundingClientRect();
    // position vertically centered on the anchor, to the left of it
    const popH=sizes.length*50+20;
    pop.style.top=Math.max(10,Math.min(window.innerHeight-popH-10, rect.top+rect.height/2-popH/2))+'px';
    pop.style.right=(window.innerWidth-rect.left+8)+'px';
    document.body.appendChild(pop); sizePopover=pop;
    setTimeout(()=>{ const oc=e=>{ if(!pop.contains(e.target)&&e.target!==anchorEl){ closeSizePopover(); document.removeEventListener('pointerdown',oc); } }; document.addEventListener('pointerdown',oc); },50);
  }

  // ── Undo / redo row ──
  const undoRedoRow=el('div',{style:{display:'flex',gap:'4px',marginBottom:'10px'}});
  function sBtn(txt,onclick){ const b=el('button',{style:{width:'26px',height:'26px',borderRadius:'50%',border:'none',background:'rgba(255,255,255,0.1)',cursor:'pointer',color:'rgba(255,255,255,0.65)',fontSize:'13px',display:'flex',alignItems:'center',justifyContent:'center',padding:'0'}}); b.textContent=txt; b.onclick=onclick; return b; }
  undoRedoRow.append(
    sBtn('↩',()=>{ if(items.length){ if(selIdx===items.length-1)selIdx=-1; items.pop(); dirty=true; redraw(); } }),
    sBtn('↪',()=>{ /* redo TODO */ })
  );
  sidebar.appendChild(undoRedoRow);

  // ── Tool buttons with SVG pen drawings ──
  // Keys: finepen=thin fineliner, pencil=standard pencil, marker=chisel marker, brush=soft brush, eraser
  const TOOL_DEFS=[
    { key:'finepen', svg:'<svg width="30" height="58" viewBox="0 0 30 58" fill="none"><rect x="12" y="0" width="6" height="3" rx="1.5" fill="#666"/><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3a3a3a"/><stop offset="45%" stop-color="#5a5a5a"/><stop offset="100%" stop-color="#2a2a2a"/></linearGradient></defs><rect x="11" y="3" width="8" height="36" rx="2" fill="url(#g1)"/><rect x="12" y="39" width="6" height="3" rx="1" fill="#888"/><polygon points="11,42 19,42 15,58" fill="#1e1e1e"/></svg>' },
    { key:'pencil', svg:'<svg width="30" height="58" viewBox="0 0 30 58" fill="none"><rect x="10" y="0" width="10" height="5" rx="2" fill="#d4a017"/><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3d3d3d"/><stop offset="45%" stop-color="#5e5e5e"/><stop offset="100%" stop-color="#2d2d2d"/></linearGradient></defs><rect x="9" y="5" width="12" height="32" rx="2" fill="url(#g2)"/><rect x="10" y="37" width="10" height="5" rx="1" fill="#555"/><polygon points="10,42 20,42 15,55" fill="#1e1e1e"/><ellipse cx="15" cy="54.5" rx="2.5" ry="3.5" fill="#c8a876"/></svg>' },
    { key:'marker', svg:'<svg width="32" height="62" viewBox="0 0 32 62" fill="none"><rect x="6" y="0" width="20" height="13" rx="4" fill="#fbbf24"/><rect x="7" y="1" width="18" height="5" rx="2" fill="rgba(255,255,255,0.28)"/><rect x="4" y="13" width="24" height="34" rx="3" fill="#fde68a"/><rect x="5" y="14" width="6" height="32" fill="rgba(255,255,255,0.32)"/><rect x="22" y="14" width="5" height="32" fill="rgba(180,130,0,0.15)"/><rect x="6" y="47" width="20" height="5" rx="1" fill="#92400e"/><path d="M7 52 L25 52 L22 62 L10 62 Z" fill="#78350f"/></svg>' },
    { key:'brush', svg:'<svg width="30" height="56" viewBox="0 0 30 56" fill="none"><rect x="12" y="0" width="6" height="3" rx="1.5" fill="#888"/><defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2a2a2a"/><stop offset="45%" stop-color="#484848"/><stop offset="100%" stop-color="#1a1a1a"/></linearGradient></defs><rect x="11" y="3" width="8" height="38" rx="2" fill="url(#g4)"/><path d="M10 41 C8 44 7 48 9 52 C11 54 19 54 21 52 C23 48 22 44 20 41Z" fill="#2a2a2a"/></svg>' },
    { key:'eraser', svg:'<svg width="34" height="54" viewBox="0 0 34 54" fill="none"><rect x="3" y="0" width="28" height="15" rx="4" fill="#2563eb"/><rect x="4" y="1" width="26" height="5" rx="2" fill="rgba(255,255,255,0.18)"/><rect x="7" y="6" width="20" height="2" rx="1" fill="rgba(255,255,255,0.28)"/><rect x="7" y="10" width="13" height="2" rx="1" fill="rgba(255,255,255,0.18)"/><rect x="3" y="15" width="28" height="28" rx="1" fill="#fca5a5"/><rect x="4" y="16" width="8" height="26" fill="rgba(255,255,255,0.28)"/><rect x="24" y="16" width="6" height="26" fill="rgba(0,0,0,0.07)"/><rect x="3" y="41" width="28" height="11" rx="3" fill="#f87171"/><rect x="3" y="41" width="28" height="3" fill="rgba(0,0,0,0.09)"/></svg>' },
  ];
  const toolBtns={};
  TOOL_DEFS.forEach(({key,svg})=>{
    const btn=el('button',{style:{width:'56px',height:'52px',border:'none',background:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'14px',transition:'background 0.15s',padding:'0',flexShrink:'0',overflow:'visible'}});
    // Rotated wrapper — pen tips point LEFT (toward canvas), -14px protrudes from sidebar
    const svgWrap=el('div',{style:{transform:'translateX(-14px) rotate(-90deg)',transformOrigin:'center center',display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none',transition:'transform 0.18s'}});
    svgWrap.innerHTML=svg;
    btn.appendChild(svgWrap);
    btn._svgWrap=svgWrap;
    btn.onclick=e=>{ e.stopPropagation(); activeTool=key; closeSizePopover(); showSizePopover(btn,key); refreshToolbar(); };
    toolBtns[key]=btn;
    sidebar.appendChild(btn);
  });

  // Divider
  sidebar.appendChild(el('div',{style:{width:'32px',height:'1px',background:'rgba(255,255,255,0.12)',margin:'8px 0'}}));

  // Color palette
  const PALETTE=['#fbbf24','#1a1a1a','#ef4444','#3b82f6','#22c55e'];
  const colorDots=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'10px'}});
  PALETTE.forEach(c=>{
    const b=el('button',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid transparent',cursor:'pointer',padding:'0',background:c,outline:'none',transition:'transform 0.15s,border 0.15s'}});
    b._c=c; b.onclick=e=>{ e.stopPropagation(); curColor=c; if(activeTool==='eraser')activeTool='pencil'; refreshToolbar(); };
    colorDots.appendChild(b);
  });
  const rainbowBtn=el('button',{style:{width:'24px',height:'24px',borderRadius:'50%',border:'2px solid rgba(255,255,255,0.35)',cursor:'pointer',padding:'0',background:'conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)',outline:'none',overflow:'hidden',position:'relative',flexShrink:'0'}});
  const colorPickerInp=el('input',{type:'color',value:curColor,style:{position:'absolute',opacity:'0',width:'0',height:'0'}});
  colorPickerInp.oninput=e=>{ curColor=e.target.value; if(activeTool==='eraser')activeTool='pencil'; refreshToolbar(); };
  rainbowBtn.appendChild(colorPickerInp); rainbowBtn.onclick=()=>colorPickerInp.click();
  colorDots.appendChild(rainbowBtn);
  sidebar.appendChild(colorDots);

  // More / insert button
  const moreBtn=el('button',{style:{marginTop:'10px',color:'rgba(255,255,255,0.4)',background:'none',border:'none',cursor:'pointer',fontSize:'18px',lineHeight:'1',letterSpacing:'2px',padding:'0'}});
  moreBtn.textContent='···';
  moreBtn.title='Vložiť obrázok / PDF';
  moreBtn.onclick=e=>{ e.stopPropagation(); mediaBarVisible=!mediaBarVisible; mediaBar.style.display=mediaBarVisible?'flex':'none'; };
  sidebar.appendChild(moreBtn);

  wrap.appendChild(sidebar);

  // ══════════ BOTTOM LEFT: zoom ══════════
  const bl=el('div',{style:{position:'absolute',bottom:'28px',left:'20px',zIndex:'40',display:'flex',alignItems:'center',gap:'8px'}});
  const zoomLbl=el('div',{style:{padding:'6px 14px',background:'rgba(255,255,255,0.92)',backdropFilter:'blur(16px)',borderRadius:'16px',boxShadow:'0 1px 8px rgba(0,0,0,0.08)',border:'1px solid rgba(0,0,0,0.06)',fontSize:'13px',fontWeight:'600',color:'#2c2f30',cursor:'pointer',userSelect:'none'}});
  zoomLbl.textContent='100%';
  zoomLbl.title='Kliknúť = 100%';
  zoomLbl.onclick=()=>{ vp.scale=1; vp.tx=0; vp.ty=0; zoomLbl.textContent='100%'; schedRedraw(); };
  function mkZBtn(txt,fn){ const b=el('button',{style:{width:'30px',height:'30px',borderRadius:'50%',border:'none',background:'rgba(255,255,255,0.92)',backdropFilter:'blur(16px)',boxShadow:'0 1px 8px rgba(0,0,0,0.08)',cursor:'pointer',fontSize:'16px',color:'#2c2f30',display:'flex',alignItems:'center',justifyContent:'center'}}); b.textContent=txt; b.onclick=fn; return b; }
  bl.append(
    mkZBtn('−',()=>{ const c=canvas.clientWidth/2,cy2=canvas.clientHeight/2; const wx=(c-vp.tx)/vp.scale,wy=(cy2-vp.ty)/vp.scale; vp.scale=Math.max(MIN_SCALE,vp.scale/1.3); vp.tx=c-wx*vp.scale; vp.ty=cy2-wy*vp.scale; zoomLbl.textContent=Math.round(vp.scale*100)+'%'; schedRedraw(); }),
    zoomLbl,
    mkZBtn('+',()=>{ const c=canvas.clientWidth/2,cy2=canvas.clientHeight/2; const wx=(c-vp.tx)/vp.scale,wy=(cy2-vp.ty)/vp.scale; vp.scale=Math.min(MAX_SCALE,vp.scale*1.3); vp.tx=c-wx*vp.scale; vp.ty=cy2-wy*vp.scale; zoomLbl.textContent=Math.round(vp.scale*100)+'%'; schedRedraw(); })
  );
  wrap.appendChild(bl);

  // ══════════ BOTTOM NAV (mobile tool selector) ══════════
  const bnav=el('div',{style:{position:'absolute',bottom:'20px',left:'50%',transform:'translateX(-50%)',zIndex:'50',display:'flex',alignItems:'center',gap:'2px',padding:'6px',background:'rgba(255,255,255,0.92)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',borderRadius:'9999px',boxShadow:'0 4px 24px rgba(0,0,0,0.12)',border:'1px solid rgba(0,0,0,0.06)'}});
  const bnavTools=[{key:'move',emoji:'✥'},{key:'finepen',emoji:'✒'},{key:'pencil',emoji:'✏'},{key:'marker',emoji:'▬'},{key:'brush',emoji:'🖌'},{key:'eraser',emoji:'⌫'},{key:'add',emoji:'＋'}];
  const bnavBtns={};
  bnavTools.forEach(({key,emoji})=>{
    const b=el('button',{style:{width:'42px',height:'42px',borderRadius:'9999px',border:'none',cursor:'pointer',fontSize:'16px',display:'flex',alignItems:'center',justifyContent:'center',transition:'background 0.15s',background:'none',color:'#595c5d'}});
    b.textContent=emoji;
    if(key==='add'){ b.onclick=()=>{ mediaBarVisible=!mediaBarVisible; mediaBar.style.display=mediaBarVisible?'flex':'none'; }; }
    else{ b.onclick=()=>{ activeTool=key; closeSizePopover(); if(key!=='move') showSizePopover(b,key); refreshToolbar(); }; bnavBtns[key]=b; }
    bnav.appendChild(b);
  });
  wrap.appendChild(bnav);

  function refreshToolbar(){
    // Sidebar tool buttons
    Object.entries(toolBtns).forEach(([k,btn])=>{
      const active=activeTool===k;
      btn.style.background=active?'rgba(255,255,255,0.13)':'none';
      btn.style.opacity=active?'1':'0.55';
      // active tool protrudes more; inactive stays at -14px
      if(btn._svgWrap) btn._svgWrap.style.transform=active?'translateX(-22px) rotate(-90deg)':'translateX(-14px) rotate(-90deg)';
    });
    // Color dots
    colorDots.querySelectorAll('button').forEach(b=>{ if(b._c){ b.style.transform=b._c===curColor?'scale(1.25)':'scale(1)'; b.style.borderColor=b._c===curColor?'rgba(255,255,255,0.75)':'transparent'; } });
    // Bottom nav
    Object.entries(bnavBtns).forEach(([k,b])=>{ const a=activeTool===k; b.style.background=a?'rgba(0,88,187,0.1)':'none'; b.style.color=a?'#0058bb':'#595c5d'; });
    // Cursor
    canvasWrap.style.cursor=activeTool==='move'?'default':'none';
  }
  refreshToolbar();

  const ro=new ResizeObserver(resizeCanvas);
  ro.observe(canvasWrap);
  const mutObs=new MutationObserver(()=>{ if(!document.body.contains(wrap)){ document.body.style.overflow=''; ro.disconnect(); mutObs.disconnect(); } });
  mutObs.observe(document.body,{childList:true,subtree:true});

  return wrap;
}

// ═══════════════════════════════════
function renderApp(){
  const app=document.getElementById('app');
  app.innerHTML='';

  // Password disabled

  const {page,subPage} = appState;

  let content;
  if(subPage==='stats') content=renderStats();
  else if(subPage==='calendar') content=renderCalendar();
  else if(subPage==='yearly') content=renderYearly();
  else if(subPage==='customers') content=renderCustomers();
  else if(subPage==='archive') content=renderArchive();
  else if(subPage==='nakup') content=renderNakup();
  else if(subPage==='workspace') content=renderWorkspace((appState.data.orders||[]).find(o=>o.id===appState.selId)||{});
  else if(subPage==='nakupOrder') content=renderNakupOrder();
  else if(subPage==='nakupMerge') content=renderNakupMerge();
  else if(subPage==='sklad') content=renderSklad();
  else if(subPage==='backup') content=renderBackup();
  else if(page==='new'||page==='edit') content=renderForm(page==='edit');
  else if(page==='detail') content=renderDetail();
  else content=renderList();

  app.appendChild(content);
  app.appendChild(renderModals());

  // ── Bottom Nav (list page only) ──
  if(!subPage&&(page==='list'||page==='new'||page==='edit'||page==='detail')){
    const bnav=el('nav',{className:'bottom-nav'});
    function bnItem(icon,label,active,onclick){
      const btn=el('button',{className:'bottom-nav-item'+(active?' active':'')});
      btn.appendChild(msIcon(icon,active));
      btn.appendChild(el('span',{className:'nav-lbl'},label));
      btn.onclick=onclick;
      return btn;
    }
    const onList=page==='list'&&!subPage;
    const onNew=page==='new';
    const onSklad=subPage==='sklad';
    bnav.append(
      bnItem('home','Zákazky',onList,()=>setState({page:'list',subPage:null,selectedCard:null})),
      bnItem('add_circle','Nová',onNew,()=>setState({page:'new',subPage:null})),
      bnItem('inventory_2','Sklad',onSklad,()=>setState({subPage:'sklad',page:'list'})),
    );
    app.appendChild(bnav);
  }

  // Scroll to selected card when returning from workspace / detail
  if(appState.selectedCard){
    requestAnimationFrame(()=>{
      const el2=app.querySelector(`[data-orderid="${appState.selectedCard}"]`);
      if(el2) el2.scrollIntoView({behavior:'smooth',block:'center'});
    });
  }
}

// ── PWA: Register Service Worker ──
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        // Check for updates every time the app loads
        reg.update();
        // When a new SW is waiting, reload to activate it
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          nw.addEventListener('statechange', () => {
            if(nw.state === 'installed' && navigator.serviceWorker.controller){
              // New version available — silent reload after short delay
              setTimeout(() => window.location.reload(), 800);
            }
          });
        });
      })
      .catch(err => console.warn('SW registration failed:', err));
  });
}

// Start
renderApp();
</script>
