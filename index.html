/* === LUPANA — Material You Dark UI === */
*{margin:0;padding:0;box-sizing:border-box}

  --secondary:#b7c8e1;--secondary-container:#3a4a5f;
  --tertiary:#4edea3;--tertiary-dim:#00a572;

body{background:var(--bg);color:var(--on-surface);font-family:'Inter',system-ui,-apple-system,sans-serif;max-width:560px;margin:0 auto;min-height:100vh;font-size:15px;line-height:1.5;padding-bottom:88px}

input,select,textarea,button{font-family:inherit;outline:none}
input,select,textarea{background:var(--surface-low);border:1.5px solid var(--outline-var);border-radius:12px;color:var(--on-surface);padding:11px 14px;font-size:16px;width:100%;transition:border-color 0.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary-container)}
input::placeholder,textarea::placeholder{color:var(--outline)}
button{cursor:pointer}
::-webkit-scrollbar{width:0;background:transparent}

.card{background:var(--surface-low);border-radius:24px;padding:20px;border:1px solid rgba(66,70,85,0.35);margin-bottom:12px;transition:transform 0.2s cubic-bezier(0.4,0,0.2,1),box-shadow 0.2s cubic-bezier(0.4,0,0.2,1),border-color 0.2s;box-shadow:0 8px 24px rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.25)}
.card.zebra-odd{background:#0f1628}
.card.selected{border-color:var(--primary-container);background:#0d1a30;box-shadow:0 8px 28px rgba(85,141,255,0.2)}

.card:not(.drag-active):active{transform:scale(0.99);transition:transform 0.08s}
.card.drag-active{opacity:0.3;transform:scale(0.97)}
.card.drag-over{border-top:2.5px solid var(--primary-container)!important;margin-top:-1px}

/* MODALS */

.note-card{background:var(--surface-low);border-radius:16px;padding:13px 14px;margin-bottom:8px;border:1px solid rgba(66,70,85,0.3);display:flex;gap:10px;align-items:flex-start}
.checkbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--outline-var);background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all 0.15s}
.checkbox.checked{border-color:var(--tertiary);background:var(--tertiary)}
.dropdown{position:absolute;top:100%;left:0;margin-top:8px;background:var(--surface);border:1px solid rgba(66,70,85,0.4);border-radius:16px;overflow:hidden;z-index:50;min-width:210px;box-shadow:0 16px 40px rgba(0,0,0,0.6)}
.dropdown-item{width:100%;background:none;border:none;border-bottom:1px solid rgba(66,70,85,0.2);color:var(--on-surface-var);font-size:14px;padding:14px 18px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background 0.1s;font-weight:500}
.dropdown-item:last-child{border-bottom:none}
.dropdown-item:hover{background:var(--surface-high)}
.progress-bar{background:var(--surface-low);border-radius:8px;height:20px;overflow:hidden;border:1px solid rgba(66,70,85,0.3)}
.progress-fill{height:100%;border-radius:8px;transition:width 0.5s ease}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:50;display:flex;justify-content:space-around;align-items:center;padding:12px 16px 24px;background:rgba(11,19,38,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(66,70,85,0.2);box-shadow:0 -10px 40px rgba(0,0,0,0.4)}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--outline);padding:4px 16px;cursor:pointer;transition:color 0.2s}
.bottom-nav-item.active{color:var(--primary-container)}
.bottom-nav-item span.material-symbols-outlined{font-size:24px}
.bottom-nav-item .nav-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;font-family:'Inter',sans-serif}

// ═══════════════════════════════════

function loadData(){

function persist(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch{} }
function today(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ── Blum kalkulátor (pánty + Aventos) ─────────────────────────────
const HUSTOTA_DREVO = 12.48; // kg/m² (18mm drevo Blum štandard)
const PANTY_RULES = [
  {pocet:2, min:0,  max:6},
  {pocet:3, min:6,  max:12},
  {pocet:4, min:12, max:17},
  {pocet:5, min:17, max:22},
];
const AVENTOS_TYPES = [
  { id:'HK_S',   name:'HK S',   priority:1, vyska_min:186, sirka_max:553,
    cats:[{n:'Slabý',lo:220,hi:500},{n:'Stredný',lo:400,hi:1000},{n:'Silný',lo:960,hi:2215}] },
  { id:'HK_TOP', name:'HK TOP', priority:2, vyska_min:205, sirka_max:1800,
    cats:[{n:'Slabý',lo:420,hi:1610},{n:'Stredný',lo:930,hi:2800},{n:'Silný',lo:1730,hi:5200},{n:'Najsilnejší',lo:3200,hi:9000}] },
  { id:'HK_XS',  name:'HK XS',  priority:3, vyska_min:240, sirka_max:Infinity,
    cats:[{n:'Slabý',lo:180,hi:800},{n:'Stredný',lo:500,hi:1200},{n:'Silný',lo:800,hi:1600}] },
];
function blumPanty(vyska, sirka){
  if(!vyska||!sirka) return null;
  const hm = (vyska * sirka / 1e6) * HUSTOTA_DREVO;
  const rule = PANTY_RULES.find(r => hm >= r.min && hm <= r.max);
  return rule ? {pocet: rule.pocet, hm: Math.round(hm*100)/100} : null;
}
// Presná kópia evaluate logiky z Aventos referenčnej app (sranda11.github.io/Aventos)
function _aventosEval(type, vyska, sirka, hmotnost){
  const fitsWidth = !isFinite(type.sirka_max) || sirka <= type.sirka_max;
  const meetsMin = vyska >= type.vyska_min;
  if(!meetsMin || !fitsWidth) return {fits:false, type};
  const sila = hmotnost * vyska;
  const cat = type.cats.find(c => sila >= c.lo && sila <= c.hi);
  if(!cat) return {fits:false, type};
  return {fits:true, type, sila, cat};
}
function blumAventos(vyska, sirka){
  if(!vyska||!sirka) return null;
  const hmotnost = (vyska * sirka / 1e6) * HUSTOTA_DREVO;
  const results = AVENTOS_TYPES.map(t => _aventosEval(t, vyska, sirka, hmotnost));
  // Rovnaká selekcia ako referenčná app: najnižšia priorita spomedzi vyhovujúcich, HK XS (priority 3) nikdy
  const best = results
    .filter(r => r.fits && r.type.priority <= 2)
    .sort((a,b) => a.type.priority - b.type.priority)[0] || null;
  if(!best) return null;
  return {type: best.type.name, cat: best.cat.n, sila: Math.round(best.sila), hm: Math.round(hmotnost*100)/100};
}
// ──────────────────────────────────────────────────────────────────

// ── Attachment helpers (Firestore-based, no Storage needed) ────────
function compressImage(file, maxDim, quality){
  return new Promise(resolve=>{
    const img=new Image();
    const blobUrl=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
        else{w=Math.round(w*maxDim/h);h=maxDim;}
      }
      const c=document.createElement('canvas');
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(blobUrl);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>{URL.revokeObjectURL(blobUrl);resolve(null);};
    img.src=blobUrl;
  });
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=e=>resolve(e.target.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
const ATT_CHUNK_SIZE=700000; // 700K znakov base64 na chunk (bezpečne pod 1MB Firestore limit)

async function saveAttData(attId,orderId,dataUrl){
  if(dataUrl.length<=ATT_CHUNK_SIZE){
    // Malý súbor — jeden dokument
    await db.collection('lupana_att').doc(attId).set({orderId,data:dataUrl,uploadedAt:Date.now()});
  } else {
    // Veľký súbor — rozdeliť na chunky
    const chunks=[];
    for(let i=0;i<dataUrl.length;i+=ATT_CHUNK_SIZE) chunks.push(dataUrl.slice(i,i+ATT_CHUNK_SIZE));
    for(let i=0;i<chunks.length;i++){
      await db.collection('lupana_att').doc(`${attId}_c${i}`).set({data:chunks[i]});
    }
    await db.collection('lupana_att').doc(attId).set({orderId,chunks:chunks.length,uploadedAt:Date.now()});
  }
}

async function loadAttData(attId){
  try{
    const doc=await db.collection('lupana_att').doc(attId).get();
    if(!doc.exists) return null;
    const d=doc.data();
    if(!d.chunks) return d.data; // jednoduchý dokument
    // Poskladaj chunky
    let result='';
    for(let i=0;i<d.chunks;i++){
      const c=await db.collection('lupana_att').doc(`${attId}_c${i}`).get();
      if(!c.exists) return null;
      result+=c.data().data;
    }
    return result;
  }catch(e){ console.error('loadAttData error:',e); }
  return null;
}
async function openAttachment(att){
  // Zobraz prílohu v internom overlay (obchádza popup blocker mobilných prehliadačov)
  const isImg=/^image\//i.test(att.type||'');
  const isPdf=/pdf/i.test(att.type||att.name||'');

  // Vytvor overlay okamžite (synchrónne) s loading indikátorom
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.97);z-index:9999;display:flex;flex-direction:column;';
  const topBar=document.createElement('div');
  topBar.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:12px 16px;flex-shrink:0;border-bottom:1px solid #1E2B3C;';
  const nameEl=document.createElement('span');
  nameEl.textContent=att.name||'Príloha';
  nameEl.style.cssText='color:#E8EDF5;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:12px;';
  const closeBtn=document.createElement('button');
  closeBtn.textContent='✕';
  closeBtn.style.cssText='background:none;border:none;color:#9CA3AF;font-size:22px;cursor:pointer;padding:4px 8px;flex-shrink:0;';
  closeBtn.onclick=()=>{ if(overlay.parentNode) document.body.removeChild(overlay); };
  topBar.append(nameEl,closeBtn);
  overlay.appendChild(topBar);
  const content=document.createElement('div');
  content.style.cssText='flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px;';
  content.innerHTML='<div style="color:#4A6585;font-size:14px;">Načítavam...</div>';
  overlay.appendChild(content);
  document.body.appendChild(overlay);

  // Načítaj dáta
  let dataUrl=att.url||null;
  if(!dataUrl) dataUrl=await loadAttData(att.id);
  if(!dataUrl){
    content.innerHTML='<div style="color:#EF4444;font-size:14px;">Príloha sa nenašla.</div>';
    return;
  }
  content.innerHTML='';

  if(isImg){
    const img=document.createElement('img');
    img.src=dataUrl;
    img.style.cssText='max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;';
    content.appendChild(img);
  } else if(isPdf){
    // PDF.js — renderuje všetky strany ako canvas (funguje aj na mobile)
    content.style.cssText='flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px;';
    content.innerHTML='<div style="color:#4A6585;font-size:14px;">Renderujem PDF…</div>';
    try {
      if(!window.pdfjsLib){
        await new Promise((res,rej)=>{
          const s=document.createElement('script');
          s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload=res; s.onerror=rej;
          document.head.appendChild(s);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const base64=dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
      const bin=atob(base64);
      const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      const pdf=await window.pdfjsLib.getDocument({data:arr}).promise;
      content.innerHTML='';
      const scale=window.devicePixelRatio>1 ? 2 : 1.5;
      for(let p=1;p<=pdf.numPages;p++){
        const page=await pdf.getPage(p);
        const vp=page.getViewport({scale});
        const canvas=document.createElement('canvas');
        canvas.width=vp.width;
        canvas.height=vp.height;
        canvas.style.cssText='max-width:100%;height:auto;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.6);';
        content.appendChild(canvas);
        await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
        if(p<pdf.numPages){
          const sep=document.createElement('div');
          sep.style.cssText='width:100%;height:1px;background:#1E2B3C;flex-shrink:0;';
          content.appendChild(sep);
        }
      }
    } catch(err){
      content.innerHTML=`<div style="color:#EF4444;font-size:14px;">Chyba: ${err.message}</div>`;
    }
  } else {
    // Iný typ — ponúkni stiahnutie
    const a=document.createElement('a');
    a.href=dataUrl;
    a.download=att.name||'priloha';
    a.style.cssText='color:#34D399;font-size:16px;text-decoration:none;padding:14px 24px;background:#0D2B1F;border:1px solid #10B981;border-radius:10px;';
    a.textContent='⬇ Stiahnuť '+  (att.name||'prílohu');
    content.appendChild(a);
  }
}

// Listen to Firebase — orders
db.collection('lupana').doc('data').onSnapshot(snap=>{
  if(snap.exists){
    const remote = snap.data().payload;
    if(remote){
      const parsed = JSON.parse(remote);
      appState.data = parsed;
      persist(parsed);
      renderApp();
    }
  }
});

// Listen to Firebase — cenník
db.collection('lupana').doc('cennik').onSnapshot(snap=>{
  if(snap.exists && snap.data().payload){
    try{ appState.cennik = JSON.parse(snap.data().payload); }catch{}
    renderApp();
  }
});

function setState(patch){
  // Vždy ulož scroll ak sme na zozname (pred akoukoľvek zmenou)
  const onList=!appState.subPage&&appState.page==='list';
  if(onList) appState.listScrollY=window.scrollY;
  // Reset animácie kariet pri návrate na zoznam z inej stránky
  if(patch.page==='list'&&appState.page!=='list') _listAnimDone=false;
  Object.assign(appState, patch);
  renderApp();
  // Obnov scroll ak sme stále (alebo sme sa vrátili) na zozname
  const nowOnList=!appState.subPage&&appState.page==='list';
  if(nowOnList&&appState.listScrollY!=null){
    requestAnimationFrame(()=>window.scrollTo(0,appState.listScrollY));
  }
}

let cennikTimer=null;
function saveCennik(){
  if(cennikTimer) clearTimeout(cennikTimer);
  cennikTimer=setTimeout(()=>{
    db.collection('lupana').doc('cennik').set({payload:JSON.stringify(appState.cennik)});
  },800);
}
function setCennikPrice(mat,price){
  if(price===''||price===null){ delete appState.cennik[mat]; }
  else { appState.cennik[mat]=parseFloat(price)||0; }
  saveCennik();
  renderApp();
}

function setData(fn){
  const newData = fn(appState.data);
  appState.data = newData;
  persist(newData);
  saveToFirebase(newData);
  renderApp();
}

  {id:'klzak',     nazov:'Klzák',                 cena:1.00,  unit:'ks', icon:'🔲'},
  {id:'merivoboxE',nazov:'Merivobox E',           cena:60.00, unit:'ks', icon:'📦'},
  {id:'merivoboxM',nazov:'Merivobox M',           cena:50.00, unit:'ks', icon:'📦'},
];

function findDekorCena(matText){
  if(!matText) return null;
  const upper=matText.toUpperCase();
  // 1. Exact substring match (e.g. "W960 SM" in "W960 SM 18mm")
  for(const d of DEKORY){
    if(upper.includes(d.kod.toUpperCase())) return {cena:d.cena,nazov:d.nazov,kod:d.kod};
  }
  // 2. Match without "/..." suffix (e.g. "W1100 PM" matches "W1100 PM/ST9")
  for(const d of DEKORY){
    const baseKod=d.kod.replace(/\/.*$/,'').trim().toUpperCase();
    if(baseKod.length>=4 && upper.includes(baseKod)) return {cena:d.cena,nazov:d.nazov,kod:d.kod};
  }
  // 3. Base color-code fallback (e.g. "W960 16mm" → first W960 entry = W960 SM)
  for(const d of DEKORY){
    const colorCode=d.kod.split(' ')[0].toUpperCase();
    if(colorCode.length>=3 && upper.includes(colorCode)) return {cena:d.cena,nazov:d.nazov,kod:d.kod};
  }
  return null;
}

function fmt(n){
  if(n===null||n===undefined||n==='') return '—';
  return new Intl.NumberFormat('sk-SK',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.round(n));
}

  if(!ts) return '—';
  return new Date(ts).toLocaleDateString('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtMins(mins){
  const h=Math.floor(mins/60), m=mins%60;

}

function confirmMontazPicker(){
  const p=appState.montazPicker;
  if(!p) return;
  const o=p.order;
  // Zostav dátum
  const dates=montazPickerDates();
  const dateObj=dates[p.selDateIdx]||dates[0];
  const MINUTES=[0,15,30,45];
  const minute=MINUTES[p.selMinuteIdx]||0;
  const pad=n=>String(n).padStart(2,'0');
  const dayNames=['ned','pon','uto','str','štv','pia','sob'];
  const months=['jan','feb','mar','apr','máj','jún','júl','aug','sep','okt','nov','dec'];
  const dayStr=`${dayNames[dateObj.getDay()]} ${dateObj.getDate()}. ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
  const timeStr=`${pad(p.selHour)}:${pad(minute)}`;
  // Automaticky vytvor udalosť v Google Kalendári cez Apps Script
  const y=dateObj.getFullYear(), mo=pad(dateObj.getMonth()+1), dd=pad(dateObj.getDate());
  const startISO=`${y}-${mo}-${dd}T${pad(p.selHour)}:${pad(minute)}:00`;
  const endH=Math.min(p.selHour+4,23);
  const endISO=`${y}-${mo}-${dd}T${pad(endH)}:${pad(minute)}:00`;
  const nazovTitle=[o.customerName,o.title].filter(Boolean).join(' – ');
  const gcalPayload={
    title:`Montáž: ${nazovTitle||'Zákazka'}`,
    start:startISO,
    end:endISO,
    description:`Tel: ${o.customerPhone||''}`,
    location:o.customerAddress||''
  };
  fetch('https://script.google.com/macros/s/AKfycbyibkM67jYugbImqbfp2lj5iJ_eH4oyluYXN2WZbt3fXyns2qmcdUUI-rTAOPedzFQg/exec',{
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(gcalPayload)
  }).catch(err=>console.warn('GCal error:',err));
  setState({montazPicker:null});
  updateOrder(o.id,{deadlineDate:`${y}-${mo}-${dd}`});
  setStatus(o.id,'montaz_potvrdena');
  sendSmsNotification(o,'montaz_potvrdena',`${dayStr} o ${timeStr}`);
}

function montazPickerDates(){
  const arr=[];
  const d=new Date();
  d.setHours(0,0,0,0);
  for(let i=0;i<366;i++){
    arr.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return arr;
}

function sendSmsNotification(o, newStatus, montazTermin=null){
  const phone = o.customerPhone;
  if(!phone) return;
  const nazov = o.title || 'zákazka';
  const messages = {
    vo_vyrobe:`Dobrý deň, vaša zákazka "${nazov}" bola zaradená do výroby.`,
    sklada_sa:`Dobrý deň, vaša zákazka "${nazov}" sa práve skladá.`,
    pripravena:`Dobrý deň, vaša zákazka "${nazov}" je pripravená na montáž.`,
    montaz_potvrdena: (()=>{
      const price=parseFloat(o.price)||0;
      const deposit=parseFloat(o.depositPaid)||0;
      const due=Math.max(price-deposit,0);
      const doplatok=Number.isInteger(due)?`${due}€`:`${due.toFixed(2)}€`;
      const base=montazTermin
        ? `Dobrý deň, termín montáže zákazky "${nazov}" bol potvrdený na ${montazTermin}.`
        : `Dobrý deň, termín montáže zákazky "${nazov}" bol potvrdený.`;
      return price>0 ? `${base} Prosíme Vás o prípravu doplatku vo výške ${doplatok}.` : base;
    })(),
    hotova:`Dobrý deň, vaša zákazka "${nazov}" je hotová a pripravená na odovzdanie!`,
  };
  const text = messages[newStatus];
  if(!text) return;
  const cleanPhone = phone.replace(/ /g,'');
  setState({smsModal:{phone, cleanPhone, text, newStatus}});
}

function el(tag, attrs, ...children){
  const e=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else if(k.startsWith('on')) e[k.toLowerCase()]=v;
    else if(k==='className') e.className=v;
    else if(k==='htmlFor') e.htmlFor=v;
    else e.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c===null||c===undefined||c===false) return;
    if(typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(c));
    else if(c instanceof Node) e.appendChild(c);
  });
  return e;
}

function div(cls, ...children){ return el('div',{className:cls},...children); }
function span(cls,...children){ return el('span',{className:cls},...children); }
function btn(cls,text,onClick){ const b=el('button',{className:'btn '+cls},text); b.onclick=onClick; return b; }

        wrow.appendChild(wb);
      });
      tlb.appendChild(wrow);

      const tbr=el('div',{style:{display:'flex',gap:'8px'}});
      const tadd2=el('button',{style:{flex:'1',background:'#2563EB',border:'none',borderRadius:'8px',color:'#fff',fontWeight:'700',padding:'10px',cursor:'pointer'}},'✓ Pridať záznam');
      tadd2.onclick=logTime;
      const tcan=el('button',{style:{background:'none',border:'1px solid #1F2937',borderRadius:'8px',color:'#6B7280',padding:'10px 14px',cursor:'pointer'}},'Zrušiť');
      tcan.onclick=()=>setState({showTimeLog:false});
      tbr.append(tadd2,tcan);
      tlb.appendChild(tbr);
      scroll.appendChild(tlb);
    }

    const tlog=sel.timeLog||[];
    if(!tlog.length) scroll.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'40px'}},'Zatiaľ žiadne záznamy'));
    const CAT={nakres:{label:'Nákres',color:'#8B5CF6'},skladanie:{label:'Skladanie',color:'#F59E0B'},montaz:{label:'Montáž',color:'#10B981'},ine:{label:'Iné',color:'#6B7280'}};
    const tlistWrap=el('div',{style:{padding:'0 16px'}});
    tlog.forEach(e=>{
      const cat=CAT[e.category]||CAT.ine;
      const te=el('div',{className:'time-entry'});
      const td2=el('div',{style:{flex:'1'}});
      const tr2=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}});
      tr2.appendChild(el('span',{style:{fontSize:'11px',fontWeight:'700',padding:'2px 8px',borderRadius:'20px',background:cat.color+'22',color:cat.color,border:`1px solid ${cat.color}44`}},cat.label));
      tr2.appendChild(el('span',{style:{color:'#F9FAFB',fontWeight:'700'}},fmtMins(e.mins)));
      if(e.worker&&e.worker!=='ja') tr2.appendChild(el('span',{style:{fontSize:'11px',background:'#1E3A5F',color:'#60A5FA',borderRadius:'10px',padding:'1px 7px'}},e.worker));
      td2.appendChild(tr2);
      if(e.note) td2.appendChild(el('div',{style:{color:'#6B7280',fontSize:'13px'}},e.note));
      td2.appendChild(el('div',{style:{color:'#374151',fontSize:'12px',marginTop:'2px'}},fmtDate(e.at)));
      const db=el('button',{className:'del-btn'},'✕');
      db.onclick=()=>updateOrder(sel.id,{timeLog:(sel.timeLog||[]).filter(x=>x.id!==e.id)});
      te.append(td2,db);
      tlistWrap.appendChild(te);
    });
    scroll.appendChild(tlistWrap);
  }

  if(appState.tab==='porez'){
    const porezText=sel.porezText||'';
    const pwrap=el('div',{style:{padding:'12px 16px',paddingBottom:'40px'}});

    // Import button
    const fileLbl=el('label',{style:{width:'100%',background:'#0D2B1F',border:'1px solid #10B981',borderRadius:'10px',color:'#34D399',fontWeight:'700',fontSize:'14px',padding:'12px 0',textAlign:'center',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',marginBottom:'12px',boxSizing:'border-box'}});
    fileLbl.append(el('span',{},'📄'),el('span',{},'Importovať súbor (.txt)'));
    const fileInp=el('input',{type:'file',accept:'.txt,.csv,text/*',style:{display:'none'}});
    fileInp.onchange=e=>{
      const file=e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=ev=>updateOrder(sel.id,{porezText:ev.target.result||''});
      reader.readAsText(file,'UTF-8');
    };
    fileLbl.appendChild(fileInp);
    pwrap.appendChild(fileLbl);

    // Parser helpers
    function isEdge1(v){ return v==='-'||v==='\u2013'||v==='\u2014'; }
    function isEdge2(v){ return v==='='; }
    function edgeCount(v){ return isEdge2(v)?2:isEdge1(v)?1:0; }

    function parseLine(line){
      const hasTab=line.includes('\t');
      if(hasTab){
        const p=line.split('\t').map(s=>s.trim());
        if(p.length<2) return null;
        const sirkaVal=p[1]||'';
        const sirkaEdgeRaw=p[2]||'';
        let sirkaEdges=edgeCount(sirkaEdgeRaw)||(sirkaVal.match(/,/g)||[]).length;
        const sirkaNum=sirkaVal.replace(/[,\-=\u2013\u2014]+$/,'').trim();
        const dlzkaVal=p[3]||'';
        const dlzkaEdgeRaw=p[4]||'';
        let dlzkaEdges=edgeCount(dlzkaEdgeRaw)||(dlzkaVal.match(/,/g)||[]).length;
        const dlzkaNum=dlzkaVal.replace(/[,\-=\u2013\u2014]+$/,'').trim();
        const hrubka=(p[5]||'').replace(/,/g,'').trim();
        const pocet=(p[6]||'').replace(/,/g,'').trim();
        const material=p.length>=8?p.slice(7).filter(x=>x).join(' '):'';
        return{nazov:p[0]||'',sirka:{num:sirkaNum,edges:sirkaEdges},dlzka:{num:dlzkaNum,edges:dlzkaEdges},hrubka,pocet,material};
      } else {
        const rawParts=line.split(',');
        const tokens=[];
        for(let i=0;i<rawParts.length;i++){
          const val=rawParts[i].trim();
          if(isEdge1(val)){if(tokens.length>0)tokens[tokens.length-1].edges=Math.max(tokens[tokens.length-1].edges,1);}
          else if(isEdge2(val)){if(tokens.length>0)tokens[tokens.length-1].edges=2;}
          else if(val===''){if(tokens.length>0)tokens[tokens.length-1].edges=Math.min(tokens[tokens.length-1].edges+1,2);}
          else{
            const trailingCommas=(val.match(/,+$/)||[''])[0].length;
            const cleanNum=val.replace(/[,\-=\u2013\u2014]+$/,'').trim();
            if(cleanNum!=='') tokens.push({num:cleanNum,edges:trailingCommas});
          }
        }
        if(tokens.length<2) return null;
        return{nazov:tokens[0]?.num||'',sirka:{num:tokens[1]?.num||'',edges:tokens[1]?.edges||0},dlzka:{num:tokens[2]?.num||'',edges:tokens[2]?.edges||0},hrubka:tokens[3]?.num||'',pocet:tokens[4]?.num||'',material:tokens.length>=6?tokens.slice(5).map(t=>t.num).join(' '):''};
      }
    }

    // ── Pomocná funkcia: detekcia ID skrinky z názvu ──────────
    function extractCabinetId(nazov){
      // Vzory: "G1.bok", "G1 bok", "WC2.predna", "D3", "1.bok", "SK1.bok"
      const m=(nazov||'').match(/^([A-ZÁČĎÉÍĽŇÓŔŠŤÚÝŽ]{1,2}\d+|\d+)(?:[.\s]|$)/i);
      return m?m[1].toUpperCase():null;
    }

    // ── Pomocná funkcia: vykresli tabuľku riadkov ─────────────
    function renderPorezTable(rows){
      const hdrs=['Názov','Dĺžka','Šírka','Hrúb.','Počet','Materiál'];
      const colW=['2fr','1fr','1fr','0.7fr','0.7fr','1.5fr'];
      const tblWrap=el('div',{style:{overflowX:'auto',marginBottom:'12px'}});
      const tbl=el('div',{style:{minWidth:'480px'}});
      const hdrRow=el('div',{style:{display:'grid',gridTemplateColumns:colW.join(' '),padding:'6px 8px',borderBottom:'1px solid #1E3A5F',marginBottom:'4px'}});
      hdrs.forEach(h=>hdrRow.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'10px',textTransform:'uppercase',letterSpacing:'1px',fontWeight:'700'}},h)));
      tbl.appendChild(hdrRow);

      const specialKeywords=/36mm|duplak/i;
      rows.forEach((r,idx)=>{
        const isSpecial=specialKeywords.test(r.nazov)||specialKeywords.test(r.material);
        const row=el('div',{style:{display:'grid',gridTemplateColumns:colW.join(' '),padding:'5px 8px',borderRadius:'6px',background:isSpecial?(idx%2===0?'#1F0A0A':'#1A0808'):(idx%2===0?'#111827':'#0D1117'),alignItems:'center'}});
        if(isSpecial) row.style.border='1px solid #3D0A0A';

        row.appendChild(el('span',{style:{color:isSpecial?'#EF4444':'#E8EDF5',fontSize:'13px',fontWeight:isSpecial?'700':'400'}},r.nazov||'—'));

        function dimCell(num,lo,hi,loColor,hiColor){
          const n=parseFloat(num)||0;
          const isLo=n>0&&n<lo, isHi=n>0&&n>hi;
          const bg=isLo?'#0D2B1F':isHi?'#2D1A00':'transparent';
          const col=isLo?loColor:isHi?hiColor:'#7A9AB8';
          const cell=el('div',{style:{textAlign:'center',borderRadius:'4px',padding:(isLo||isHi)?'2px 4px':'0',background:bg}});
          cell.appendChild(el('span',{style:{color:col,fontSize:'13px',fontWeight:(isLo||isHi)?'700':'400'}},num||'—'));
          return cell;
        }

        const sirkaCell=dimCell(r.sirka.num,80,2780,'#34D399','#F97316');
        if(r.sirka.edges>0) sirkaCell.appendChild(el('span',{style:{fontSize:'11px',fontWeight:'700',background:r.sirka.edges===2?'#1E3A5F':'#1A2A1A',color:r.sirka.edges===2?'#60A5FA':'#34D399',borderRadius:'4px',padding:'1px 5px',marginLeft:'4px'}},r.sirka.edges===2?'\\\\':'\\'));
        row.appendChild(sirkaCell);

        const dlzkaCell=dimCell(r.dlzka.num,80,2050,'#34D399','#F97316');
        if(r.dlzka.edges>0) dlzkaCell.appendChild(el('span',{style:{fontSize:'11px',fontWeight:'700',background:r.dlzka.edges===2?'#1E3A5F':'#1A2A1A',color:r.dlzka.edges===2?'#60A5FA':'#34D399',borderRadius:'4px',padding:'1px 5px',marginLeft:'4px'}},r.dlzka.edges===2?'\\\\':'\\'));
        row.appendChild(dlzkaCell);

        row.appendChild(el('div',{style:{textAlign:'center',color:'#7A9AB8',fontSize:'13px'}},r.hrubka||'—'));
        const pocetCell=el('div',{style:{textAlign:'center'}});
        if(r.pocet){ pocetCell.appendChild(el('span',{style:{color:'#E8EDF5',fontWeight:'700',fontSize:'13px'}},r.pocet)); pocetCell.appendChild(el('span',{style:{color:'#3A4D65',fontSize:'10px',marginLeft:'2px'}},'ks')); }
        else pocetCell.appendChild(document.createTextNode('—'));
        row.appendChild(pocetCell);
        row.appendChild(el('div',{style:{color:'#4A6585',fontSize:'12px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.material||''));
        tbl.appendChild(row);

        // ── Pánty / Aventos hint ─────────────────────────────
        const nazovLow=(r.nazov||'').toLowerCase();
        const isDvere=/dvere|dvierka/i.test(r.nazov);
        const isAV=/dvere\s*av|dvierka\s*av/i.test(r.nazov);
        if(isDvere){
          const dim1=parseFloat(r.dlzka&&r.dlzka.num)||0;
          const dim2=parseFloat(r.sirka&&r.sirka.num)||0;
          // Pre Aventos: väčší rozmer = šírka, menší = výška (výklopné dvierka sú širšie ako vysoké)
          const vyska=Math.min(dim1,dim2);
          const sirka=Math.max(dim1,dim2);
          const pocetKs=parseInt(r.pocet)||1;
          const pantInfo=isAV?null:blumPanty(vyska,sirka);
          const avInfo=isAV?blumAventos(vyska,sirka):null;

          // Váha dvierok (pre pánty aj Aventos)
          const hmDvere = (vyska && sirka) ? Math.round((vyska*sirka/1e6)*HUSTOTA_DREVO*100)/100 : null;
          if(pantInfo||avInfo){
            const hint=el('div',{style:{
              gridColumn:'1 / -1', display:'flex', flexWrap:'wrap', gap:'8px',
              padding:'4px 8px 7px 8px', marginBottom:'2px',
              background: isAV ? '#0D1E10' : '#0D1421',
              borderLeft: isAV ? '3px solid #22C55E' : '3px solid #3B82F6',
              borderRadius:'0 0 6px 6px', fontSize:'12px'
            }});
            // Váha
            if(hmDvere!=null){
              const vBadge=el('span',{style:{display:'inline-flex',alignItems:'center',gap:'4px',background:'#1C1400',borderRadius:'6px',padding:'2px 8px',color:'#D97706',fontWeight:'600'}});
              vBadge.append(el('span',{},'⚖'),el('span',{},`${hmDvere} kg/ks`));
              if(pocetKs>1) vBadge.appendChild(el('span',{style:{color:'#F59E0B'}},` · ${Math.round(hmDvere*pocetKs*100)/100} kg celkom`));
              hint.appendChild(vBadge);
            }
            // Pánty
            if(pantInfo){
              const totalPanty = pantInfo.pocet * pocetKs;
              const pBadge=el('span',{style:{display:'inline-flex',alignItems:'center',gap:'4px',background:'#1E3A5F',borderRadius:'6px',padding:'2px 8px',color:'#93C5FD',fontWeight:'600'}});
              pBadge.append(el('span',{},'🔩'),el('span',{},`Pánty: ${pantInfo.pocet} ks/kus`));
              if(pocetKs>1) pBadge.appendChild(el('span',{style:{color:'#60A5FA',fontWeight:'700'}},` = ${totalPanty} ks celkom`));
              hint.appendChild(pBadge);
            }
            // Aventos
            if(avInfo){
              const aBadge=el('span',{style:{display:'inline-flex',alignItems:'center',gap:'4px',background:'#14290F',border:'1px solid #16A34A',borderRadius:'6px',padding:'2px 8px',color:'#86EFAC',fontWeight:'600'}});
              aBadge.append(el('span',{},'↑'),el('span',{},`Aventos ${avInfo.type} – ${avInfo.cat}`),el('span',{style:{color:'#4ADE80',fontSize:'11px'}},` (LF ${avInfo.sila})`));
              hint.appendChild(aBadge);
            } else if(isAV){
              const aBadge=el('span',{style:{display:'inline-flex',alignItems:'center',gap:'4px',background:'#1A0808',border:'1px solid #7F1D1D',borderRadius:'6px',padding:'2px 8px',color:'#EF4444',fontWeight:'600'}});
              aBadge.append(el('span',{},'↑'),el('span',{},'Aventos: mimo rozsahu'));
              hint.appendChild(aBadge);
            }
            // Wrap hint in a full-width grid row
            const hintWrap=el('div',{style:{display:'grid',gridTemplateColumns:'1fr',marginBottom:'4px'}});
            hintWrap.appendChild(hint);
            tbl.appendChild(hintWrap);
          }
        }
      });
      tblWrap.appendChild(tbl);
      return tblWrap;
    }

    if(porezText){
      // Delete table button
      const clearTblBtn=el('button',{style:{width:'100%',background:'none',border:'1px solid #3D0A0A',borderRadius:'8px',color:'#EF4444',fontSize:'13px',padding:'8px',marginBottom:'10px',cursor:'pointer'}},'🗑 Zmazať tabuľku');
      clearTblBtn.onclick=()=>{ if(confirm('Zmazať celý zoznam na pílenie?')) { updateOrder(sel.id,{porezText:''}); setState({porezSkrinka:null}); } };
      pwrap.appendChild(clearTblBtn);

      // Parse all lines
      const rows=porezText.split('\n').map(l=>l.trimEnd()).filter(l=>l.trim()).map(parseLine).filter(Boolean);

      // ── DETAIL VIEW: konkrétna skrinka ─────────────────────
      if(appState.porezSkrinka){
        const sid=appState.porezSkrinka;
        const skrinkaRows=sid==='__misc__'
          ? rows.filter(r=>!extractCabinetId(r.nazov))
          : rows.filter(r=>extractCabinetId(r.nazov)===sid);

        // Back button
        const backBtn=el('button',{style:{background:'none',border:'1px solid #1E2B3C',borderRadius:'8px',color:'#7A9AB8',fontSize:'13px',padding:'7px 14px',marginBottom:'12px',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px'}});
        backBtn.append(el('span',{},'←'),el('span',{},`Späť na skrinky`));
        backBtn.onclick=()=>setState({porezSkrinka:null});
        pwrap.appendChild(backBtn);

        // Title
        const isMiscView=sid==='__misc__';
        const titleRow=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
        titleRow.appendChild(el('div',{style:{background:isMiscView?'#1A1A2E':'#1E3A5F',borderRadius:'8px',padding:'6px 14px',color:isMiscView?'#9CA3AF':'#60A5FA',fontWeight:'700',fontSize:'18px'}},isMiscView?'Ostatné':sid));
        const totKs=skrinkaRows.reduce((s,r)=>s+(parseInt(r.pocet)||0),0);
        titleRow.appendChild(el('div',{style:{color:'#4A6585',fontSize:'13px'}},`${skrinkaRows.length} dielov · ${totKs} ks`));
        pwrap.appendChild(titleRow);

        pwrap.appendChild(renderPorezTable(skrinkaRows));

        const sumRowD=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}});
        sumRowD.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'12px'}},`${skrinkaRows.length} položiek`));
        if(totKs>0) sumRowD.appendChild(el('div',{style:{color:'#60A5FA',fontWeight:'700',fontSize:'13px'}},`Spolu ${totKs} ks`));
        pwrap.appendChild(sumRowD);

        // ── Prílohy patriace tejto skrinke ───────────────────
        if(!isMiscView){
          const allAtts=sel.attachments||[];
          // Zhoda: názov súboru obsahuje ID skrinky (napr. "G1" v "G1 nacrt.jpg")
          const sidLower=sid.toLowerCase();
          const matchedAtts=allAtts.filter(a=>{
            const n=a.name.toLowerCase();
            // Hľadáme ID ako celé slovo/prefix: "g1." alebo "g1 " alebo "g1_" alebo "g1-" alebo "g1" na konci
            return new RegExp('(^|[\\s_\\-])'+sidLower+'([.\\s_\\-]|$)').test(n);
          });
          if(matchedAtts.length){
            const attSec=el('div',{style:{marginTop:'14px'}});
            attSec.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'10px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px'}},'📎 Prílohy'));
            matchedAtts.forEach(att=>{
              const isImg=/^image\//i.test(att.type);
              const isPdf=/pdf/i.test(att.type);
              const row=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',background:'#141926',border:'1px solid #1E2B3C',borderRadius:'10px',padding:'10px 12px',marginBottom:'8px',cursor:'pointer'}});
              row.onclick=()=>openAttachment(att);
              if(isImg){
                const imgEl=el('img',{src:'',style:{width:'52px',height:'52px',objectFit:'cover',borderRadius:'6px',flexShrink:'0',background:'#0D1117'}});
                if(att.url){ imgEl.src=att.url; }
                else{ loadAttData(att.id).then(d=>{ if(d) imgEl.src=d; }); }
                row.appendChild(imgEl);
              } else {
                row.appendChild(el('div',{style:{width:'52px',height:'52px',background:isPdf?'#1A0808':'#0B1221',border:`1px solid ${isPdf?'#3D0A0A':'#1E2B3C'}`,borderRadius:'6px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'26px',flexShrink:'0'}},isPdf?'📄':'📎'));
              }
              const info=el('div',{style:{flex:'1',minWidth:'0'}});
              info.appendChild(el('div',{style:{color:'#E8EDF5',fontSize:'13px',fontWeight:'600',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},att.name));
              info.appendChild(el('div',{style:{color:'#4A6585',fontSize:'11px',marginTop:'2px'}},(att.size/1024).toFixed(0)+' KB'));
              row.appendChild(info);
              row.appendChild(el('span',{style:{color:'#3A4D65',fontSize:'16px',flexShrink:'0'}},'↗'));
              attSec.appendChild(row);
            });
            pwrap.appendChild(attSec);
          }
        }

      } else {
        // ── HLAVNÝ POHĽAD: celá tabuľka so skupinami ─────────
        const colW=['2fr','1fr','1fr','0.7fr','0.7fr','1.5fr'];
        const hdrs=['Názov','Dĺžka','Šírka','Hrúb.','Počet','Materiál'];
        const specialKeywords=/36mm|duplak/i;

        function makeDataRow(r,idx,bg){
          const isSpecial=specialKeywords.test(r.nazov)||specialKeywords.test(r.material);
          const row=el('div',{style:{display:'grid',gridTemplateColumns:colW.join(' '),padding:'5px 8px',borderRadius:'4px',background:isSpecial?(idx%2===0?'#1F0A0A':'#1A0808'):bg,alignItems:'center'}});
          if(isSpecial) row.style.outline='1px solid #3D0A0A';
          row.appendChild(el('span',{style:{color:isSpecial?'#EF4444':'#E8EDF5',fontSize:'13px',fontWeight:isSpecial?'700':'400'}},r.nazov||'—'));
          function dimCell(num,lo,hi,lc,hc){
            const n=parseFloat(num)||0,isLo=n>0&&n<lo,isHi=n>0&&n>hi;
            const cell=el('div',{style:{textAlign:'center',borderRadius:'4px',padding:(isLo||isHi)?'2px 4px':'0',background:isLo?'#0D2B1F':isHi?'#2D1A00':'transparent'}});
            cell.appendChild(el('span',{style:{color:isLo?lc:isHi?hc:'#7A9AB8',fontSize:'13px',fontWeight:(isLo||isHi)?'700':'400'}},num||'—'));
            return cell;
          }
          const sc=dimCell(r.sirka.num,80,2780,'#34D399','#F97316');
          if(r.sirka.edges>0) sc.appendChild(el('span',{style:{fontSize:'11px',fontWeight:'700',background:r.sirka.edges===2?'#1E3A5F':'#1A2A1A',color:r.sirka.edges===2?'#60A5FA':'#34D399',borderRadius:'4px',padding:'1px 5px',marginLeft:'4px'}},r.sirka.edges===2?'\\\\':'\\'));
          row.appendChild(sc);
          const dc=dimCell(r.dlzka.num,80,2050,'#34D399','#F97316');
          if(r.dlzka.edges>0) dc.appendChild(el('span',{style:{fontSize:'11px',fontWeight:'700',background:r.dlzka.edges===2?'#1E3A5F':'#1A2A1A',color:r.dlzka.edges===2?'#60A5FA':'#34D399',borderRadius:'4px',padding:'1px 5px',marginLeft:'4px'}},r.dlzka.edges===2?'\\\\':'\\'));
          row.appendChild(dc);
          row.appendChild(el('div',{style:{textAlign:'center',color:'#7A9AB8',fontSize:'13px'}},r.hrubka||'—'));
          const pc=el('div',{style:{textAlign:'center'}});
          if(r.pocet){pc.appendChild(el('span',{style:{color:'#E8EDF5',fontWeight:'700',fontSize:'13px'}},r.pocet));pc.appendChild(el('span',{style:{color:'#3A4D65',fontSize:'10px',marginLeft:'2px'}},'ks'));}
          else pc.appendChild(document.createTextNode('—'));
          row.appendChild(pc);
          row.appendChild(el('div',{style:{color:'#4A6585',fontSize:'12px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.material||''));
          return row;
        }

        // Zoskup riadky zachovávajúc poradie
        const skupiny=[]; // [{id, rows}]
        const idIndex=new Map();
        rows.forEach(r=>{
          const id=extractCabinetId(r.nazov)||'__misc__';
          if(!idIndex.has(id)){ idIndex.set(id,skupiny.length); skupiny.push({id,rows:[]}); }
          skupiny[idIndex.get(id)].rows.push(r);
        });

        const tblWrap=el('div',{style:{overflowX:'auto',marginBottom:'12px'}});
        const tbl=el('div',{style:{minWidth:'480px'}});

        // Hlavička stĺpcov (raz na vrchu)
        const hdrRow=el('div',{style:{display:'grid',gridTemplateColumns:colW.join(' '),padding:'6px 8px',borderBottom:'1px solid #1E3A5F',marginBottom:'6px'}});
        hdrs.forEach(h=>hdrRow.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'10px',textTransform:'uppercase',letterSpacing:'1px',fontWeight:'700'}},h)));
        tbl.appendChild(hdrRow);

        skupiny.forEach(({id,rows:sRows})=>{
          const isMisc=id==='__misc__';
          const totKs=sRows.reduce((s,r)=>s+(parseInt(r.pocet)||0),0);
          const hasDuplak=sRows.some(r=>specialKeywords.test(r.nazov)||specialKeywords.test(r.material));

          // Obal skupiny
          const grp=el('div',{style:{
            border:`1.5px solid ${hasDuplak?'#5B1B1B':isMisc?'#252535':'#1A2D4A'}`,
            borderRadius:'10px',
            marginBottom:'10px',
            overflow:'hidden'
          }});

          // Klikateľná hlavička skupiny
          const ghdr=el('div',{style:{
            display:'flex',alignItems:'center',gap:'10px',
            padding:'7px 10px',
            background:hasDuplak?'#1A0808':isMisc?'#111118':'#0A1628',
            cursor:'pointer',
            userSelect:'none'
          }});
          ghdr.appendChild(el('span',{style:{
            background:hasDuplak?'#3D0A0A':isMisc?'#1E1E30':'#0D1E36',
            border:`1px solid ${hasDuplak?'#7F1D1D':isMisc?'#2E2E50':'#1E3A5F'}`,
            borderRadius:'6px',padding:'2px 10px',
            color:hasDuplak?'#EF4444':isMisc?'#6B7280':'#60A5FA',
            fontWeight:'700',fontSize:'13px',letterSpacing:'0.5px'
          }},isMisc?'—':id));
          ghdr.appendChild(el('span',{style:{color:'#3A4D65',fontSize:'12px',flex:'1'}},`${sRows.length} dielov · ${totKs} ks`));
          ghdr.appendChild(el('span',{style:{color:'#3A4D65',fontSize:'13px'}},'›'));
          ghdr.onclick=()=>setState({porezSkrinka:id});
          grp.appendChild(ghdr);

          // Riadky tabuľky
          const body=el('div',{style:{padding:'4px 4px 4px 4px'}});
          sRows.forEach((r,idx)=>body.appendChild(makeDataRow(r,idx,idx%2===0?'#111827':'#0D1117')));
          grp.appendChild(body);
          tbl.appendChild(grp);
        });

        tblWrap.appendChild(tbl);
        pwrap.appendChild(tblWrap);

        // Súhrn
        const total=rows.reduce((s,r)=>s+(parseInt(r.pocet)||0),0);
        const sumRow=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px',padding:'0 2px'}});
        const realGroups=skupiny.filter(g=>g.id!=='__misc__').length;
        sumRow.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'12px'}},`${realGroups} skriniek · ${rows.length} dielov`));
        if(total>0) sumRow.appendChild(el('div',{style:{color:'#60A5FA',fontWeight:'700',fontSize:'13px'}},`Spolu ${total} ks`));
        pwrap.appendChild(sumRow);
      }

      // Spotreba + raw text — len na hlavnej strane, nie v detaile skrinky
      if(!appState.porezSkrinka){

      // Spotreba tabúľ (strip-packing) + ABS + ceny
      const TABULA_W=2800, TABULA_H=2070;

      // Guillotine cut packing — presný odhad ako SketchCut
      function guillotinePack(pieces){
        if(!pieces.length) return 0;
        // Expand pieces (each copy separately), filter out pieces that don't fit
        const all=[];
        pieces.forEach(p=>{
          const w=p.s, h=p.d;
          const fits=(w<=TABULA_W&&h<=TABULA_H)||(h<=TABULA_W&&w<=TABULA_H);
          if(fits) all.push({w,h});
        });
        if(!all.length) return 0;
        // Sort by longest side desc (largest first)
        all.sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h));

        function placePiece(piece, freeRects){
          let bestIdx=-1, bestScore=Infinity, bestRot=false;
          for(let i=0;i<freeRects.length;i++){
            const r=freeRects[i];
            // Normal
            if(piece.w<=r.w&&piece.h<=r.h){
              const sc=Math.min(r.w-piece.w, r.h-piece.h);
              if(sc<bestScore){bestScore=sc;bestIdx=i;bestRot=false;}
            }
            // Rotated
            if(piece.h<=r.w&&piece.w<=r.h){
              const sc=Math.min(r.w-piece.h, r.h-piece.w);
              if(sc<bestScore){bestScore=sc;bestIdx=i;bestRot=true;}
            }
          }
          if(bestIdx===-1) return false;
          const r=freeRects[bestIdx];
          const pw=bestRot?piece.h:piece.w;
          const ph=bestRot?piece.w:piece.h;
          const rw=r.w-pw, bh=r.h-ph;
          freeRects.splice(bestIdx,1);
          // Split along longer leftover axis
          if(rw*r.h >= r.w*bh){
            if(rw>0&&r.h>0) freeRects.push({x:r.x+pw,y:r.y,w:rw,h:r.h});
            if(pw>0&&bh>0) freeRects.push({x:r.x,y:r.y+ph,w:pw,h:bh});
          } else {
            if(r.w>0&&bh>0) freeRects.push({x:r.x,y:r.y+ph,w:r.w,h:bh});
            if(rw>0&&ph>0) freeRects.push({x:r.x+pw,y:r.y,w:rw,h:ph});
          }
          return true;
        }

        let sheets=0, remaining=[...all];
        while(remaining.length>0){
          sheets++;
          const freeRects=[{x:0,y:0,w:TABULA_W,h:TABULA_H}];
          const notPlaced=[];
          for(const p of remaining){
            if(!placePiece(p,freeRects)) notPlaced.push(p);
          }
          remaining=notPlaced;
        }
        return sheets;
      }

      function stripPackCount(pieces){ return guillotinePack(pieces); }

      function calcUtilPct(pieces, panels){
        if(!panels) return 0;
        const totalArea=pieces.reduce((s,p)=>s+(p.s*p.d),0);
        return Math.round(totalArea/(panels*TABULA_W*TABULA_H)*100);
      }

      const matGroups={};
      let totalABS=0;
      let totalVaha=0; // celková váha zákazky v kg
      rows.forEach(r=>{
        const pocet=parseInt(r.pocet)||0;
        const s=parseFloat(r.sirka.num)||0;
        const d=parseFloat(r.dlzka.num)||0;
        const mat=(r.material||'').trim()||'(bez materiálu)';
        const hrubka=(r.hrubka||'').trim();
        // Kľúč = materiál + hrúbka — rôzne hrúbky = rôzne tabule
        const key=hrubka ? `${mat} ${hrubka}mm` : mat;
        if(!matGroups[key]) matGroups[key]={pieces:[],abs:0,mat,hrubka};
        if(s>0&&d>0&&pocet>0) for(let i=0;i<pocet;i++) matGroups[key].pieces.push({s,d});
        if(r.sirka.edges>=1) matGroups[key].abs+=s*pocet;
        if(r.sirka.edges>=2) matGroups[key].abs+=s*pocet;
        if(r.dlzka.edges>=1) matGroups[key].abs+=d*pocet;
        if(r.dlzka.edges>=2) matGroups[key].abs+=d*pocet;
        totalABS+=(r.sirka.edges>=1?s*pocet:0)+(r.sirka.edges>=2?s*pocet:0)+(r.dlzka.edges>=1?d*pocet:0)+(r.dlzka.edges>=2?d*pocet:0);
        // Váha: hustota = 12.48 * (hrubka/18) — sololit 3mm = 6× ľahší ako DTD 18mm
        if(s>0&&d>0&&pocet>0){
          const h=parseFloat(hrubka)||18;
          const hustota=HUSTOTA_DREVO*(h/18);
          totalVaha+=(s*d/1e6)*hustota*pocet;
        }
      });

      const matNames=Object.keys(matGroups);
      if(matNames.length>0){
        const tabuleSection=el('div',{style:{marginBottom:'12px'}});
        tabuleSection.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'10px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px'}},'Spotreba tabúľ  (2800 × 2070 mm / odhad)'));
        const matGrid=el('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}});
        let grandTotal=0;
        matNames.forEach(mat=>{
          const grp=matGroups[mat];
          const count=stripPackCount(grp.pieces);
          if(count===0) return;
          const autoDekor=findDekorCena(grp.mat||mat);
          const hasManual=appState.cennik.hasOwnProperty(mat);
          const unitPrice=hasManual?(appState.cennik[mat]||0):(autoDekor?autoDekor.cena:0);
          const isAuto=!hasManual&&!!autoDekor;
          const lineTotal=unitPrice*count;
          grandTotal+=lineTotal;

          const mRow=el('div',{style:{background:'#0F1E30',border:'1px solid #1E3A5F',borderRadius:'8px',padding:'8px 12px'}});

          const topLine=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}});
          const nameWrap=el('div',{style:{display:'flex',alignItems:'center',gap:'6px',flex:'1',marginRight:'8px',overflow:'hidden'}});
          nameWrap.appendChild(el('span',{style:{color:'#9EC8F0',fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},grp.mat||mat));
          if(grp.hrubka) nameWrap.appendChild(el('span',{style:{background:'#1E2B3C',color:'#7A9AB8',fontSize:'9px',fontWeight:'700',borderRadius:'4px',padding:'1px 5px',whiteSpace:'nowrap',flexShrink:'0'}},`${grp.hrubka}mm`));
          if(isAuto) nameWrap.appendChild(el('span',{style:{background:'#1A3A1A',color:'#34D399',fontSize:'9px',fontWeight:'700',borderRadius:'4px',padding:'1px 5px',whiteSpace:'nowrap',flexShrink:'0'}},'AUTO'));
          topLine.appendChild(nameWrap);
          const utilPct=calcUtilPct(grp.pieces, count);
          const countWrap=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',flexShrink:'0'}});
          countWrap.appendChild(el('span',{style:{color:'#60A5FA',fontWeight:'700',fontSize:'15px',whiteSpace:'nowrap'}},`${count} ks`));
          if(utilPct>0) countWrap.appendChild(el('span',{style:{color:utilPct>=70?'#34D399':utilPct>=50?'#F59E0B':'#EF4444',fontSize:'10px'}},`využitie ${utilPct}%`));
          topLine.appendChild(countWrap);
          mRow.appendChild(topLine);

          const priceLine=el('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
          const priceWrap=el('div',{style:{position:'relative',flex:'1'}});
          const priceInp=el('input',{style:{background:'#141926',border:`1px solid ${isAuto?'#1E3A28':'#1E3A5F'}`,borderRadius:'6px',color:'#E8EDF5',padding:'5px 28px 5px 8px',fontSize:'13px',width:'100%'},type:'number',min:'0',step:'0.01',placeholder:'Cena / ks (€)'});
          priceInp.value=unitPrice||'';
          priceInp.oninput=e=>setCennikPrice(mat,e.target.value);
          priceWrap.appendChild(priceInp);
          priceWrap.appendChild(el('span',{style:{position:'absolute',right:'8px',top:'50%',transform:'translateY(-50%)',color:'#3A4D65',fontSize:'12px',pointerEvents:'none'}},'€'));
          priceLine.appendChild(priceWrap);
          if(unitPrice>0) priceLine.appendChild(el('span',{style:{color:'#34D399',fontWeight:'700',fontSize:'14px',whiteSpace:'nowrap'}},`= ${lineTotal.toFixed(2)} €`));
          if(hasManual&&autoDekor){
            const resetBtn=el('button',{style:{background:'none',border:'none',color:'#3A4D65',fontSize:'11px',padding:'0',cursor:'pointer',whiteSpace:'nowrap',flexShrink:'0'}},'↺');
            resetBtn.title='Vrátiť na auto cenu';
            resetBtn.onclick=()=>{delete appState.cennik[mat];saveCennik();renderApp();};
            priceLine.appendChild(resetBtn);
          }
          mRow.appendChild(priceLine);

          // ABS per material
          const absM=(grp.abs/1000).toFixed(2);
          if(grp.abs>0){
            const absLine=el('div',{style:{marginTop:'4px',color:'#4A6585',fontSize:'11px'}},`ABS: ${absM} m`);
            mRow.appendChild(absLine);
          }
          matGrid.appendChild(mRow);
        });
        tabuleSection.appendChild(matGrid);
        if(grandTotal>0){
          const totalBar=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'10px',padding:'10px 12px',background:'#0A1628',border:'1px solid #2563EB',borderRadius:'8px'}});
          totalBar.appendChild(el('span',{style:{color:'#7A9AB8',fontSize:'12px',textTransform:'uppercase',letterSpacing:'0.5px'}},'Spolu materiál'));
          totalBar.appendChild(el('span',{style:{color:'#60A5FA',fontWeight:'700',fontSize:'18px'}},`${grandTotal.toFixed(2)} €`));
          tabuleSection.appendChild(totalBar);

          const porezBar=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'6px',padding:'10px 12px',background:'#0A1628',border:'1px solid #2563EB',borderRadius:'8px'}});
          porezBar.appendChild(el('span',{style:{color:'#7A9AB8',fontSize:'12px',textTransform:'uppercase',letterSpacing:'0.5px'}},'Cena za porez'));
          porezBar.appendChild(el('span',{style:{color:'#60A5FA',fontWeight:'700',fontSize:'18px'}},`${grandTotal.toFixed(2)} €`));
          tabuleSection.appendChild(porezBar);

          const spoluBar=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'6px',padding:'10px 12px',background:'#0D1F3C',border:'1px solid #3B82F6',borderRadius:'8px',gap:'10px'}});
          const spoluLeft=el('div',{style:{display:'flex',flexDirection:'column',gap:'4px'}});
          spoluLeft.appendChild(el('span',{style:{color:'#E8EDF5',fontSize:'13px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.5px'}},'Spolu'));
          const addToMatBtn=el('button',{style:{background:'#2563EB',border:'none',borderRadius:'6px',color:'#fff',fontSize:'11px',fontWeight:'700',padding:'3px 8px',cursor:'pointer',whiteSpace:'nowrap'}},'+ Pridať do zákazky');
          addToMatBtn.onclick=()=>{
            const spolu=grandTotal*2;
            const entry={id:Date.now().toString(36),name:'Porez (materiál + réžia)',cost:spolu,note:'',at:Date.now()};
            updateOrder(sel.id,{materials:[entry,...(sel.materials||[])]});
            setState({tab:'materials'});
          };
          spoluLeft.appendChild(addToMatBtn);
          spoluBar.appendChild(spoluLeft);
          spoluBar.appendChild(el('span',{style:{color:'#FFFFFF',fontWeight:'700',fontSize:'20px'}},`${(grandTotal*2).toFixed(2)} €`));
          tabuleSection.appendChild(spoluBar);
          if(totalVaha>0){
            const vahaBar=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'6px',padding:'10px 12px',background:'#1C1400',border:'1px solid #78350F',borderRadius:'8px'}});
            vahaBar.appendChild(el('span',{style:{color:'#92400E',fontSize:'12px',textTransform:'uppercase',letterSpacing:'0.5px'}},'⚖ Váha zákazky'));
            vahaBar.appendChild(el('span',{style:{color:'#F59E0B',fontWeight:'700',fontSize:'18px'}},`${totalVaha.toFixed(1)} kg`));
            tabuleSection.appendChild(vahaBar);
          }
        }
        pwrap.appendChild(tabuleSection);
      }



      // Raw text toggle
      const rawToggle=el('button',{style:{background:'none',border:'1px solid #1E2B3C',borderRadius:'8px',color:'#3A4D65',fontSize:'12px',padding:'6px 12px',marginBottom:'8px',width:'100%',cursor:'pointer'}},appState.porezRawOpen?'▲ Skryť zdrojový text':'▼ Zobraziť zdrojový text');
      rawToggle.onclick=()=>{ appState.porezRawOpen=!appState.porezRawOpen; renderApp(); };
      pwrap.appendChild(rawToggle);

      if(appState.porezRawOpen){
        const hdrRaw=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}});
        hdrRaw.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px'}},'Zdrojový text'));
        const clrBtn=el('button',{style:{background:'none',border:'none',color:'#374151',fontSize:'12px',cursor:'pointer'}},'Vymazať');
        clrBtn.onclick=()=>updateOrder(sel.id,{porezText:''});
        hdrRaw.appendChild(clrBtn);
        pwrap.appendChild(hdrRaw);
        const ta=el('textarea',{style:{width:'100%',background:'#141926',border:'1px solid #1E2B3C',borderRadius:'8px',color:'#E8EDF5',padding:'12px',fontSize:'12px',fontFamily:'monospace',lineHeight:'1.6',minHeight:'200px',resize:'vertical',boxSizing:'border-box'}});
        ta.value=porezText;
        ta.oninput=e=>updateOrder(sel.id,{porezText:e.target.value});
        pwrap.appendChild(ta);
      }
      } // koniec if(!appState.porezSkrinka)
    } else {
      // Empty — show textarea to paste
      const hdr=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}});
      hdr.appendChild(el('div',{style:{color:'#3A4D65',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px'}},'Obsah súboru na pílenie'));
      pwrap.appendChild(hdr);
      const ta=el('textarea',{style:{width:'100%',background:'#141926',border:'1.5px solid #1E2B3C',borderRadius:'10px',color:'#E8EDF5',padding:'12px',fontSize:'13px',fontFamily:'monospace',lineHeight:'1.6',minHeight:'300px',resize:'vertical',boxSizing:'border-box'}});
      ta.value='';
      ta.placeholder='Vlož text súboru posielaného na porez...';
      ta.oninput=e=>updateOrder(sel.id,{porezText:e.target.value});
      pwrap.appendChild(ta);
    }

    scroll.appendChild(pwrap);
  }

  if(appState.tab==='prilohy'){
    scroll.appendChild(renderPrilohy(sel));
  }

  if(appState.tab==='history'){
    const hc=el('div',{className:'info-card',style:{margin:'12px 16px'}});
    hc.appendChild(el('div',{className:'info-card-title'},'📜 História zmien'));
    STATUSES.filter(s=>sel[`statusHistory_${s.key}`]).forEach(s=>{
      const r=el('div',{className:'info-row'});
      const lbl=el('span',{style:{color:s.color,fontSize:'13px'}},`● ${s.label}`);
      r.append(lbl,el('span',{style:{color:'#9CA3AF',fontSize:'14px'}},fmtDate(sel[`statusHistory_${s.key}`])));
      hc.appendChild(r);
    });
    function hr2(lbl,val){
      const r=el('div',{className:'info-row'});
      r.append(el('span',{className:'info-label'},lbl),el('span',{style:{color:'#6B7280',fontSize:'14px'}},val));
      return r;
    }
    hc.appendChild(hr2('Vytvorená',fmtDate(sel.createdAt)));
    hc.appendChild(hr2('Posledná zmena',fmtDate(sel.updatedAt)));
    scroll.appendChild(hc);
  }

  frag.appendChild(scroll);
  return frag;
}

// ═══════════════════════════════════
// PRÍLOHY TAB
// ═══════════════════════════════════
function renderPrilohy(order){
  const wrap=el('div',{style:{padding:'12px 16px',paddingBottom:'60px'}});
  const attachments=order.attachments||[];

  // Shared upload handler
  async function handleFiles(files, insertRef){
    if(!files.length) return;
    for(const file of files){
      const progDiv=el('div',{style:{background:'#141926',border:'1px solid #1E2B3C',borderRadius:'8px',padding:'10px 14px',marginBottom:'8px',color:'#7A9AB8',fontSize:'13px'}},`⏫ Spracúvam ${file.name}…`);
      wrap.insertBefore(progDiv, insertRef);
      try{
        let dataUrl;
        if(file.type.startsWith('image/')){
          dataUrl=await compressImage(file,1600,0.80);
          if(!dataUrl) throw new Error('Chyba pri spracovaní obrázka.');
        } else {
          if(file.size>4*1024*1024) throw new Error(`Súbor je príliš veľký (${(file.size/1024/1024).toFixed(1)} MB). Max 4 MB.`);
          dataUrl=await fileToDataUrl(file);
        }
        const attId=uid();
        await saveAttData(attId,order.id,dataUrl);
        const att={id:attId,name:file.name,type:file.type,size:file.size,uploadedAt:Date.now()};
        updateOrder(order.id,{attachments:[...(order.attachments||[]),att]});
        progDiv.remove();
      }catch(err){
        console.error('Attachment upload error:',err);
        progDiv.style.cssText+='border-color:#7F1D1D;background:#1A0808;color:#EF4444;';
        progDiv.innerHTML='';
        const closeBtn=el('button',{style:{float:'right',background:'none',border:'none',color:'#EF4444',fontSize:'16px',cursor:'pointer',padding:'0 4px'}},'✕');
        closeBtn.onclick=()=>progDiv.remove();
        progDiv.appendChild(closeBtn);
        progDiv.appendChild(el('div',{style:{fontWeight:'700',marginBottom:'4px'}},'✗ Chyba pri nahrávaní'));
        progDiv.appendChild(el('div',{style:{fontSize:'12px',wordBreak:'break-word'}},err.message||String(err)));
      }
    }
  }

  // Button row: camera + file upload
  const btnRow=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'14px'}});

  // Camera button
  const cameraLbl=el('label',{style:{background:'rgba(78,222,163,0.08)',border:'1.5px solid rgba(78,222,163,0.25)',borderRadius:'12px',color:'var(--tertiary)',fontWeight:'700',fontSize:'14px',padding:'13px 0',textAlign:'center',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'7px',boxSizing:'border-box'}});
  const camIco=msIcon('photo_camera',true); camIco.style.fontSize='20px';
  cameraLbl.append(camIco,el('span',{},'Fotka'));
  const camInp=el('input',{type:'file',accept:'image/*',style:{display:'none'}});
  camInp.setAttribute('capture','environment');
  camInp.onchange=async e=>{ await handleFiles([...e.target.files], cameraLbl); e.target.value=''; };
  cameraLbl.appendChild(camInp);

  // File upload button
  const uploadLbl=el('label',{style:{background:'rgba(176,198,255,0.06)',border:'1.5px solid rgba(176,198,255,0.15)',borderRadius:'12px',color:'var(--primary)',fontWeight:'700',fontSize:'14px',padding:'13px 0',textAlign:'center',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'7px',boxSizing:'border-box'}});
  const attIco=msIcon('attach_file',false); attIco.style.fontSize='20px';
  uploadLbl.append(attIco,el('span',{},'Súbor'));
  const fileInp=el('input',{type:'file',accept:'.pdf,.jpg,.jpeg,.png,image/*,application/pdf',style:{display:'none'},multiple:true});
  fileInp.onchange=async e=>{ await handleFiles([...e.target.files], uploadLbl); e.target.value=''; };
  uploadLbl.appendChild(fileInp);

  btnRow.append(cameraLbl, uploadLbl);
  wrap.appendChild(btnRow);

  if(!attachments.length){
    const emp=el('div',{style:{textAlign:'center',padding:'40px 20px',color:'#3A4D65'}});
    emp.appendChild(el('div',{style:{fontSize:'36px',marginBottom:'10px'}},'📎'));
    emp.appendChild(el('div',{style:{fontSize:'14px'}},'Žiadne prílohy'));
    wrap.appendChild(emp);
    return wrap;
  }

  attachments.forEach(att=>{
    const isImg=/^image\//i.test(att.type);
    const isPdf=/pdf/i.test(att.type);
    const row=el('div',{style:{display:'flex',alignItems:'center',gap:'10px',background:'#141926',border:'1px solid #1E2B3C',borderRadius:'10px',padding:'10px 12px',marginBottom:'8px'}});

    // Thumbnail / icon
    if(isImg){
      const imgEl=el('img',{src:'',style:{width:'44px',height:'44px',objectFit:'cover',borderRadius:'6px',flexShrink:'0',cursor:'pointer',background:'#0D1117'}});
      imgEl.onclick=()=>openAttachment(att);
      // Async load thumbnail
      if(att.url){ imgEl.src=att.url; }
      else{ loadAttData(att.id).then(d=>{ if(d) imgEl.src=d; }); }
      row.appendChild(imgEl);
    } else {
      const ico=el('div',{style:{width:'44px',height:'44px',background:'#1A0808',border:'1px solid #3D0A0A',borderRadius:'6px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',flexShrink:'0',cursor:'pointer'}},isPdf?'📄':'📎');
      ico.onclick=()=>openAttachment(att);
      row.appendChild(ico);
    }

    // Info
    const info=el('div',{style:{flex:'1',minWidth:'0'}});
    const nameEl=el('div',{style:{color:'#E8EDF5',fontSize:'13px',fontWeight:'600',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',cursor:'pointer'}},att.name);
    nameEl.onclick=()=>openAttachment(att);
    const sizeEl=el('div',{style:{color:'#4A6585',fontSize:'11px',marginTop:'2px'}},(att.size/1024).toFixed(0)+' KB · '+(att.uploadedAt?new Date(att.uploadedAt).toLocaleDateString('sk-SK'):''));
    info.append(nameEl,sizeEl);
    row.appendChild(info);

    // Delete
    const delBtn=el('button',{style:{background:'none',border:'none',color:'#374151',fontSize:'18px',padding:'4px 6px',flexShrink:'0',lineHeight:'1',cursor:'pointer'}},'✕');
    delBtn.onclick=async ()=>{
      if(!confirm(`Zmazať prílohu "${att.name}"?`)) return;
      // Delete from Firestore (new format); ignore Storage errors for old format
      if(!att.url){ try{ await db.collection('lupana_att').doc(att.id).delete(); }catch(e){} }
      else { try{ await storage.ref(att.path).delete(); }catch(e){} }
      updateOrder(order.id,{attachments:(order.attachments||[]).filter(a=>a.id!==att.id)});
    };
    row.append(delBtn);
    wrap.appendChild(row);
  });

  return wrap;
}

// Emoji fallbacks pre prípad že Material Symbols font sa nenačíta
const _msEmoji={edit:'✏️',edit_square:'📝',layers:'🧱',shopping_cart:'🛒',content_cut:'✂️',schedule:'⏱',attach_file:'📎',arrow_back:'←',add:'＋',add_circle:'＋',search:'🔍',chevron_right:'›',sync:'↻',inventory_2:'📦',photo_camera:'📷',image:'🖼',picture_as_pdf:'📄',grid_on:'⊞',undo:'↩',delete_sweep:'🗑',save:'💾',open_with:'✥',gesture:'✍️',arrow_forward:'→',calendar_month:'📅',timer:'⏱',home:'⌂',check:'✓',close:'✕',more_vert:'⋮',ink_eraser:'⌫',space_dashboard:'⊟',draw:'✏️'};
function msIcon(name,fill=false){
  const s=el('span',{className:'material-symbols-outlined'});
  s.setAttribute('data-icon',name);
  if(fill) s.style.fontVariationSettings="'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24";
  s.textContent=name;
  return s;
}
// Skontroluj či sa font načítal, ak nie — nahraď emoji
(function checkIconFont(){
  const test=document.createElement('span');
  test.className='material-symbols-outlined';
  test.style.cssText='position:absolute;visibility:hidden;font-size:16px';
  test.textContent='home';
  document.body.appendChild(test);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const loaded=test.offsetWidth>5&&test.offsetWidth<30;
      test.remove();
      if(!loaded){
        document.querySelectorAll('.material-symbols-outlined[data-icon]').forEach(s=>{
          const emoji=_msEmoji[s.getAttribute('data-icon')];
          if(emoji){ s.textContent=emoji; s.style.fontFamily='inherit'; s.style.fontSize='18px'; }
        });
        // Re-check після 2 секунды (шрифт може ще завантажуватися)
        setTimeout(()=>{
          document.querySelectorAll('.material-symbols-outlined[data-icon]').forEach(s=>{
            s.textContent=s.getAttribute('data-icon');
            s.style.fontFamily='';
            s.style.fontSize='';
          });
        },2000);
      }
    });
  });
})()

let _listAnimDone = false;
function renderList(){
  const {data,filterStatus,search,selectedCard,showMenu} = appState;
  const orders = data.orders||[];
  
  const totalPrice=orders.reduce((s,o)=>s+(parseFloat(o.price)||0),0);
  const totalDeposit=orders.reduce((s,o)=>s+(parseFloat(o.depositPaid)||0),0);
  const totalDue=totalPrice-totalDeposit;
  const totalMat=orders.reduce((s,o)=>s+(o.materials||[]).reduce((a,m)=>a+(m.cost||0),0),0);

  const filtered = orders.filter(o=>{
    const match = filterStatus==='all'?true:filterStatus==='rozpracovane'?ROZPRACOVANE.includes(o.status):o.status==='hotova';
    const q=search.toLowerCase();
    const ms=!q||(o.customerName||'').toLowerCase().includes(q)||(o.title||'').toLowerCase().includes(q)||(o.customerPhone||'').includes(q);
    return match&&ms;
  }).sort((a,b)=>{
    const seq=data.orderSequence||[];
    const ai=seq.indexOf(a.id), bi=seq.indexOf(b.id);
    if(ai===-1&&bi===-1) return b.createdAt-a.createdAt;
    if(ai===-1) return 1; if(bi===-1) return -1;

  const frag=document.createDocumentFragment();

  // HEADER

  appNameBtn.textContent='LUPANA';
  appNameBtn.onclick=e=>{ e.stopPropagation(); setState({showMenu:!showMenu}); };
  const chevron=msIcon(showMenu?'expand_less':'expand_more');
  chevron.style.cssText='color:var(--on-surface-var);font-size:20px;margin-top:2px';
  const syncDot=el('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:syncStatus==='ok'?'var(--tertiary)':syncStatus==='saving'?'var(--primary)':'var(--error)',flexShrink:'0',marginLeft:'2px',marginTop:'2px'}});
  appNameRow.append(appNameBtn,chevron,syncDot);
  appNameRow.onclick=e=>{ e.stopPropagation(); setState({showMenu:!showMenu}); };
  hleft.appendChild(appNameRow);
  hleft.appendChild(el('div',{style:{color:'var(--outline)',fontSize:'11px',fontWeight:'500',marginTop:'2px'}},`${orders.length} zákaziek celkovo`));

  if(showMenu){
    const dd=el('div',{className:'dropdown'});
    [['person_search','Zákazníci','customers'],['bar_chart','Štatistiky','stats'],['calendar_view_month','Ročný prehľad','yearly'],['calendar_month','Kalendár','calendar'],['inventory_2','Archív','archive'],['save','Zálohovanie dát','backup']].forEach(([icon,label,key])=>{
      const item=el('button',{className:'dropdown-item'});
      item.append(msIcon(icon),label);
      item.onclick=()=>setState({subPage:key,showMenu:false});
      dd.appendChild(item);
    });
    hleft.appendChild(dd);
    setTimeout(()=>{ document.addEventListener('click',()=>setState({showMenu:false}),{once:true}); },0);
  }

  hdr.appendChild(hleft);
  const hdrRight=el('div',{style:{display:'flex',gap:'10px',alignItems:'center'}});

  // Cart button
  const nakupBadge=(appState.data.orders||[]).reduce((s,o)=>(o.nakupList||[]).filter(i=>!i.checked).length+s,0);
  const nakupBtn=el('button',{style:{background:'none',border:'none',color:'var(--primary)',cursor:'pointer',position:'relative',padding:'4px',display:'flex'}});
  nakupBtn.appendChild(msIcon('shopping_cart'));
  if(nakupBadge>0){ const nb2=el('span',{className:'badge'},String(nakupBadge)); nakupBtn.appendChild(nb2); }
  nakupBtn.onclick=()=>setState({subPage:'nakupMerge', nakupSelected:[], nakupMergeChecked:{}});
  hdrRight.appendChild(nakupBtn);

  // Sklad button
  const skladBadge=(appState.data.sklad||[]).filter(i=>i.qty<=i.minQty).length;
  const skladBtn=el('button',{style:{background:'none',border:'none',color:'var(--outline)',cursor:'pointer',position:'relative',padding:'4px',display:'flex'}});
  skladBtn.appendChild(msIcon('inventory_2'));
  if(skladBadge>0){ const sb2=el('span',{className:'badge'},String(skladBadge)); skladBtn.appendChild(sb2); }
  skladBtn.onclick=()=>setState({subPage:'sklad'});
  hdrRight.appendChild(skladBtn);

  // New order button
  const newBtn=el('button',{className:'btn btn-primary',style:{padding:'8px 16px',fontSize:'14px',display:'flex',alignItems:'center',gap:'6px'}});
  newBtn.append(msIcon('add'),'Nová');
  newBtn.onclick=()=>{ setState({page:'new'}); };
  hdrRight.appendChild(newBtn);
  hdr.appendChild(hdrRight);
  frag.appendChild(hdr);

  // BACKUP REMINDER
  const lastBackup=data.lastBackup;
  const oneWeek=7*24*60*60*1000;
  if(!lastBackup||(Date.now()-lastBackup>oneWeek)){
    const daysAgo=lastBackup?Math.floor((Date.now()-lastBackup)/(24*60*60*1000)):null;
    const brem=el('div',{style:{margin:'0 16px 12px',background:'#1C1400',border:'1px solid #78350F',borderRadius:'12px',padding:'12px 14px',display:'flex',alignItems:'center',gap:'10px'}});
    brem.appendChild(el('span',{style:{fontSize:'20px'}},'💾'));
    const bt=el('div',{style:{flex:'1'}});
    bt.appendChild(el('div',{style:{color:'#F59E0B',fontWeight:'700',fontSize:'13px'}},lastBackup?`Záloha pred ${daysAgo} dňami`:'Zatiaľ bez zálohy'));
    bt.appendChild(el('div',{style:{color:'#92400E',fontSize:'12px'}},'Odporúčame zálohovať raz týždenne'));
    brem.appendChild(bt);
    const zb=el('button',{style:{background:'#F59E0B',border:'none',borderRadius:'8px',color:'#000',fontWeight:'700',fontSize:'12px',padding:'8px 12px',cursor:'pointer',whiteSpace:'nowrap'}},'⬇️ Záloha');
    zb.onclick=quickExport;
    brem.appendChild(zb);
    frag.appendChild(brem);
  }

  // SUMMARY — 4-col square grid
  const sg=el('div',{className:'summary-grid'});
  function scard(lbl,val,unit,color){
    const c=el('div',{className:'summary-card'});
    c.appendChild(el('div',{className:'lbl'},lbl));
    const bottom=el('div');
    bottom.appendChild(el('div',{className:'val',style:{color}},val));
    bottom.appendChild(el('div',{className:'unit',style:{color}},unit));
    c.appendChild(bottom);
    return c;
  }
  const fmtShort=n=>{if(n>=1000){return (n/1000).toFixed(n%1000===0?0:1)+' k';} return String(Math.round(n));};
  sg.append(
    scard('CELKOV.','€ '+fmtShort(totalPrice),'objem','var(--primary-container)'),
    scard('PRIJATÉ','€ '+fmtShort(totalDeposit),'zálohy','var(--tertiary)'),
    scard('DOPLAT.','€ '+fmtShort(totalDue>0?totalDue:0),'zostatok',totalDue>0?'var(--error)':'var(--tertiary)'),
    scard('POČET',String(orders.length),'zákaziek','var(--on-surface)')
  );
  frag.appendChild(sg);

  // FILTER PILLS
  const pr=el('div',{className:'pill-row'});
  [{key:'all',label:'Všetky',count:orders.length},{key:'rozpracovane',label:'Rozpracované',count:orders.filter(o=>ROZPRACOVANE.includes(o.status)).length},{key:'hotova',label:'Hotové',count:orders.filter(o=>o.status==='hotova').length}].forEach(f=>{
    const active=filterStatus===f.key;

    p.append(dot,`${f.label} (${f.count})`);
    p.onclick=()=>setState({filterStatus:f.key});
    pr.appendChild(p);
  });
  frag.appendChild(pr);

  // SEARCH
  const sw=el('div',{style:{padding:'0 16px 12px',position:'relative'}});
  const searchIcon=msIcon('search');
  searchIcon.style.cssText='position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--outline);font-size:20px;pointer-events:none';
  const si=el('input',{type:'text',placeholder:'Hľadať podľa zákazníka alebo názvu...',style:{paddingLeft:'44px',borderRadius:'16px'}});
  si.value=search;
  si.oninput=e=>setState({search:e.target.value});
  sw.append(searchIcon,si);
  frag.appendChild(sw);

  // ORDER LIST
  const ol=el('div',{style:{padding:'4px 16px'}});
  if(!filtered.length){
    const emp=el('div',{style:{textAlign:'center',color:'var(--outline)',padding:'60px 20px'}});
    emp.appendChild(el('div',{style:{fontSize:'48px',marginBottom:'12px'}},'📂'));
    emp.appendChild(el('div',{style:{fontSize:'16px',marginBottom:'16px'}},'Žiadne zákazky'));
    const ab=el('button',{className:'btn btn-primary',style:{padding:'10px 18px'}},'+  Pridať prvú zákazku');
    ab.onclick=()=>setState({page:'new'});
    emp.appendChild(ab);
    ol.appendChild(emp);
  }

  filtered.forEach((o, cardIdx)=>{
    const st=statusOf(o.status);
    const price=parseFloat(o.price)||0;
    const deposit=parseFloat(o.depositPaid)||0;
    const due=price-deposit;
    const mins=totalMins(o);
    const depositDate=o.depositDate?new Date(o.depositDate):null;
    const deadlineDate=o.deadlineDate?new Date(o.deadlineDate):depositDate?new Date(new Date(depositDate).setMonth(depositDate.getMonth()+2)):null;
    const isAuto=!o.deadlineDate&&!!depositDate;
    const isOverdue=deadlineDate&&deadlineDate<new Date()&&o.status!=='storno';
    const selected=selectedCard===o.id;
    const unresolved=(o.notes||[]).filter(n=>!n.resolved).length;
    const isOdd=cardIdx%2===1;

    const animClass=_listAnimDone?'':' card-anim';

    if(price>0){
      const cenaBox=el('div',{style:{background:'var(--surface-high)',borderRadius:'14px',padding:'8px 12px',display:'flex',flexDirection:'column',gap:'1px',flex:'1',minWidth:'80px'}});
      cenaBox.append(
        el('span',{style:{color:'var(--outline)',fontSize:'10px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'0.6px'}},'Cena'),
        el('span',{style:{color:selected?'var(--tertiary)':'var(--on-surface)',fontWeight:'700',fontSize:'17px',letterSpacing:'-0.5px',transition:'color 0.2s'}},fmt(price))
      );
      finBoxes.appendChild(cenaBox);
    }
    if(deposit>0){
      const zalohaBox=el('div',{style:{background:'var(--surface-high)',borderRadius:'14px',padding:'8px 12px',display:'flex',flexDirection:'column',gap:'1px',flex:'1',minWidth:'80px'}});
      zalohaBox.append(
        el('span',{style:{color:'var(--outline)',fontSize:'10px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'0.6px'}},'Záloha'),
        el('span',{style:{color:selected?'#F59E0B':'var(--on-surface-var)',fontWeight:'700',fontSize:'17px',letterSpacing:'-0.5px',transition:'color 0.2s'}},fmt(deposit))
      );
      finBoxes.appendChild(zalohaBox);
    }
    if(price>0){
      const dueColor=due>0?'var(--error)':'var(--tertiary)';

      doplBox.append(
        el('span',{style:{color:'var(--outline)',fontSize:'10px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'0.6px'}},'Doplatok'),
        el('span',{style:{color:selected?dueColor:'var(--on-surface-var)',fontWeight:'700',fontSize:'17px',letterSpacing:'-0.5px',transition:'color 0.2s'}},fmt(due>=0?due:0))

      finBoxes.appendChild(doplBox);

      const emptyBox=el('div',{style:{background:'var(--surface-high)',borderRadius:'14px',padding:'8px 12px',display:'flex',flexDirection:'column',gap:'1px',flex:'1',minWidth:'80px'}});

        el('span',{style:{color:'var(--outline)',fontSize:'10px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'0.6px'}},'Cena'),
        el('span',{style:{color:'var(--outline-var)',fontWeight:'600',fontSize:'15px'}},'—')
      );
      finBoxes.appendChild(emptyBox);
    }
    finRow.appendChild(finBoxes);

    // Date/time column (right side of finRow)
    if(deadlineDate||mins>0){
      const metaCol=el('div',{style:{display:'flex',flexDirection:'column',justifyContent:'center',gap:'4px',alignItems:'flex-end',flexShrink:'0'}});
      if(deadlineDate){
        const dlRow=el('div',{style:{display:'flex',alignItems:'center',gap:'4px'}});
        const calIco=msIcon('calendar_month',false);

    porezb.appendChild(msIcon('content_cut',hasPorez));

    const attCnt=(o.attachments||[]).length;
    const attHas=attCnt>0;
    const attb=el('button',{className:'icon-btn',style:{cursor:'pointer',position:'relative',color:attHas?'var(--primary)':'var(--outline)',background:attHas?'rgba(176,198,255,0.1)':'transparent',border:`1px solid ${attHas?'rgba(176,198,255,0.2)':'rgba(255,255,255,0.07)'}`}});
