<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>

<title>LUPANA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030712;color:#F9FAFB;font-family:'Segoe UI',system-ui,sans-serif;max-width:560px;margin:0 auto;min-height:100vh}
input,select,textarea,button{font-family:inherit;outline:none}
input,select,textarea{background:#0D1117;border:1px solid #1F2937;border-radius:8px;color:#F9FAFB;padding:10px 12px;font-size:14px;width:100%}
input::placeholder,textarea::placeholder{color:#374151}
button{cursor:pointer}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#030712}::-webkit-scrollbar-thumb{background:#1F2937;border-radius:2px}
.card{background:#0D1117;border-radius:12px;padding:14px 16px;border:1px solid #1F2937;margin-bottom:10px;transition:all 0.15s}
.card.selected{border-color:#3B82F6;background:#0a1628;box-shadow:0 0 0 1px #3B82F644}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600}
.btn-primary{background:#2563EB;color:#fff}
.btn-danger{background:#0D1117;border:1px solid #1F2937;color:#6B7280;font-size:13px;padding:8px 14px}
.topbar{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #111827;background:#030712;position:sticky;top:0;z-index:10;gap:8px}
.topbar-title{flex:1;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-btn{background:none;border:none;color:#6B7280;font-size:14px;padding:6px 0;flex-shrink:0}
.tabs{display:flex;border-bottom:1px solid #111827;background:#030712;position:sticky;top:49px;z-index:9;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:#4B5563;font-size:11px;padding:10px 2px;font-weight:600;white-space:nowrap;min-width:50px}
.tab.active{color:#60A5FA;border-bottom-color:#3B82F6}
.info-card{margin:12px 16px;background:#111827;border-radius:12px;border:1px solid #1F2937;overflow:hidden}
.info-card-title{color:#4B5563;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;padding:12px 16px 0}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #1a2234}
.info-row:last-child{border-bottom:none}
.info-label{color:#4B5563;font-size:13px}
.info-val{color:#9CA3AF;font-size:14px;text-align:right;max-width:60%}
.info-val.big{color:#F9FAFB;font-weight:700;font-size:16px}
.section{margin:0 16px 16px}
.section-title{color:#6B7280;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-body{background:#111827;border-radius:12px;padding:4px 16px;border:1px solid #1F2937}
.field{flex:1;padding:10px 0}
.field label{color:#6B7280;font-size:11px;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
.row2{display:flex;gap:12px}
.pill-row{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.pill{background:#111827;border:1px solid #1F2937;border-radius:20px;color:#6B7280;font-size:12px;padding:5px 12px;white-space:nowrap;display:flex;align-items:center;flex-shrink:0}
.pill.active{background:#1E3A5F;color:#60A5FA;border-color:#3B82F6}
.summary-grid{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
.summary-card{background:#111827;border-radius:10px;padding:10px 10px;border:1px solid #1F2937;flex:1;min-width:0;overflow:hidden}
.summary-card .lbl{color:#4B5563;font-size:9px;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-card .val{font-weight:700;font-size:13px;letter-spacing:-0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-bar{margin-top:10px;border-top:1px solid #1F2937;padding-top:8px;display:flex;align-items:center;gap:6px}
.icon-btn{background:#1a2234;border:1px solid #1F2937;border-radius:8px;color:#6B7280;font-size:16px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.badge{position:absolute;top:-5px;right:-5px;background:#EF4444;color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;line-height:1}
.status-banner{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#111827;border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:560px;border:1px solid #1F2937;border-bottom:none}
.log-box{margin:0 16px 12px;background:#111827;border-radius:10px;padding:14px;border:1px solid #1F2937}
.time-entry{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #111827}
.del-btn{background:none;border:none;color:#374151;font-size:14px;padding:4px 8px}
.note-card{background:#0D1117;border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid #1F2937;display:flex;gap:10px;align-items:flex-start}
.checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #374151;background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px}
.checkbox.checked{border-color:#10B981;background:#10B981}
.dropdown{position:absolute;top:100%;left:0;margin-top:8px;background:#111827;border:1px solid #1F2937;border-radius:12px;overflow:hidden;z-index:50;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.dropdown-item{width:100%;background:none;border:none;border-bottom:1px solid #1F2937;color:#D1D5DB;font-size:15px;padding:14px 18px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px}
.dropdown-item:last-child{border-bottom:none}
.progress-bar{background:#111827;border-radius:8px;height:20px;overflow:hidden;border:1px solid #1F2937}
.progress-fill{height:100%;border-radius:8px;transition:width 0.5s ease}
</style>

<body>
<div id="app"></div>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ═══════════════════════════════════
// FIREBASE
// ═══════════════════════════════════
firebase.initializeApp({
  apiKey:"AIzaSyBa7GKMgliNEcEVYVIOy3_kpFV3y8HiExA",
  authDomain:"zakazky-bf19b.firebaseapp.com",
  projectId:"zakazky-bf19b",
  storageBucket:"zakazky-bf19b.firebasestorage.app",
  messagingSenderId:"649607449738",
  appId:"1:649607449738:web:bb9dcf92448c3078afb173"
});
const db = firebase.firestore();
let saveTimer = null;
let syncStatus = 'ok';

function saveToFirebase(data) {
  if(saveTimer) clearTimeout(saveTimer);
  syncStatus = 'saving';
  renderApp();
  saveTimer = setTimeout(()=>{
    db.collection('lupana').doc('data').set({payload: JSON.stringify(data)})
      .then(()=>{ syncStatus='ok'; renderApp(); })
      .catch(()=>{ syncStatus='error'; renderApp(); });
  }, 1500);
}

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
const APP_PASSWORD = "1155";
const KEY = "zakazky-pro-v1";

let appState = {
  authed: !!sessionStorage.getItem('lupana-auth'),
  page: 'list', // list|new|edit|detail
  subPage: null, // calendar|yearly|customers|archive|backup|nakup
  selId: null,
  tab: 'info',
  filterStatus: 'all',
  search: '',
  showMenu: false,
  selectedCard: null,
  showTimeLog: false,
  showMatForm: false,
  timeH:'', timeM:'', timeNote:'', timeDate: today(), timeCategory:'nakres', timeWorker:'ja',
  noteText:'',
  matName:'', matCost:'', matNote:'',
  nakupSelected:[],
  nakupChecked:{},
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  confirmDelete: null,
  smsModal: null,
  pwInput:'', pwError:false,
  data: loadData(),
};

function loadData(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {orders:[]}; }catch{ return {orders:[]}; }
}
function persist(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch{} }
function today(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// Listen to Firebase
db.collection('lupana').doc('data').onSnapshot(snap=>{
  if(snap.exists){
    const remote = snap.data().payload;
    if(remote){
      const parsed = JSON.parse(remote);
      appState.data = parsed;
      persist(parsed);
      renderApp();
    }
  }
});

function setState(patch){
  Object.assign(appState, patch);
  renderApp();
}

function setData(fn){
  const newData = fn(appState.data);
  appState.data = newData;
  persist(newData);
  saveToFirebase(newData);
  renderApp();
}

// ═══════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════
const STATUSES = [
  {key:'nacenena', label:'Naceněná', color:'#F59E0B', bg:'#292300', dot:'#F59E0B'},
  {key:'vo_vyrobe', label:'Vo výrobe', color:'#3B82F6', bg:'#0D1F3C', dot:'#3B82F6'},
  {key:'sklada_sa', label:'Skladá sa', color:'#8B5CF6', bg:'#1E0A3C', dot:'#8B5CF6'},
  {key:'pripravena', label:'Pripravená na montáž', color:'#F97316', bg:'#2C1000', dot:'#F97316'},
  {key:'hotova', label:'Hotovo', color:'#10B981', bg:'#052E1C', dot:'#10B981'},
  {key:'storno', label:'Storno', color:'#EF4444', bg:'#2D0A0A', dot:'#EF4444'},
];
const STATUS_FLOW = ['nacenena','vo_vyrobe','sklada_sa','pripravena','hotova'];
const ROZPRACOVANE = ['nacenena','vo_vyrobe','sklada_sa','pripravena'];

function statusOf(k){ return STATUSES.find(s=>s.key===k)||STATUSES[0]; }

function fmt(n){
  if(n===null||n===undefined||n==='') return '—';
  return new Intl.NumberFormat('sk-SK',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.round(n));
}
function fmtDate(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleDateString('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtMins(mins){
  const h=Math.floor(mins/60), m=mins%60;
  return h>0 ? `${h}h${m>0?' '+m+'m':''}` : `${m}m`;
}
function totalMins(o){ return (o.timeLog||[]).reduce((a,e)=>a+e.mins,0); }

// ═══════════════════════════════════
// ACTIONS
// ═══════════════════════════════════
function updateOrder(id, patch){
  setData(d=>({...d, orders: d.orders.map(o=>o.id===id?{...o,...patch,updatedAt:Date.now()}:o)}));
}

function saveOrder(form){
  const order = {...form, id:uid(), createdAt:Date.now(), updatedAt:Date.now(), timeLog:[], notes:[], materials:[]};
  setData(d=>({...d, orders:[order,...d.orders]}));
  setState({page:'list'});
}

function saveEdit(id, form){
  updateOrder(id, form);
  setState({page:'detail'});
}

function deleteOrderConfirmed(){
  const id = appState.confirmDelete;
  setData(d=>({...d, orders:d.orders.filter(o=>o.id!==id)}));
  setState({confirmDelete:null, page:'list'});
}

function archiveOrder(id){
  const o = appState.data.orders.find(x=>x.id===id);
  if(!o) return;
  let oz = o;
  setData(d=>({
    ...d,
    orders: d.orders.filter(x=>x.id!==id),
    archive:[{...oz, archivedAt:Date.now()}, ...(d.archive||[])],
  }));
  setState({page:'list'});
}

function setStatus(id, status){
  updateOrder(id,{status, [`statusHistory_${status}`]:Date.now()});
}

function nextStatus(o){
  const idx = STATUS_FLOW.indexOf(o.status);
  if(idx<0||idx>=STATUS_FLOW.length-1) return;
  const newStatus = STATUS_FLOW[idx+1];
  setStatus(o.id, newStatus);
  sendSmsNotification(o, newStatus);
}

function sendSmsNotification(o, newStatus){
  const phone = o.customerPhone;
  if(!phone) return;
  const meno = o.customerName ? o.customerName.split(' ')[0] : 'vážený zákazník';
  const nazov = o.title || 'zákazka';
  const messages = {
    vo_vyrobe:`Dobrý deň ${meno}, vaša zákazka "${nazov}" bola zaradená do výroby.`,
    sklada_sa:`Dobrý deň ${meno}, vaša zákazka "${nazov}" sa práve skladá.`,
    pripravena:`Dobrý deň ${meno}, vaša zákazka "${nazov}" je pripravená na montáž.`,
    hotova:`Dobrý deň ${meno}, vaša zákazka "${nazov}" je hotová a pripravená na odovzdanie!`,
  };
  const text = messages[newStatus];
  if(!text) return;
  const cleanPhone = phone.replace(/ /g,'');
  setState({smsModal:{phone, cleanPhone, text, newStatus}});
}

function logTime(){
  const h=parseInt(appState.timeH)||0, m=parseInt(appState.timeM)||0;
  const mins=h*60+m;
  if(mins<=0) return;
  const sel = appState.data.orders.find(o=>o.id===appState.selId);
  if(!sel) return;
  const entry={id:uid(),mins,note:appState.timeNote.trim(),category:appState.timeCategory,worker:appState.timeWorker,at:appState.timeDate?new Date(appState.timeDate).getTime():Date.now()};
  updateOrder(appState.selId,{timeLog:[entry,...(sel.timeLog||[])]});
  setState({timeH:'',timeM:'',timeNote:'',timeDate:today(),timeCategory:'nakres',timeWorker:'ja'});
}

function addNote(){
  if(!appState.noteText.trim()) return;
  const sel = appState.data.orders.find(o=>o.id===appState.selId);
  if(!sel) return;
  const note={id:uid(),text:appState.noteText.trim(),at:Date.now(),resolved:false};
  updateOrder(appState.selId,{notes:[note,...(sel.notes||[])]});
  setState({noteText:''});
}

function toggleNote(nid){
  const sel = appState.data.orders.find(o=>o.id===appState.selId);
  if(!sel) return;
  updateOrder(appState.selId,{notes:(sel.notes||[]).map(n=>n.id===nid?{...n,resolved:!n.resolved}:n)});
}

function addMaterial(){
  if(!appState.matName.trim()) return;
  const sel = appState.data.orders.find(o=>o.id===appState.selId);
  if(!sel) return;
  const mat={id:uid(),name:appState.matName.trim(),cost:parseFloat(appState.matCost)||0,note:appState.matNote.trim(),at:Date.now()};
  updateOrder(appState.selId,{materials:[mat,...(sel.materials||[])]});
  setState({matName:'',matCost:'',matNote:'',showMatForm:false});
}

function quickExport(){
  const json=JSON.stringify(appState.data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`lupana-zaloha-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  setData(d=>({...d,lastBackup:Date.now()}));
}

// ═══════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════
function el(tag, attrs, ...children){
  const e=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else if(k.startsWith('on')) e[k.toLowerCase()]=v;
    else if(k==='className') e.className=v;
    else if(k==='htmlFor') e.htmlFor=v;
    else e.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c===null||c===undefined||c===false) return;
    if(typeof c==='string'||typeof c==='number') e.appendChild(document.createTextNode(c));
    else if(c instanceof Node) e.appendChild(c);
  });
  return e;
}

function div(cls, ...children){ return el('div',{className:cls},...children); }
function span(cls,...children){ return el('span',{className:cls},...children); }
function btn(cls,text,onClick){ const b=el('button',{className:'btn '+cls},text); b.onclick=onClick; return b; }

// ═══════════════════════════════════
// PASSWORD SCREEN
// ═══════════════════════════════════
function renderPassword(){
  const wrap = el('div',{style:{minHeight:'100vh',background:'#030712',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px'}});
  const inner = el('div',{style:{width:'100%',maxWidth:'320px'}});
  const title = el('div',{style:{textAlign:'center',marginBottom:'32px'}});
  title.appendChild(el('div',{style:{fontSize:'28px',fontWeight:'700',color:'#F9FAFB',letterSpacing:'-1px'}},'LUPANA'));
  title.appendChild(el('div',{style:{color:'#4B5563',fontSize:'14px',marginTop:'4px'}},'Zadaj heslo pre prístup'));
  
  const input = el('input',{type:'password',placeholder:'Heslo',style:{marginBottom:'12px',background:'#111827',border:`1px solid ${appState.pwError?'#EF4444':'#1F2937'}`,borderRadius:'12px',color:'#F9FAFB',padding:'14px 16px',fontSize:'16px',width:'100%'}});
  input.value = appState.pwInput;
  input.oninput = e => appState.pwInput = e.target.value;
  
  const errMsg = el('div',{style:{color:'#EF4444',fontSize:'13px',textAlign:'center',marginBottom:'8px',display:appState.pwError?'block':'none'}},'Nesprávne heslo');
  
  const loginBtn = el('button',{style:{width:'100%',background:'#2563EB',border:'none',borderRadius:'12px',color:'#fff',fontWeight:'700',fontSize:'16px',padding:'14px 0',cursor:'pointer'}},'Vstúpiť');
  
  function tryLogin(){
    if(appState.pwInput===APP_PASSWORD){
      sessionStorage.setItem('lupana-auth','1');
      setState({authed:true,pwInput:''});
    } else {
      setState({pwError:true});
      setTimeout(()=>setState({pwError:false}),2000);
      appState.pwInput='';
      input.value='';
    }
  }
  loginBtn.onclick = tryLogin;
  input.onkeydown = e=>{ if(e.key==='Enter') tryLogin(); };
  
  inner.append(title,input,errMsg,loginBtn);
  wrap.appendChild(inner);
  return wrap;
}

// ═══════════════════════════════════
// TOPBAR
// ═══════════════════════════════════
function renderTopBar(title, backFn, rightEl){
  const bar = el('div',{className:'topbar'});
  if(backFn){
    const b = el('button',{className:'back-btn'},'← Späť');
    b.onclick=backFn;
    bar.appendChild(b);
  }
  bar.appendChild(el('span',{className:'topbar-title'},title));
  if(rightEl) bar.appendChild(rightEl);
  return bar;
}

// ═══════════════════════════════════
// FORM PAGE
// ═══════════════════════════════════
function renderForm(isEdit){
  const sel = isEdit ? appState.data.orders.find(o=>o.id===appState.selId) : null;
  let form = isEdit ? {...sel} : {
    customerName:'',customerPhone:'',customerEmail:'',customerNote:'',
    title:'',description:'',status:'nacenena',
    price:'',depositPaid:'',
    contactDate:today(),approvedDate:'',depositDate:'',deadlineDate:'',
    vyplatena:false,notes:[],materials:[],timeLog:[]
  };

  const frag = document.createDocumentFragment();
  const saveBtn = el('button',{className:'btn btn-primary',style:{padding:'8px 16px',fontSize:'14px',flexShrink:'0'}}, isEdit?'Uložiť':'Vytvoriť');
  
  frag.appendChild(renderTopBar(isEdit?'Upraviť zákazku':'Nová zákazka',
    ()=>setState({page:isEdit?'detail':'list'}), saveBtn));

  const scroll = el('div',{style:{padding:'16px 0',overflowY:'auto'}});

  function field(lbl, inp){
    const d=el('div',{className:'field'}); 
    d.appendChild(el('label',{},lbl));
    d.appendChild(inp);
    return d;
  }
  function section(icon,title,...fields){
    const s=el('div',{className:'section'});
    const t=el('div',{className:'section-title'},icon+' '+title);
    const b=el('div',{className:'section-body'});
    fields.forEach(f=>b.appendChild(f));
    s.append(t,b);
    return s;
  }
  function row2(...fields){
    const r=el('div',{className:'row2'});
    fields.forEach(f=>r.appendChild(f));
    return r;
  }
  function inp(key,placeholder,type='text'){
    const i=el('input',{type,placeholder});
    i.value=form[key]||'';
    i.oninput=e=>form[key]=e.target.value;
    return i;
  }
  function sel2(key,options){
    const s=el('select');
    options.forEach(([v,l])=>{
      const o=el('option',{value:v},l);
      if(form[key]===v) o.selected=true;
      s.appendChild(o);
    });
    s.onchange=e=>form[key]=e.target.value;
    return s;
  }
  function ta(key,placeholder,rows=3){
    const t=el('textarea',{placeholder,rows});
    t.value=form[key]||'';
    t.oninput=e=>form[key]=e.target.value;
    return t;
  }
  function dateField(key,label){
    const wrap=el('div',{className:'field',style:{flex:'1'}});
    wrap.appendChild(el('label',{},label));
    const row=el('div',{style:{display:'flex',alignItems:'center',gap:'4px'}});
    const i=el('input',{type:'date'});
    i.value=form[key]||'';
    i.oninput=e=>{ form[key]=e.target.value; refresh(); };
    const clr=el('button',{style:{background:'none',border:'none',color:'#6B7280',fontSize:'16px',padding:'4px',display:form[key]?'block':'none'}},'✕');
    clr.onclick=()=>{ form[key]=''; i.value=''; clr.style.display='none'; };
    row.append(i,clr);
    wrap.appendChild(row);
    return wrap;
  }

  function refresh(){
    scroll.innerHTML='';
    buildForm();
  }

  function buildForm(){
    scroll.appendChild(section('👤','Zákazník',
      row2(field('Meno zákazníka',inp('customerName','Ján Novák')), field('Telefón',inp('customerPhone','+421 900...'))),
      field('Email',inp('customerEmail','jan@email.sk','email')),
      field('Poznámka',ta('customerNote','Odkiaľ prišiel...',2))
    ));
    scroll.appendChild(section('📋','Zákazka',
      field('Názov zákazky',inp('title','napr. Kuchyňa na mieru')),
      field('Popis',ta('description','Detailný popis...',4)),
      field('Stav zákazky',sel2('status',STATUSES.map(s=>[s.key,s.label]))),
      row2(dateField('contactDate','Prvý kontakt'), dateField('approvedDate','Schválená ponuka')),
      row2(dateField('depositDate','Prijatá záloha (dátum)'), dateField('deadlineDate','Odovzdanie diela'))
    ));
    scroll.appendChild(section('💶','Financie',
      row2(field('Cena zákazky (€)',inp('price','0','number')), field('Prijatá záloha (€)',inp('depositPaid','0','number')))
    ));
  }

  buildForm();
  frag.appendChild(scroll);

  saveBtn.onclick=()=>{
    if(!form.title.trim()&&!form.customerName.trim()) return;
    if(isEdit) saveEdit(appState.selId, form);
    else saveOrder(form);
  };

  return frag;
}

// ═══════════════════════════════════
// DETAIL PAGE
// ═══════════════════════════════════
function renderDetail(){
  const sel = appState.data.orders.find(o=>o.id===appState.selId);
  if(!sel) { setState({page:'list'}); return document.createDocumentFragment(); }
  
  const st = statusOf(sel.status);
  const price=parseFloat(sel.price)||0;
  const deposit=parseFloat(sel.depositPaid)||0;
  const due=price-deposit;
  const mins=totalMins(sel);
  const totalMat=(sel.materials||[]).reduce((a,m)=>a+(m.cost||0),0);
  const profit=price>0?price-totalMat:null;
  const nextIdx=STATUS_FLOW.indexOf(sel.status);
  const canAdvance=nextIdx>=0&&nextIdx<STATUS_FLOW.length-1;

  const frag=document.createDocumentFragment();

  const editBtn=el('button',{style:{background:'#1F2937',border:'1px solid #374151',borderRadius:'8px',color:'#9CA3AF',fontWeight:'600',padding:'6px 14px',fontSize:'13px'}},'✎ Upraviť');
  editBtn.onclick=()=>{setState({page:'edit'})};

  frag.appendChild(renderTopBar(sel.title||sel.customerName, ()=>setState({page:'list'}), editBtn));

  // Status banner
  const banner=el('div',{style:{background:st.bg,borderBottom:`2px solid ${st.color}`,padding:'10px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px'}});
  const bannerLeft=el('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
  const dot=el('span',{style:{width:'10px',height:'10px',borderRadius:'50%',background:st.dot,display:'inline-block',boxShadow:`0 0 6px ${st.dot}`}});
  bannerLeft.append(dot, el('span',{style:{color:st.color,fontWeight:'700',fontSize:'14px',letterSpacing:'1px',textTransform:'uppercase'}},st.label));
  banner.appendChild(bannerLeft);
  if(canAdvance){
    const nextSt=statusOf(STATUS_FLOW[nextIdx+1]);
    const advBtn=el('button',{style:{background:'transparent',border:`1px solid ${nextSt.color}`,borderRadius:'8px',fontSize:'12px',fontWeight:'700',padding:'5px 12px',color:nextSt.color,cursor:'pointer'}},`→ ${nextSt.label}`);
    advBtn.onclick=()=>nextStatus(sel);
    banner.appendChild(advBtn);
  }
  frag.appendChild(banner);

  // Tabs
  const tabs=el('div',{className:'tabs'});
  ['info','finance','notes','materials','time','history'].forEach(k=>{
    const labels={info:'Info',finance:'Financie',notes:'Pozn.',materials:'Materiál',time:'Čas',history:'Log'};
    const t=el('button',{className:'tab'+(appState.tab===k?' active':'')},labels[k]);
    t.onclick=()=>setState({tab:k});
    tabs.appendChild(t);
  });
  frag.appendChild(tabs);

  const scroll=el('div',{style:{overflowY:'auto',paddingBottom:'40px'}});

  // ── INFO TAB ──
  if(appState.tab==='info'){
    // Customer card
    const custCard=el('div',{className:'info-card',style:{margin:'12px 16px'}});
    custCard.appendChild(el('div',{className:'info-card-title'},'👤 Zákazník'));
    function irow(lbl,val,big){
      const r=el('div',{className:'info-row'});
      r.appendChild(el('span',{className:'info-label'},lbl));
      const v=el('span',{className:'info-val'+(big?' big':'')});
      if(typeof val==='string') v.textContent=val;
      else v.appendChild(val);
      r.appendChild(v);
      return r;
    }
    custCard.appendChild(irow('Meno',sel.customerName||'—',true));
    if(sel.customerPhone){
      const a=el('a',{href:`tel:${sel.customerPhone}`,style:{color:'#3B82F6'}},sel.customerPhone);
      custCard.appendChild(irow('Telefón',a));
    } else { custCard.appendChild(irow('Telefón','—')); }
    if(sel.customerEmail){
      const a=el('a',{href:`mailto:${sel.customerEmail}`,style:{color:'#3B82F6'}},sel.customerEmail);
      custCard.appendChild(irow('Email',a));
    } else { custCard.appendChild(irow('Email','—')); }
    if(sel.customerNote) custCard.appendChild(irow('Poznámka',sel.customerNote));
    scroll.appendChild(custCard);

    // Zákazka card
    const zakCard=el('div',{className:'info-card',style:{margin:'12px 16px'}});
    zakCard.appendChild(el('div',{className:'info-card-title'},'📋 Zákazka'));
    zakCard.appendChild(irow('Názov',sel.title||'—',true));
    if(sel.description){
      const d=el('div',{style:{padding:'10px 16px',borderBottom:'1px solid #1a2234'}});
      d.appendChild(el('div',{style:{color:'#4B5563',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'4px'}},'Popis'));
      d.appendChild(el('div',{style:{color:'#D1D5DB',fontSize:'14px',lineHeight:'1.6'}},sel.description));
      zakCard.appendChild(d);
    }
    scroll.appendChild(zakCard);

    // Míľniky
    const milCard=el('div',{className:'info-card',style:{margin:'12px 16px'}});
    milCard.appendChild(el('div',{className:'info-card-title'},'📅 Priebeh zákazky'));
    const depositDate=sel.depositDate?new Date(sel.depositDate):null;
    const autoDeadline=depositDate?new Date(new Date(depositDate).setMonth(depositDate.getMonth()+2)):null;
    const deadlineDate=sel.deadlineDate?new Date(sel.deadlineDate):autoDeadline;
    const isAuto=!sel.deadlineDate&&!!autoDeadline;
    const isOverdue=deadlineDate&&deadlineDate<new Date()&&sel.status!=='hotova';
    const fmtD=d=>d?d.toLocaleDateString('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';

    function mrow(lbl,dateVal,color,extra){
      const r=el('div',{className:'info-row'});
      r.appendChild(el('span',{className:'info-label'},lbl));
      const v=el('span',{style:{color:color||'#9CA3AF',fontSize:'14px',textAlign:'right'}});
      v.textContent=fmtD(dateVal);
      if(extra){ v.appendChild(document.createTextNode(' ')); v.appendChild(extra); }
      r.appendChild(v);
      return r;
    }
    milCard.appendChild(mrow('Prvý kontakt', sel.contactDate?new Date(sel.contactDate):null, '#9CA3AF'));
    milCard.appendChild(mrow('Schválená ponuka', sel.approvedDate?new Date(sel.approvedDate):null, '#F59E0B'));
    const depRow=el('div',{className:'info-row'});
    depRow.appendChild(el('span',{className:'info-label'},'Prijatá záloha'));
    const depVal=el('span',{style:{color:'#3B82F6',fontSize:'14px',textAlign:'right'}});
    depVal.textContent=fmtD(depositDate);
    if(sel.depositPaid){ const s=el('span',{style:{color:'#F59E0B',fontWeight:'700',marginLeft:'6px'}},fmt(sel.depositPaid)); depVal.appendChild(s); }
    depRow.appendChild(depVal);
    milCard.appendChild(depRow);
    const dlBadges=[];
    if(isAuto){ const b=el('span',{style:{fontSize:'10px',background:'#1E3A5F',color:'#60A5FA',borderRadius:'4px',padding:'1px 5px',marginLeft:'4px'}},'auto'); dlBadges.push(b); }
    if(isOverdue){ const b=el('span',{style:{fontSize:'10px',background:'#3D0A0A',color:'#EF4444',borderRadius:'4px',padding:'1px 5px',marginLeft:'4px'}},'PO TERMÍNE'); dlBadges.push(b); }
    const dlFrag=document.createDocumentFragment();
    if(dlBadges.length){ dlBadges.forEach(b=>dlFrag.appendChild(b)); }
    milCard.appendChild(mrow('Odovzdanie diela',deadlineDate,isOverdue?'#EF4444':'#10B981',dlFrag.childNodes.length?dlFrag:null));
    scroll.appendChild(milCard);

    // Vyplatene button
    if(sel.status==='hotova'){
      const vwrap=el('div',{style:{margin:'0 16px 12px'}});
      const vbtn=el('button',{style:{width:'100%',borderRadius:'12px',border:'none',padding:'14px 0',fontWeight:'700',fontSize:'16px',cursor:'pointer',background:sel.vyplatena?'#052E1C':'#065F46',color:sel.vyplatena?'#6EE7B7':'#fff'}},sel.vyplatena?'✓ Vyplatené':'💰 Označiť ako vyplatené');
      vbtn.onclick=()=>updateOrder(sel.id,{vyplatena:!sel.vyplatena});
      vwrap.appendChild(vbtn);
      scroll.appendChild(vwrap);
    }

    // Archive button
    if(sel.status==='hotova'&&sel.vyplatena){
      const awrap=el('div',{style:{margin:'0 16px 12px'}});
      const abtn=el('button',{style:{width:'100%',borderRadius:'12px',border:'1px solid #374151',padding:'12px 0',fontWeight:'700',fontSize:'15px',cursor:'pointer',background:'#111827',color:'#9CA3AF'}},'📦 Presunúť do archívu');
      abtn.onclick=()=>archiveOrder(sel.id);
      awrap.appendChild(abtn);
      scroll.appendChild(awrap);
    }

    // Danger buttons
    const dbwrap=el('div',{style:{padding:'0 16px 16px',display:'flex',gap:'8px'}});
    const delBtn=el('button',{className:'btn btn-danger'},'🗑 Vymazať zákazku');
    delBtn.onclick=()=>setState({confirmDelete:sel.id});
    dbwrap.appendChild(delBtn);
    if(sel.status!=='storno'){
      const sBtn=el('button',{className:'btn btn-danger',style:{background:'#1F0505',color:'#EF4444',borderColor:'#3D0A0A'}},'✕ Storno');
      sBtn.onclick=()=>setStatus(sel.id,'storno');
      dbwrap.appendChild(sBtn);
    }
    scroll.appendChild(dbwrap);
  }

  // ── FINANCE TAB ──
  if(appState.tab==='finance'){
    const fc=el('div',{className:'info-card',style:{margin:'12px 16px'}});
    fc.appendChild(el('div',{className:'info-card-title'},'💶 Financie'));
    function frow(lbl,val,color,big){
      const r=el('div',{className:'info-row'});
      r.appendChild(el('span',{className:'info-label'},lbl));
      const v=el('span',{style:{color:color||'#9CA3AF',fontWeight:big?'700':'400',fontSize:big?'18px':'14px',textAlign:'right'}},val);
      r.appendChild(v);
      return r;
    }
    fc.appendChild(frow('Cena zákazky',price>0?fmt(price):'—','#10B981',true));
    fc.appendChild(frow('Prijatá záloha',deposit>0?fmt(deposit):'—','#F59E0B'));
    fc.appendChild(frow('Zostatok na doplatenie',price>0?fmt(due):'—',due>0?'#EF4444':'#10B981',true));
    scroll.appendChild(fc);
    if(price>0&&deposit>0){
      const pw=el('div',{style:{margin:'0 16px 16px'}});
      pw.appendChild(el('div',{style:{fontSize:'12px',color:'#6B7280',marginBottom:'6px'}},'Uhradené'));
      const pb=el('div',{className:'progress-bar'});
      const pf=el('div',{className:'progress-fill',style:{width:`${Math.min(100,(deposit/price)*100)}%`,background:deposit>=price?'#10B981':'#F59E0B'}});
      pb.appendChild(pf);
      pw.appendChild(pb);
      pw.appendChild(el('div',{style:{fontSize:'12px',color:'#6B7280',marginTop:'4px',textAlign:'right'}},`${Math.round((deposit/price)*100)}% uhradené`));
      scroll.appendChild(pw);
    }
  }

  // ── NOTES TAB ──
  if(appState.tab==='notes'){
    const nwrap=el('div',{style:{padding:'12px 16px 8px',display:'flex',gap:'8px'}});
    const ni=el('input',{type:'text',placeholder:'Napíš poznámku alebo zmenu...',style:{flex:'1'}});
    ni.value=appState.noteText;
    ni.oninput=e=>appState.noteText=e.target.value;
    ni.onkeydown=e=>{ if(e.key==='Enter') addNote(); };
    const nadd=el('button',{style:{background:'#2563EB',border:'none',borderRadius:'8px',color:'#fff',fontWeight:'700',padding:'10px 16px',cursor:'pointer'}},'+');
    nadd.onclick=addNote;
    nwrap.append(ni,nadd);
    scroll.appendChild(nwrap);

    const notes=sel.notes||[];
    if(!notes.length) scroll.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'40px'}},'Zatiaľ žiadne poznámky'));
    notes.forEach(n=>{
      const nc=el('div',{className:'note-card'});
      const cb=el('div',{className:'checkbox'+(n.resolved?' checked':'')});
      if(n.resolved) cb.appendChild(el('span',{style:{color:'#fff',fontSize:'12px',fontWeight:'700'}},'✓'));
      cb.onclick=()=>toggleNote(n.id);
      const nd=el('div',{style:{flex:'1'}});
      nd.appendChild(el('div',{style:{color:n.resolved?'#4B5563':'#F9FAFB',fontSize:'14px',lineHeight:'1.6',textDecoration:n.resolved?'line-through':'none'}},n.text));
      nd.appendChild(el('div',{style:{color:'#374151',fontSize:'11px',marginTop:'4px'}},fmtDate(n.at)));
      const db=el('button',{className:'del-btn'},'✕');
      db.onclick=()=>{ updateOrder(sel.id,{notes:(sel.notes||[]).filter(x=>x.id!==n.id)}); };
      nc.append(cb,nd,db);
      scroll.appendChild(nc);
    });
  }

  // ── MATERIALS TAB ──
  if(appState.tab==='materials'){
    const mhdr=el('div',{style:{padding:'12px 16px 8px',display:'flex',justifyContent:'space-between',alignItems:'center'}});
    const mleft=el('div');
    mleft.appendChild(el('div',{style:{color:'#9CA3AF',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px'}},'Náklady'));
    mleft.appendChild(el('div',{style:{color:'#EF4444',fontWeight:'700',fontSize:'26px'}},totalMat>0?fmt(totalMat):'0 €'));
    const mright=el('div',{style:{textAlign:'right'}});
    mright.appendChild(el('div',{style:{color:'#9CA3AF',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px'}},'Zisk'));
    mright.appendChild(el('div',{style:{color:profit>0?'#10B981':profit<0?'#EF4444':'#4B5563',fontWeight:'700',fontSize:'26px'}},profit!==null?fmt(profit):'—'));
    mhdr.append(mleft,mright);
    scroll.appendChild(mhdr);

    if(price>0&&totalMat>0){
      const pw=el('div',{style:{margin:'0 16px 12px'}});
      const pb=el('div',{className:'progress-bar',style:{display:'flex'}});
      pb.appendChild(el('div',{style:{width:`${Math.min(100,(totalMat/price)*100)}%`,background:'#EF4444',borderRadius:'8px 0 0 8px'}}));
      pb.appendChild(el('div',{style:{flex:'1',background:'#10B981',borderRadius:'0 8px 8px 0'}}));
      pw.appendChild(pb);
      const pl=el('div',{style:{display:'flex',justifyContent:'space-between',marginTop:'4px',fontSize:'11px'}});
      pl.appendChild(el('span',{style:{color:'#EF4444'}},`Materiál ${Math.round((totalMat/price)*100)}%`));
      pl.appendChild(el('span',{style:{color:'#10B981'}},`Zisk ${Math.round(((price-totalMat)/price)*100)}%`));
      pw.appendChild(pl);
      scroll.appendChild(pw);
    }

    const mlist=el('div',{style:{padding:'0 16px'}});
    if(!appState.showMatForm){
      const madd=el('button',{style:{background:'#1E3A5F',border:'1px solid #2563EB',borderRadius:'8px',color:'#60A5FA',fontSize:'13px',fontWeight:'700',padding:'8px 14px',marginBottom:'8px',width:'100%',cursor:'pointer'}},'+ Pridať položku');
      madd.onclick=()=>setState({showMatForm:true});
      mlist.appendChild(madd);
    } else {
      const lb=el('div',{className:'log-box'});
      const r1=el('div',{style:{display:'flex',gap:'8px',marginBottom:'8px'}});
      const mn=el('input',{type:'text',placeholder:'Názov materiálu',style:{flex:'2'}});
      mn.value=appState.matName;
      mn.oninput=e=>appState.matName=e.target.value;
      const mc=el('input',{type:'number',placeholder:'€',style:{flex:'1',minWidth:'0'}});
      mc.value=appState.matCost;
      mc.oninput=e=>appState.matCost=e.target.value;
      r1.append(mn,mc);
      const mno=el('textarea',{placeholder:'Poznámka (nepovinné)',rows:'2',style:{marginBottom:'8px'}});
      mno.value=appState.matNote;
      mno.oninput=e=>appState.matNote=e.target.value;
      const r2=el('div',{style:{display:'flex',gap:'8px'}});
      const madd2=el('button',{style:{flex:'1',background:'#2563EB',border:'none',borderRadius:'8px',color:'#fff',fontWeight:'700',padding:'10px',cursor:'pointer'}},'✓ Pridať');
      madd2.onclick=addMaterial;
      const mcan=el('button',{style:{background:'none',border:'1px solid #1F2937',borderRadius:'8px',color:'#6B7280',padding:'10px 14px',cursor:'pointer'}},'Zrušiť');
      mcan.onclick=()=>setState({showMatForm:false});
      r2.append(madd2,mcan);
      lb.append(r1,mno,r2);
      mlist.appendChild(lb);
    }

    const mats=sel.materials||[];
    if(!mats.length&&!appState.showMatForm) mlist.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'30px'}},'Zatiaľ žiadny materiál'));
    mats.forEach(m=>{
      const mr=el('div',{style:{padding:'10px 0',borderBottom:'1px solid #111827'}});
      const mr1=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
      mr1.appendChild(el('span',{style:{color:'#D1D5DB',fontSize:'14px',fontWeight:'600'}},m.name));
      const mr1r=el('div',{style:{display:'flex',alignItems:'center',gap:'12px'}});
      mr1r.appendChild(el('span',{style:{color:'#EF4444',fontWeight:'700'}},fmt(m.cost)));
      const db=el('button',{className:'del-btn'},'✕');
      db.onclick=()=>updateOrder(sel.id,{materials:(sel.materials||[]).filter(x=>x.id!==m.id)});
      mr1r.appendChild(db);
      mr1.appendChild(mr1r);
      mr.appendChild(mr1);
      if(m.note) mr.appendChild(el('div',{style:{color:'#6B7280',fontSize:'12px',marginTop:'3px'}},m.note));
      mlist.appendChild(mr);
    });
    scroll.appendChild(mlist);
  }

  // ── TIME TAB ──
  if(appState.tab==='time'){
    const thdr=el('div',{style:{padding:'16px 16px 8px',display:'flex',justifyContent:'space-between',alignItems:'center'}});
    const tleft=el('div');
    tleft.appendChild(el('div',{style:{color:'#9CA3AF',fontSize:'12px',textTransform:'uppercase',letterSpacing:'1px'}},'Celkový čas'));
    tleft.appendChild(el('div',{style:{color:'#F9FAFB',fontWeight:'700',fontSize:'28px',fontVariantNumeric:'tabular-nums'}},mins>0?fmtMins(mins):'0m'));
    const tadd=el('button',{style:{background:'#1E3A5F',border:'1px solid #2563EB',borderRadius:'8px',color:'#60A5FA',fontSize:'13px',fontWeight:'700',padding:'8px 14px',cursor:'pointer'}},appState.showTimeLog?'✕ Zavrieť':'+ Pridať čas');
    tadd.onclick=()=>setState({showTimeLog:!appState.showTimeLog});
    thdr.append(tleft,tadd);
    scroll.appendChild(thdr);

    // Category breakdown
    const CAT_META=[{key:'nakres',label:'📐 Nákres',color:'#8B5CF6'},{key:'skladanie',label:'🔧 Skladanie',color:'#F59E0B'},{key:'montaz',label:'🏗 Montáž',color:'#10B981'},{key:'ine',label:'📌 Iné',color:'#6B7280'}];
    const byCat=CAT_META.map(c=>({...c,mins:(sel.timeLog||[]).filter(e=>(e.category||'ine')===c.key).reduce((a,e)=>a+e.mins,0)})).filter(c=>c.mins>0);
    if(byCat.length){
      const cw=el('div',{style:{margin:'0 16px 12px',display:'flex',gap:'6px',flexWrap:'wrap'}});
      byCat.forEach(c=>{
        const cb=el('div',{style:{flex:'1',minWidth:'80px',background:c.color+'15',border:`1px solid ${c.color}33`,borderRadius:'8px',padding:'8px 10px',textAlign:'center'}});
        cb.appendChild(el('div',{style:{color:c.color,fontWeight:'700',fontSize:'15px'}},fmtMins(c.mins)));
        cb.appendChild(el('div',{style:{color:c.color+'aa',fontSize:'11px',marginTop:'2px'}},c.label));
        cw.appendChild(cb);
      });
      scroll.appendChild(cw);
    }

    if(appState.showTimeLog){
      const tlb=el('div',{className:'log-box'});
      // Category buttons
      tlb.appendChild(el('div',{style:{color:'#6B7280',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px'}},'Typ práce'));
      const catRow=el('div',{style:{display:'flex',gap:'6px',marginBottom:'10px'}});
      CAT_META.forEach(cat=>{
        const active=appState.timeCategory===cat.key;
        const cb=el('button',{style:{flex:'1',padding:'8px 4px',borderRadius:'8px',border:`1px solid ${active?cat.color:'#1F2937'}`,background:active?cat.color+'22':'#030712',color:active?cat.color:'#4B5563',fontSize:'11px',fontWeight:'700',cursor:'pointer',whiteSpace:'nowrap'}},cat.label);
        cb.onclick=()=>setState({timeCategory:cat.key});
        catRow.appendChild(cb);
      });
      tlb.appendChild(catRow);

      // Time inputs
      const tr=el('div',{style:{display:'flex',gap:'8px',marginBottom:'10px'}});
      const tleft2=el('div',{style:{flex:'1'}});
      tleft2.appendChild(el('div',{style:{color:'#6B7280',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'6px'}},'Hodiny / Minúty'));
      const tinr=el('div',{style:{display:'flex',gap:'6px',alignItems:'center'}});
      const th=el('input',{type:'number',min:'0',style:{width:'64px',textAlign:'center'}});
      th.value=appState.timeH;
      th.oninput=e=>appState.timeH=e.target.value;
      const tm=el('input',{type:'number',min:'0',max:'59',style:{width:'64px',textAlign:'center'}});
      tm.value=appState.timeM;
      tm.oninput=e=>appState.timeM=e.target.value;
      tinr.append(th,el('span',{style:{color:'#4B5563',fontWeight:'700'}},'h'),tm,el('span',{style:{color:'#4B5563',fontWeight:'700'}},'m'));
      tleft2.appendChild(tinr);
      const tright=el('div',{style:{flex:'1'}});
      tright.appendChild(el('div',{style:{color:'#6B7280',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'6px'}},'Dátum práce'));
      const td=el('input',{type:'date'});
      td.value=appState.timeDate;
      td.oninput=e=>appState.timeDate=e.target.value;
      tright.appendChild(td);
      tr.append(tleft2,tright);
      tlb.appendChild(tr);

      const tn=el('input',{type:'text',placeholder:'Poznámka (nepovinné)',style:{marginBottom:'8px'}});
      tn.value=appState.timeNote;
      tn.oninput=e=>appState.timeNote=e.target.value;
      tlb.appendChild(tn);

      tlb.appendChild(el('div',{style:{color:'#6B7280',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'6px'}},'Kto pracoval'));
      const wrow=el('div',{style:{display:'flex',gap:'6px',marginBottom:'10px'}});
      ['ja','pomocník','externý'].forEach(w=>{
        const active=appState.timeWorker===w;
        const wb=el('button',{style:{flex:'1',padding:'7px 4px',borderRadius:'8px',fontSize:'11px',fontWeight:'700',cursor:'pointer',border:`1px solid ${active?'#3B82F6':'#1F2937'}`,background:active?'#1E3A5F':'#030712',color:active?'#60A5FA':'#4B5563'}},w);
        wb.onclick=()=>setState({timeWorker:w});
        wrow.appendChild(wb);
      });
      tlb.appendChild(wrow);

      const tbr=el('div',{style:{display:'flex',gap:'8px'}});
      const tadd2=el('button',{style:{flex:'1',background:'#2563EB',border:'none',borderRadius:'8px',color:'#fff',fontWeight:'700',padding:'10px',cursor:'pointer'}},'✓ Pridať záznam');
      tadd2.onclick=logTime;
      const tcan=el('button',{style:{background:'none',border:'1px solid #1F2937',borderRadius:'8px',color:'#6B7280',padding:'10px 14px',cursor:'pointer'}},'Zrušiť');
      tcan.onclick=()=>setState({showTimeLog:false});
      tbr.append(tadd2,tcan);
      tlb.appendChild(tbr);
      scroll.appendChild(tlb);
    }

    const tlog=sel.timeLog||[];
    if(!tlog.length) scroll.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'40px'}},'Zatiaľ žiadne záznamy'));
    const CAT={nakres:{label:'Nákres',color:'#8B5CF6'},skladanie:{label:'Skladanie',color:'#F59E0B'},montaz:{label:'Montáž',color:'#10B981'},ine:{label:'Iné',color:'#6B7280'}};
    const tlistWrap=el('div',{style:{padding:'0 16px'}});
    tlog.forEach(e=>{
      const cat=CAT[e.category]||CAT.ine;
      const te=el('div',{className:'time-entry'});
      const td2=el('div',{style:{flex:'1'}});
      const tr2=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}});
      tr2.appendChild(el('span',{style:{fontSize:'11px',fontWeight:'700',padding:'2px 8px',borderRadius:'20px',background:cat.color+'22',color:cat.color,border:`1px solid ${cat.color}44`}},cat.label));
      tr2.appendChild(el('span',{style:{color:'#F9FAFB',fontWeight:'700'}},fmtMins(e.mins)));
      if(e.worker&&e.worker!=='ja') tr2.appendChild(el('span',{style:{fontSize:'11px',background:'#1E3A5F',color:'#60A5FA',borderRadius:'10px',padding:'1px 7px'}},e.worker));
      td2.appendChild(tr2);
      if(e.note) td2.appendChild(el('div',{style:{color:'#6B7280',fontSize:'13px'}},e.note));
      td2.appendChild(el('div',{style:{color:'#374151',fontSize:'12px',marginTop:'2px'}},fmtDate(e.at)));
      const db=el('button',{className:'del-btn'},'✕');
      db.onclick=()=>updateOrder(sel.id,{timeLog:(sel.timeLog||[]).filter(x=>x.id!==e.id)});
      te.append(td2,db);
      tlistWrap.appendChild(te);
    });
    scroll.appendChild(tlistWrap);
  }

  // ── HISTORY TAB ──
  if(appState.tab==='history'){
    const hc=el('div',{className:'info-card',style:{margin:'12px 16px'}});
    hc.appendChild(el('div',{className:'info-card-title'},'📜 História zmien'));
    STATUSES.filter(s=>sel[`statusHistory_${s.key}`]).forEach(s=>{
      const r=el('div',{className:'info-row'});
      const lbl=el('span',{style:{color:s.color,fontSize:'13px'}},`● ${s.label}`);
      r.append(lbl,el('span',{style:{color:'#9CA3AF',fontSize:'14px'}},fmtDate(sel[`statusHistory_${s.key}`])));
      hc.appendChild(r);
    });
    function hr2(lbl,val){
      const r=el('div',{className:'info-row'});
      r.append(el('span',{className:'info-label'},lbl),el('span',{style:{color:'#6B7280',fontSize:'14px'}},val));
      return r;
    }
    hc.appendChild(hr2('Vytvorená',fmtDate(sel.createdAt)));
    hc.appendChild(hr2('Posledná zmena',fmtDate(sel.updatedAt)));
    scroll.appendChild(hc);
  }

  frag.appendChild(scroll);
  return frag;
}

// LIST PAGE
// ═══════════════════════════════════
function renderList(){
  const {data,filterStatus,search,selectedCard,showMenu} = appState;
  const orders = data.orders||[];
  
  const totalPrice=orders.reduce((s,o)=>s+(parseFloat(o.price)||0),0);
  const totalDeposit=orders.reduce((s,o)=>s+(parseFloat(o.depositPaid)||0),0);
  const totalDue=totalPrice-totalDeposit;
  const totalMat=orders.reduce((s,o)=>s+(o.materials||[]).reduce((a,m)=>a+(m.cost||0),0),0);

  const filtered = orders.filter(o=>{
    const match = filterStatus==='all'?true:filterStatus==='rozpracovane'?ROZPRACOVANE.includes(o.status):o.status==='hotova';
    const q=search.toLowerCase();
    const ms=!q||(o.customerName||'').toLowerCase().includes(q)||(o.title||'').toLowerCase().includes(q)||(o.customerPhone||'').includes(q);
    return match&&ms;
  }).sort((a,b)=>b.createdAt-a.createdAt);

  const frag=document.createDocumentFragment();

  // HEADER
  const hdr=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'20px 16px 12px'}});
  const hleft=el('div',{style:{position:'relative'}});
  
  const appNameRow=el('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
  const appNameBtn=el('button',{style:{background:'none',border:'none',color:'#F9FAFB',fontSize:'20px',fontWeight:'700',letterSpacing:'-1px',cursor:'pointer',padding:'0'}});
  appNameBtn.textContent=`LUPANA ${showMenu?'▲':'▼'}`;
  appNameBtn.onclick=e=>{ e.stopPropagation(); setState({showMenu:!showMenu}); };
  
  const syncDot=el('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:syncStatus==='ok'?'#10B981':syncStatus==='saving'?'F59E0B':'#EF4444',flexShrink:'0'}});
  appNameRow.append(appNameBtn,syncDot);
  hleft.appendChild(appNameRow);
  hleft.appendChild(el('div',{style:{color:'#4B5563',fontSize:'12px'}},`${orders.length} zákaziek celkovo`));

  if(showMenu){
    const dd=el('div',{className:'dropdown'});
    [['👥','Zákazníci','customers'],['📊','Ročný prehľad','yearly'],['📅','Kalendár','calendar'],['📦','Archív','archive'],['🛒','Nákupný zoznam','nakup'],['💾','Zálohovanie dát','backup']].forEach(([icon,label,key])=>{
      const item=el('button',{className:'dropdown-item'});
      item.append(el('span',{style:{fontSize:'18px'}},icon),label);
      item.onclick=()=>setState({subPage:key,showMenu:false});
      dd.appendChild(item);
    });
    hleft.appendChild(dd);
    // Close on outside click
    setTimeout(()=>{ document.addEventListener('click',()=>setState({showMenu:false}),{once:true}); },0);
  }

  hdr.appendChild(hleft);
  const newBtn=el('button',{className:'btn btn-primary',style:{padding:'10px 18px',fontSize:'14px',borderRadius:'10px'}},'+  Nová');
  newBtn.onclick=()=>setState({page:'new'});
  hdr.appendChild(newBtn);
  frag.appendChild(hdr);

  // BACKUP REMINDER
  const lastBackup=data.lastBackup;
  const oneWeek=7*24*60*60*1000;
  if(!lastBackup||(Date.now()-lastBackup>oneWeek)){
    const daysAgo=lastBackup?Math.floor((Date.now()-lastBackup)/(24*60*60*1000)):null;
    const brem=el('div',{style:{margin:'0 16px 12px',background:'#1C1400',border:'1px solid #78350F',borderRadius:'12px',padding:'12px 14px',display:'flex',alignItems:'center',gap:'10px'}});
    brem.appendChild(el('span',{style:{fontSize:'20px'}},'💾'));
    const bt=el('div',{style:{flex:'1'}});
    bt.appendChild(el('div',{style:{color:'#F59E0B',fontWeight:'700',fontSize:'13px'}},lastBackup?`Záloha pred ${daysAgo} dňami`:'Zatiaľ bez zálohy'));
    bt.appendChild(el('div',{style:{color:'#92400E',fontSize:'12px'}},'Odporúčame zálohovať raz týždenne'));
    brem.appendChild(bt);
    const zb=el('button',{style:{background:'#F59E0B',border:'none',borderRadius:'8px',color:'#000',fontWeight:'700',fontSize:'12px',padding:'8px 12px',cursor:'pointer',whiteSpace:'nowrap'}},'⬇️ Záloha');
    zb.onclick=quickExport;
    brem.appendChild(zb);
    frag.appendChild(brem);
  }

  // SUMMARY
  const sg=el('div',{className:'summary-grid'});
  function scard(lbl,val,color){
    const c=el('div',{className:'summary-card'});
    c.appendChild(el('div',{className:'lbl'},lbl));
    c.appendChild(el('div',{className:'val',style:{color}},String(val)));
    return c;
  }
  sg.append(scard('Celkový objem',fmt(totalPrice),'#3B82F6'),scard('Prijaté zálohy',fmt(totalDeposit),'#F59E0B'),scard('Doplatok celkový',fmt(totalDue>0?totalDue:0),totalDue>0?'#EF4444':'#10B981'),scard('Počet zákaziek',`${orders.length} ks`,'#8B5CF6'));
  frag.appendChild(sg);

  // FILTER PILLS
  const pr=el('div',{className:'pill-row'});
  [{key:'all',label:'Všetky',count:orders.length,color:'#3B82F6',bg:'#1E3A5F'},{key:'rozpracovane',label:'Rozpracované',count:orders.filter(o=>ROZPRACOVANE.includes(o.status)).length,color:'#F59E0B',bg:'#292300'},{key:'hotova',label:'Hotové',count:orders.filter(o=>o.status==='hotova').length,color:'#10B981',bg:'#052E1C'}].forEach(f=>{
    const active=filterStatus===f.key;
    const p=el('button',{className:'pill'+(active?' active':''),style:active?{background:f.bg,color:f.color,borderColor:f.color}:{}});
    const dot=el('span',{style:{width:'6px',height:'6px',borderRadius:'50%',background:active?f.color:'#4B5563',display:'inline-block',marginRight:'4px'}});
    p.append(dot,`${f.label} (${f.count})`);
    p.onclick=()=>setState({filterStatus:f.key});
    pr.appendChild(p);
  });
  frag.appendChild(pr);

  // SEARCH
  const sw=el('div',{style:{padding:'0 16px 8px'}});
  const si=el('input',{type:'text',placeholder:'🔍  Hľadať podľa zákazníka alebo názvu...',style:{width:'100%'}});
  si.value=search;
  si.oninput=e=>setState({search:e.target.value});
  sw.appendChild(si);
  frag.appendChild(sw);

  // ORDER LIST
  const ol=el('div',{style:{padding:'4px 16px'}});
  if(!filtered.length){
    const emp=el('div',{style:{textAlign:'center',color:'#374151',padding:'60px 20px'}});
    emp.appendChild(el('div',{style:{fontSize:'48px',marginBottom:'12px'}},'📂'));
    emp.appendChild(el('div',{style:{fontSize:'16px',color:'#4B5563',marginBottom:'16px'}},'Žiadne zákazky'));
    const ab=el('button',{className:'btn btn-primary',style:{borderRadius:'10px',padding:'10px 18px'}},'+  Pridať prvú zákazku');
    ab.onclick=()=>setState({page:'new'});
    emp.appendChild(ab);
    ol.appendChild(emp);
  }

  filtered.forEach(o=>{
    const st=statusOf(o.status);
    const price=parseFloat(o.price)||0;
    const deposit=parseFloat(o.depositPaid)||0;
    const due=price-deposit;
    const mins=totalMins(o);
    const depositDate=o.depositDate?new Date(o.depositDate):null;
    const deadlineDate=o.deadlineDate?new Date(o.deadlineDate):depositDate?new Date(new Date(depositDate).setMonth(depositDate.getMonth()+2)):null;
    const isAuto=!o.deadlineDate&&!!depositDate;
    const isOverdue=deadlineDate&&deadlineDate<new Date()&&o.status!=='storno';
    const selected=selectedCard===o.id;
    const unresolved=(o.notes||[]).filter(n=>!n.resolved).length;

    const card=el('div',{className:'card'+(selected?' selected':''),style:{borderLeft:`3px solid ${selected?st.color:'#1F2937'}`}});
    card.onclick=()=>setState({selectedCard:selected?null:o.id});

    // Row 1
    const r1=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'6px'}});
    const r1l=el('div',{style:{flex:'1'}});
    const nameRow=el('div',{style:{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}});
    nameRow.appendChild(el('span',{style:{color:'#F9FAFB',fontWeight:'700',fontSize:'16px'}},o.customerName||'Bez mena'));
    if(isOverdue) nameRow.appendChild(el('span',{style:{fontSize:'10px',background:'#3D0A0A',color:'#EF4444',borderRadius:'4px',padding:'1px 6px'}},'PO TERMÍNE'));
    r1l.appendChild(nameRow);
    r1l.appendChild(el('div',{style:{color:'#6B7280',fontSize:'13px',marginTop:'2px'}},o.title||'—'));
    const r1r=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'3px',marginLeft:'8px'}});
    const stRow=el('div',{style:{display:'flex',alignItems:'center',gap:'5px'}});
    stRow.append(el('span',{style:{width:'7px',height:'7px',borderRadius:'50%',background:selected?st.dot:'#374151',flexShrink:'0'}}),el('span',{style:{color:selected?st.color:'#6B7280',fontSize:'12px',fontWeight:'600',whiteSpace:'nowrap'}},st.label));
    r1r.appendChild(stRow);
    if(o.status==='hotova'){
      r1r.appendChild(el('span',{style:{fontSize:'10px',fontWeight:'700',padding:'1px 7px',borderRadius:'10px',background:o.vyplatena?'#052E1C':'#1F0505',color:o.vyplatena?'#6EE7B7':'#EF4444',border:`1px solid ${o.vyplatena?'#065F46':'#3D0A0A'}`}},o.vyplatena?'✓ Vyplatené':'Nevyplatené'));
    }
    r1.append(r1l,r1r);
    card.appendChild(r1);

    // Row 2 - financie
    const r2=el('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap',alignItems:'center'}});
    if(price>0){
      const pd=el('div',{style:{display:'flex',flexDirection:'column'}});
      pd.append(el('span',{style:{color:'#9CA3AF',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.5px'}},'cena'),el('span',{style:{color:selected?'#10B981':'#9CA3AF',fontWeight:'700',fontSize:'16px'}},fmt(price)));
      r2.appendChild(pd);
    }
    if(deposit>0){
      const zd=el('div',{style:{display:'flex',flexDirection:'column'}});
      zd.append(el('span',{style:{color:'#9CA3AF',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.5px'}},'záloha'),el('span',{style:{color:selected?'#F59E0B':'#6B7280',fontWeight:'700',fontSize:'16px'}},fmt(deposit)));
      r2.appendChild(zd);
    }
    if(price>0){
      const dd2=el('div',{style:{display:'flex',flexDirection:'column',background:selected?(due>0?'#1F0505':'#052E1C'):'#161B22',borderRadius:'8px',padding:'4px 10px',border:`1px solid ${selected?(due>0?'#3D0A0A':'#065F46'):'#1F2937'}`}});
      dd2.append(el('span',{style:{color:'#4B5563',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.5px'}},'doplatok'),el('span',{style:{color:selected?(due>0?'#EF4444':'#10B981'):'#6B7280',fontSize:'16px',fontWeight:'700'}},fmt(due>=0?due:0)));
      r2.appendChild(dd2);
    } else {
      const dd3=el('div',{style:{display:'flex',flexDirection:'column',background:'#161B22',borderRadius:'8px',padding:'4px 10px',border:'1px solid #1F2937'}});
      dd3.append(el('span',{style:{color:'#4B5563',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.5px'}},'doplatok'),el('span',{style:{color:'#374151',fontSize:'14px',fontWeight:'600'}},'—'));
      r2.appendChild(dd3);
    }
    if(mins>0) r2.appendChild(el('div',{style:{marginLeft:'auto',color:'#4B5563',fontSize:'12px'}},`⏱ ${fmtMins(mins)}`));
    if(deadlineDate){
      const dlSpan=el('div',{style:{color:isOverdue?'#EF4444':'#4B5563',fontSize:'12px'}});
      dlSpan.textContent=`📅 ${deadlineDate.toLocaleDateString('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'})}`;
      if(isAuto){ dlSpan.appendChild(el('span',{style:{color:'#1D4ED8',marginLeft:'4px'}},'(auto)')); }
      r2.appendChild(dlSpan);
    }
    card.appendChild(r2);

    // Action bar
    const ab2=el('div',{className:'action-bar'});
    const nextIdx=STATUS_FLOW.indexOf(o.status);
    if(nextIdx>=0&&nextIdx<STATUS_FLOW.length-1){
      const nextSt=statusOf(STATUS_FLOW[nextIdx+1]);
      const qb=el('button',{style:{background:'none',border:'1px solid #1F2937',borderRadius:'6px',color:'#4B5563',fontSize:'12px',padding:'4px 10px',cursor:'pointer',flex:'1'}},`→ ${nextSt.label}`);
      qb.onclick=e=>{ e.stopPropagation(); nextStatus(o); };
      ab2.appendChild(qb);
    }
    ab2.appendChild(el('div',{style:{flex:'1'}}));

    // Note btn with badge
    const nb=el('button',{className:'icon-btn',style:{background:unresolved>0?'#2D0A0A':'#1a2234',borderColor:unresolved>0?'#7F1D1D':'#1F2937',color:unresolved>0?'#EF4444':'#6B7280',cursor:'pointer'}},'📝');
    if(unresolved>0){ const badge=el('span',{className:'badge'},String(unresolved)); nb.appendChild(badge); }
    nb.onclick=e=>{ e.stopPropagation(); setState({selId:o.id,tab:'notes',page:'detail'}); };

    const matb=el('button',{className:'icon-btn',style:{cursor:'pointer'}},'🧱');
    matb.onclick=e=>{ e.stopPropagation(); setState({selId:o.id,tab:'materials',showMatForm:true,page:'detail'}); };

    const timeb=el('button',{className:'icon-btn',style:{cursor:'pointer'}},'⏱');
    timeb.onclick=e=>{ e.stopPropagation(); setState({selId:o.id,tab:'time',showTimeLog:true,page:'detail'}); };

    const editb=el('button',{className:'icon-btn',style:{cursor:'pointer'}},'✏️');
    editb.onclick=e=>{ e.stopPropagation(); setState({selId:o.id,tab:'info',page:'detail'}); };

    ab2.append(nb,matb,timeb,editb);
    card.appendChild(ab2);
    ol.appendChild(card);
  });
  frag.appendChild(ol);
  return frag;
}

function renderCalendar(){
  const {calYear,calMonth,data} = appState;
  const orders=data.orders||[];
  const monthNames=['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
  const dayNames=['Po','Ut','St','Št','Pi','So','Ne'];
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const adjustedFirst=(firstDay+6)%7;
  const deadlinesByDay={};
  orders.forEach(o=>{
    const dl=o.deadlineDate?new Date(o.deadlineDate):o.depositDate?new Date(new Date(o.depositDate).setMonth(new Date(o.depositDate).getMonth()+2)):null;
    if(dl&&dl.getFullYear()===calYear&&dl.getMonth()===calMonth){
      const d=dl.getDate();
      if(!deadlinesByDay[d]) deadlinesByDay[d]=[];
      deadlinesByDay[d].push(o);
    }
  });
  const today2=new Date();
  const frag=document.createDocumentFragment();
  frag.appendChild(renderTopBar('📅 Kalendár',()=>setState({subPage:null})));
  const wrap=el('div',{style:{padding:'12px 16px'}});
  const nav=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}});
  const prevBtn=el('button',{style:{background:'#1F2937',border:'none',borderRadius:'8px',color:'#fff',fontSize:'18px',width:'36px',height:'36px',cursor:'pointer'}},'‹');
  prevBtn.onclick=()=>{ if(calMonth===0) setState({calMonth:11,calYear:calYear-1}); else setState({calMonth:calMonth-1}); };
  const nextBtn=el('button',{style:{background:'#1F2937',border:'none',borderRadius:'8px',color:'#fff',fontSize:'18px',width:'36px',height:'36px',cursor:'pointer'}},'›');
  nextBtn.onclick=()=>{ if(calMonth===11) setState({calMonth:0,calYear:calYear+1}); else setState({calMonth:calMonth+1}); };
  nav.append(prevBtn,el('span',{style:{color:'#F9FAFB',fontWeight:'700',fontSize:'17px'}},`${monthNames[calMonth]} ${calYear}`),nextBtn);
  wrap.appendChild(nav);
  const dayNamesRow=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px',marginBottom:'4px'}});
  dayNames.forEach(d=>dayNamesRow.appendChild(el('div',{style:{textAlign:'center',color:'#4B5563',fontSize:'11px',padding:'4px 0',fontWeight:'700'}},d)));
  wrap.appendChild(dayNamesRow);
  const grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'3px'}});
  for(let i=0;i<adjustedFirst;i++) grid.appendChild(el('div'));
  for(let day=1;day<=daysInMonth;day++){
    const isToday=today2.getDate()===day&&today2.getMonth()===calMonth&&today2.getFullYear()===calYear;
    const events=deadlinesByDay[day]||[];
    const cell=el('div',{style:{background:isToday?'#1E3A5F':events.length?'#0D1117':'#0a0a0a',borderRadius:'8px',padding:'6px 4px',minHeight:'52px',border:isToday?'1px solid #3B82F6':events.length?'1px solid #1F2937':'1px solid transparent',textAlign:'center'}});
    cell.appendChild(el('div',{style:{color:isToday?'#60A5FA':'#9CA3AF',fontSize:'13px',fontWeight:isToday?'700':'400',marginBottom:'2px'}},String(day)));
    events.forEach(o=>{
      const st=statusOf(o.status);
      const ev=el('div',{style:{fontSize:'9px',background:st.color+'22',color:st.color,borderRadius:'3px',padding:'1px 3px',marginTop:'2px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',cursor:'pointer'}},o.customerName||o.title);
      ev.onclick=()=>setState({subPage:null,selId:o.id,tab:'info',page:'detail'});
      cell.appendChild(ev);
    });
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  frag.appendChild(wrap);
  return frag;
}

function renderYearly(){
  const {calYear,data} = appState;
  const orders=data.orders||[];
  const months=['Jan','Feb','Mar','Apr','Máj','Jún','Júl','Aug','Sep','Okt','Nov','Dec'];
  const byMonth=Array(12).fill(null).map((_,m)=>{
    const mo=orders.filter(o=>{ const d=new Date(o.createdAt); return d.getFullYear()===calYear&&d.getMonth()===m; });
    const paid=mo.reduce((s,o)=>{ const dep=parseFloat(o.depositPaid)||0; const pr=parseFloat(o.price)||0; const dpl=o.vyplatena&&pr>dep?pr-dep:0; return s+dep+dpl; },0);
    const mat=mo.reduce((s,o)=>s+(o.materials||[]).reduce((a,m2)=>a+(m2.cost||0),0),0);
    return {label:months[m],count:mo.length,paid,mat,profit:paid-mat};
  });
  const maxProfit=Math.max(...byMonth.map(m=>Math.abs(m.profit)),1);
  const totalPaid=byMonth.reduce((s,m)=>s+m.paid,0);
  const totalMat2=byMonth.reduce((s,m)=>s+m.mat,0);
  const totalProfit=totalPaid-totalMat2;

  const frag=document.createDocumentFragment();
  const yearNav=el('div',{style:{display:'flex',gap:'6px',alignItems:'center'}});
  const yp=el('button',{style:{background:'#1F2937',border:'none',borderRadius:'6px',color:'#9CA3AF',padding:'4px 10px',cursor:'pointer',fontSize:'16px'}},'‹');
  yp.onclick=()=>setState({calYear:calYear-1});
  const yn=el('button',{style:{background:'#1F2937',border:'none',borderRadius:'6px',color:'#9CA3AF',padding:'4px 10px',cursor:'pointer',fontSize:'16px'}},'›');
  yn.onclick=()=>setState({calYear:calYear+1});
  yearNav.append(yp,el('span',{style:{color:'#F9FAFB',fontWeight:'700',fontSize:'15px'}},String(calYear)),yn);
  frag.appendChild(renderTopBar('📊 Ročný prehľad',()=>setState({subPage:null}),yearNav));

  const wrap=el('div',{style:{padding:'12px 16px'}});
  const cards=el('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}});
  function ycard(lbl,val,color,bg,border){
    const c=el('div',{style:{flex:'1',background:bg||'#111827',borderRadius:'10px',padding:'10px 12px',border:`1px solid ${border||'#1F2937'}`}});
    c.append(el('div',{style:{color:'#4B5563',fontSize:'9px',textTransform:'uppercase',letterSpacing:'1px'}},(lbl)),el('div',{style:{color,fontWeight:'700',fontSize:'17px',marginTop:'3px'}},val));
    return c;
  }
  cards.append(ycard('Prijaté',fmt(totalPaid),'#F59E0B'),ycard('Materiál',fmt(totalMat2),'#EF4444'),ycard('Reálny zisk',fmt(totalProfit),totalProfit>=0?'#10B981':'#EF4444',totalProfit>=0?'#052E1C':'#2D0A0A',totalProfit>=0?'#065F46':'#3D0A0A'));
  wrap.appendChild(cards);

  // Bar chart
  const chart=el('div',{style:{background:'#111827',borderRadius:'12px',padding:'16px 12px 8px',border:'1px solid #1F2937',marginBottom:'12px'}});
  chart.appendChild(el('div',{style:{color:'#4B5563',fontSize:'10px',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'12px'}},'Reálny zisk po mesiacoch'));
  const bars=el('div',{style:{display:'flex',alignItems:'flex-end',gap:'3px',height:'100px'}});
  byMonth.forEach(m=>{
    const col=el('div',{style:{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px'}});
    const barH=Math.max(3,(Math.abs(m.profit)/maxProfit)*90);
    col.append(el('div',{style:{width:'100%',borderRadius:'4px 4px 0 0',background:m.profit>0?'#10B981':m.profit<0?'#EF4444':'#1F2937',height:`${barH}px`}}),el('div',{style:{color:'#4B5563',fontSize:'8px',textAlign:'center'}},m.label));
    bars.appendChild(col);
  });
  chart.appendChild(bars);
  wrap.appendChild(chart);

  // Table
  const tbl=el('div',{style:{background:'#111827',borderRadius:'12px',border:'1px solid #1F2937',overflow:'hidden'}});
  byMonth.filter(m=>m.count>0).forEach(m=>{
    const row=el('div',{style:{padding:'10px 16px',borderBottom:'1px solid #0D1117',display:'flex',alignItems:'center',gap:'8px'}});
    row.append(el('span',{style:{color:'#9CA3AF',fontWeight:'700',width:'30px',fontSize:'13px'}},m.label),el('span',{style:{color:'#4B5563',fontSize:'12px',width:'28px'}},`${m.count}ks`),el('span',{style:{color:'#F59E0B',fontSize:'13px',flex:'1'}},fmt(m.paid)));
    if(m.mat>0) row.appendChild(el('span',{style:{color:'#EF4444',fontSize:'12px'}},`−${fmt(m.mat)}`));
    row.appendChild(el('span',{style:{color:m.profit>=0?'#10B981':'#EF4444',fontWeight:'700',fontSize:'14px'}},fmt(m.profit)));
    tbl.appendChild(row);
  });
  if(byMonth.every(m=>m.count===0)) tbl.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'40px'}},`Žiadne zákazky v roku ${calYear}`));
  wrap.appendChild(tbl);
  frag.appendChild(wrap);
  return frag;
}

function renderCustomers(){
  const orders=appState.data.orders||[];
  const customerMap={};
  orders.forEach(o=>{
    const key=(o.customerName||'').trim().toLowerCase()||o.customerPhone||'neznamy';
    if(!customerMap[key]) customerMap[key]={name:o.customerName||'Neznámy',phone:o.customerPhone,orders:[]};
    customerMap[key].orders.push(o);
  });
  const customers=Object.values(customerMap).sort((a,b)=>b.orders.length-a.orders.length);
  const frag=document.createDocumentFragment();
  frag.appendChild(renderTopBar('👥 Zákazníci',()=>setState({subPage:null})));
  const wrap=el('div',{style:{padding:'8px 16px'}});
  if(!customers.length) wrap.appendChild(el('div',{style:{textAlign:'center',color:'#374151',padding:'60px'}},'Žiadni zákazníci'));
  customers.forEach(c=>{
    const total=c.orders.reduce((s,o)=>s+(parseFloat(o.price)||0),0);
    const card2=el('div',{style:{background:'#0D1117',borderRadius:'12px',padding:'14px 16px',marginBottom:'10px',border:'1px solid #1F2937'}});
    const r1=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}});
    const rl=el('div');
    rl.appendChild(el('div',{style:{color:'#F9FAFB',fontWeight:'700',fontSize:'16px'}},c.name));
    if(c.phone){ const a=el('a',{href:`tel:${c.phone}`,style:{color:'#3B82F6',fontSize:'13px'}},c.phone); rl.appendChild(a); }
    const rr=el('div',{style:{textAlign:'right'}});
    rr.append(el('div',{style:{color:'#10B981',fontWeight:'700'}},fmt(total)),el('div',{style:{color:'#4B5563',fontSize:'12px'}},`${c.orders.length} zákaziek`));
    r1.append(rl,rr);
    card2.appendChild(r1);
    c.orders.forEach(o=>{
      const st=statusOf(o.status);
      const or=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#111827',borderRadius:'8px',padding:'8px 12px',marginBottom:'4px',cursor:'pointer'}});
      or.onclick=()=>setState({subPage:null,selId:o.id,tab:'info',page:'detail'});
      or.append(el('span',{style:{color:'#D1D5DB',fontSize:'13px'}},o.title||'Bez názvu'));
      const orr=el('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
      if(o.price) orr.appendChild(el('span',{style:{color:'#9CA3AF',fontSize:'12px'}},fmt(o.price)));
      orr.appendChild(el('span',{style:{fontSize:'11px',color:st.color,fontWeight:'600'}},st.label));
      or.appendChild(orr);
      card2.appendChild(or);
    });
    wrap.appendChild(card2);
  });
  frag.appendChild(wrap);
  return frag;
}

  const archived=appState.data.archive||[];

  const frag=document.createDocumentFragment();

  const wrap=el('div',{style:{padding:'8px 16px'}});
  if(!archived.length){
    const emp=el('div',{style:{textAlign:'center',color:'#374151',padding:'60px'}});
    emp.append(el('div',{style:{fontSize:'40px',marginBottom:'12px'}},'📦'),el('div',{},'Archív je prázdny'),el('div',{style:{fontSize:'12px',marginTop:'8px',color:'#374151'}},'Hotové a vyplatené zákazky tu presunúť tlačidlom v detaile'));
    wrap.appendChild(emp);
  }
  archived.forEach(o=>{
